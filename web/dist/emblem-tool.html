<!DOCTYPE html>
<!--
  PS2《装甲核心》徽章工具 —— 界面外壳（**开发期**用的模板）。

  ⚠ 这个文件**不是**给最终用户双击的。用户双击的是构建产物 web\dist\emblem-tool.html
    （由 node web\build.mjs 生成：把样式表链接换成内联 style 块，
     再把下面那行占位注释换成内联的经典脚本块）。

  布局依据：web\SPEC.md §四（顶栏 / 上=图片处理 / 下=8 槽）。

  ★ 写这份外壳时的一条纪律（踩过）：**注释里不要出现尖括号标签字面量**
    （比如 link 标签、script 标签的写法）。构建自检要按标签数与外部引用扫全文，
    注释里的标签字面量会被当成真标签，于是"明明只有 1 个脚本"却报出 7 个。
    需要举例时就用文字描述，或者在构建器里改扫描方式。
-->
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title data-en="PS2 Armored Core · Emblem Tool" data-ja="PS2 アーマード・コア · エンブレムツール" data-ko="PS2 아머드 코어 · 엠블럼 도구">PS2 装甲核心 · 徽章工具</title>
<style>
/*
 * PS2 装甲核心 · 徽章工具 —— 暗色主题样式。
 * 配色参考 `web/probe.html`（同一套 CSS 变量名，方便对照）。
 *
 * ⚠ 本文件只在**开发期**被 `web/index.html` 用 <link> 引用；
 *   构建产物把整份 CSS 内联进 <style>，运行时**没有任何外部文件**。
 */

:root {
  --bg: #14171c;
  --fg: #dfe4ea;
  --dim: #8b97a8;
  --ok: #41c07a;
  --bad: #e0554a;
  --warn: #e0a94a;
  --box: #1d2229;
  --box2: #232931;
  --line: #2b323c;
  --accent: #4a90d9;
}

* { box-sizing: border-box; }

html, body { height: 100%; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  font: 13.5px/1.65 "Microsoft YaHei", system-ui, "Segoe UI", sans-serif;
  display: flex;
  flex-direction: column;
  gap: 10px;
  padding: 10px 12px 14px;
}

/**
 * ★ 0.47：日语 / 韩语各自的字体栈。
 *
 * 为什么必须有：上面 `body` 的字体栈是**中文优先**（`Microsoft YaHei`），而汉字在
 * 中日文里字形不同（直 / 骨 / 今 / 海 / 真 …）—— 不换字体的话日文界面会画出**中文字形**；
 * 韩文则要靠 fallback 去找谚文字体，字重与行高都会跳。
 *
 * 判据靠 `<html lang>`（`setLang()` 会按语言写 `zh-CN` / `en` / `ja` / `ko`）⇒ `:lang()` 选择器。
 * ⚠ 只用**系统自带**字体（这门工具是零安装单文件，不许打包 webfont）：
 *   Windows 自带 Yu Gothic UI / Meiryo、Malgun Gothic；macOS 自带 Hiragino / Apple SD Gothic Neo。
 */
html:lang(ja) body {
  font-family: "Yu Gothic UI", "Yu Gothic", Meiryo, "Hiragino Kaku Gothic ProN", "Hiragino Sans",
    "MS PGothic", system-ui, sans-serif;
}

html:lang(ko) body {
  font-family: "Malgun Gothic", "Apple SD Gothic Neo", "Nanum Gothic", system-ui, sans-serif;
}

code { font-family: Consolas, "Courier New", monospace; }

.dim { color: var(--dim); }
.small { font-size: 12px; }
.ok { color: var(--ok); }
.bad { color: var(--bad); }
.warn { color: var(--warn); }

/* ─────────────────────────── 通用块 ─────────────────────────── */

.card {
  background: var(--box);
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 10px 12px;
}

.pane-head {
  display: flex;
  align-items: baseline;
  gap: 10px;
  margin-bottom: 8px;
  border-bottom: 1px solid var(--line);
  padding-bottom: 6px;
}
.pane-title { font-weight: 600; font-size: 13.5px; white-space: nowrap; }

.row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
/*
 * ★★ `hidden` 属性必须真的不显示 —— 这条**不能省**（0.9 用无头浏览器截图抓到的真 bug）。
 *
 * 浏览器默认样式里 `[hidden] { display: none }` 的优先级**低于**任何作者写的 class 规则，
 * 所以 `#crop-actions`（同时带 `.row { display: flex }`）即使有 `hidden` 也照样渲染出来 ——
 * 用户没进取景视图时也会看到那行"拖动图片，把要用的部分放进白框里（滚轮缩放）〔确定取景〕〔取消〕"。
 * 放在最前面 + `!important`：后面无论谁再给它加 `display`，都不会把这个语义盖掉。
 */
[hidden] { display: none !important; }
.lbl { color: var(--dim); font-size: 12.5px; white-space: nowrap; }

button {
  background: #2a323d;
  color: var(--fg);
  border: 1px solid #3b4552;
  border-radius: 6px;
  padding: 6px 11px;
  font-size: 13px;
  font-family: inherit;
  cursor: pointer;
}
button:hover:not(:disabled) { background: #333d4a; }
button:disabled { opacity: .5; cursor: default; }
button.primary { background: #2f4a68; border-color: #3f6489; }
button.primary:hover:not(:disabled) { background: #3a5b7e; }
button.quiet { background: transparent; color: var(--dim); }
button.big { padding: 9px 16px; font-size: 13.5px; }

select, input[type=text], input[type=number] {
  background: #0f1216;
  color: var(--fg);
  border: 1px solid var(--line);
  border-radius: 5px;
  padding: 5px 7px;
  font: inherit;
  font-size: 12.5px;
}
select { min-width: 90px; }
input.num { width: 78px; }
input[type=range] { width: 130px; vertical-align: middle; }

.hint { color: var(--dim); font-size: 11.5px; line-height: 1.5; margin-top: 3px; }

/* ─────────────────────────── 顶栏 ─────────────────────────── */

.topbar {
  display: flex;
  align-items: center;
  gap: 16px;
  flex-wrap: wrap;
  background: var(--box);
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 9px 12px;
}
.brand { display: flex; flex-direction: column; line-height: 1.25; }
.brand-title { font-weight: 700; font-size: 14.5px; }
.brand-sub { color: var(--dim); font-size: 11.5px; }

.topbar-block {
  display: flex;
  align-items: center;
  gap: 7px;
  flex-wrap: wrap;
  padding: 4px 10px;
  border-left: 1px solid var(--line);
}
.card-info { font-size: 12.5px; }
/* ⚠ 只用来放"⚠ 未验证"这类提醒；已验证的作品这里是空的（0.10 起顶栏不再重复作品说明） */
.game-note { color: var(--dim); font-size: 11.5px; max-width: 460px; }
.game-error { color: var(--bad); font-size: 12px; }

/*
 * ★ 0.28：语言选择（用户："在最上面一栏的右侧，加入一个语言选项"）。
 *   `margin-left: auto` 把它顶到**最右**（与 #btn-pcsx2-toggle 同一个手法）；
 *   窄屏时 `.topbar` 是 `flex-wrap: wrap`，它会自然折到下一行 —— 不用额外断点。
 */
.lang-pick { margin-left: auto; }
.lang-pick select { min-width: 96px; }

/*
 * ★ 0.36（用户）：语言标签**常显双语**（"语言/Language"，中英两态都是这一句）
 *   ＋ **纯白**，把它从顶栏那一片灰字（`.lbl` = `--dim`）里顶出来。
 *
 *   高亮手段**只有三个"字本身"的属性**：颜色纯白 + `font-weight: 600` + 一点点 `letter-spacing`。
 *   ⚠ 这条规则里**不许**出现 `text-shadow` / `box-shadow` / `filter` / 动画 —— `ui.test.ts` 分节 (p) ⑤b
 *   直接断言"一条都不许有"（`lang-pick .lbl` 的高亮口径就是"纯白 + 字重"，不加任何特效）。
 *   ⚠ 也不动 `font-size` / `padding` / `margin` ⇒ 除了"文字本身变长"之外没有任何位移。
 *   文字变长那一项的实测代价（A/B，同一页面只换标签文字）：顶栏 1050px 视口起与旧标签
 *   **完全一致**；**1000px** 视口下由 1 行变 2 行（旧标签是 900px 才折行）—— 顶栏本来就是
 *   `flex-wrap: wrap`，这是接受了的代价（不是 bug，`SPEC.md` 有记）。
 */
.lang-pick .lbl {
  color: #fff;
  font-weight: 600;
  letter-spacing: .02em;
}
/* （0.10 删掉了 `.pcsx2-summary`：顶栏那行 PCSX2 摘要按用户要求整块删除，面板本身仍在最下面） */

#card-drop.drop-hot { outline: 2px dashed var(--accent); outline-offset: 2px; }

/* ─────────────────────────── PCSX2 自检（页面最下面、全宽、★ 默认折叠） ─────────────────────────── */

/*
 * 位置与宽度：它现在是 `<body>` 里最后一个 section（8 槽 → 写卡提示/日志 → 这里），
 * 而且是**普通块级元素** —— body 是 flex column，所以它自然占满整行（全宽），
 * 不参与 `.upper` / `.slot-grid` 的栅格，也就不会留下空列。
 *
 * ★ 0.23（用户："自检改成默认折叠起来"）：头一行常驻（标题 + 说明 + 〔展开/收起〕），
 *   其余整块（三条入口 + 结论表 + "这块面板是干什么的"）放进 `#pcsx2-panel[hidden]`。
 *   折叠靠 `[hidden] { display: none !important }`（见文件上方那条，**不能**用 inline display）。
 */
.pcsx2-bar {
  border-color: #4a4128;
  margin-top: 2px;
}
/* 头一行三个元素（标题 / 说明 / 折叠按钮）：说明占住剩余宽度，按钮推到最右；太窄时整行可换行 */
.pcsx2-bar .pane-head { flex-wrap: wrap; }
.pcsx2-bar .pane-head .dim { flex: 1 1 320px; }
#btn-pcsx2-toggle { margin-left: auto; }
.pcsx2-default { font-size: 12.5px; margin: 6px 0 2px; }
.pcsx2-default code {
  background: #0f1216;
  border: 1px solid var(--line);
  border-radius: 4px;
  padding: 1px 6px;
  color: var(--fg);
}
.dropzone-inline {
  border: 1px dashed #4a5260;
  border-radius: 6px;
  padding: 8px 12px;
  color: var(--dim);
  font-size: 12px;
  flex: 1 1 320px;
}
.dropzone-inline.drop-hot { border-color: var(--accent); color: var(--fg); }
#pcsx2-body { margin-top: 8px; display: flex; flex-direction: column; gap: 5px; font-size: 12.5px; }
.pcsx2-table { border-collapse: collapse; width: 100%; font-size: 12.5px; margin-top: 4px; }
.pcsx2-table th, .pcsx2-table td {
  text-align: left;
  padding: 4px 10px 4px 0;
  border-bottom: 1px solid var(--line);
  vertical-align: top;
}
.pcsx2-table th { color: var(--dim); font-weight: 500; }
.pcsx2-table .row-warn { background: #2a2418; }

/*
 * 自检条的"这块面板是干什么的"说明块。
 * ★ 用户反馈"我有点没懂"，所以空状态时不是只说"把文件拖进来"，
 *   而是先说清：它解决什么问题 / 什么时候该看 / 怎么用 / 结论怎么读。
 */
.pcsx2-help {
  border: 1px solid var(--line);
  border-left: 3px solid var(--accent);
  border-radius: 6px;
  background: #191e25;
  padding: 9px 12px;
  font-size: 12.5px;
  line-height: 1.7;
}
.pcsx2-help-title { font-weight: 600; margin-bottom: 4px; }
.pcsx2-help-body { margin-top: 4px; color: var(--fg); }
.pcsx2-help-body b { color: var(--accent); margin-right: 5px; }

/* ────────────── 上：图片处理（1 格当前图片 + 右侧参数侧栏） ────────────── */

/*
 * ★ 布局演变（三轮，理由都写在这里，免得以后来回改）：
 *
 *   第一版：`minmax(200px,1fr) auto auto minmax(280px,340px)`
 *     → 中间两块 `auto` 按画布内容撑开，唯一可压缩的 `1fr`（原图列）**被压成一条窄缝**（用户截图 ①）。
 *   第二版：`repeat(3, minmax(220px,1fr)) minmax(260px,320px)` + 1400/900 折行
 *     → 三块视图等宽了，但**参数列仍占第 4 列**，把三块视图一起挤窄。
 *   第三版：`repeat(3, minmax(240px,1fr))` + 参数整行 + ≤1100 两列 / ≤760 单列
 *     → 三块等宽等高、无滚动条（用户截图 ② 的"白滚动条"也修掉了）。
 *   第四版（用户 2026-10-05 定稿）：
 *     "不需要始终显示原图，只需要一张当前的图片即可，也就是变成一格；
 *      然后右边 1/3 的空间放之后要用到的工具。"
 *   第五版（**本版**，0.22，用户 2026-10-06 定）：右栏**不放工具、放参数**。
 *     "我突然觉得我们是不是没有必要做工具这一栏，毕竟其他优秀的图像处理工具有很多"
 *     ⇒ 内置像素编辑器（M4b）**明确不做**（理由与替代流程见 SPEC.md §六）；
 *       「工具侧栏」整块删掉，右栏给**参数**（原来它在 `</main>` 之后独立一整行）。
 *     · `.upper` = **2 列**：左 `minmax(0, 1fr)` 是"当前图片"那一格，右 `minmax(190px, 220px)` 是**参数侧栏**；
 *       ★ 0.23（用户）："参数一栏可以把水平宽度缩小了，现在太大了" ⇒ 右列从 `1fr`（≈1/3 宽）
 *         改成**固定上限 220px**。参数只有两格（一个下拉 + 一条滑杆），220px 富余；
 *         省下来的宽度全给图片格（4× 预览更容易铺满）。
 *     · 「原图」面板**整个删掉**（DOM + CSS 都不留），
 *       选图/粘贴/拖入搬到左格上方的**细工具条**（`.image-toolbar`）；
 *     · 左格中间是**一块** `.stage`：平时显示"当前图片"（`#stage-final`，索引 0 口径），
 *       点〔取景〕后**在同一格里**切成取景视图（`#stage-crop`：**固定的白色方框** + 可拖动的源图）；
 *       第五版（0.6）：白框固定 + 拖图片 + 滚轮绕框心缩放 + 复位/适应（见 `.crop-stage` 那段注释）；
 *       第六版（0.7）：取景拖动改成"只动视觉"（rAF 合帧，样式只写 transform，不再每帧刷面板）；
 *       第七版（0.8）：`.stage` 这块工作区改成**正方形**（`aspect-ratio: 1 / 1` + 最大边长上限 560px + 居中）。
 *       第八版（0.9）：用户看了 0.8 的截图后改口 ——「我截图中红圈部分，能不能改成
 *         **自动填满**或者说适应这一个长方形区域」⇒ `.stage` 去掉 `aspect-ratio` 与 `max-width`，
 *         改成"填满左格"（`flex: 1 1 auto` + `min-height` 兜底）。取景默认也从"整张图缩进框里"
 *         改成"**填满白框**"，并删掉了〔↺ 复位 / 适应〕按钮（见 `.stage` 那段注释）。
 *     · 断点：宽屏 2 列 → **≤1100px 上下堆叠**（图片格在上、参数在下，都整行）→ **≤760px** 仍单列。
 *       `.slot-grid` / `.lower-bottom` 的 1100 断点**没动**。
 */
.upper {
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(190px, 220px);
  gap: 10px;
  align-items: stretch;
}
/*
 * ⚠ 列定义的历史（别来回改）：
 *   0.9–0.21：`minmax(0, 2fr) minmax(260px, 1fr)`（右栏当时是"工具侧栏"，要放一堆工具按钮）
 *   0.22：右栏改成参数侧栏（内置编辑器不做了），列定义先原样留着
 *   0.23：★ 用户"参数一栏可以把水平宽度缩小了，现在太大了" ⇒ 右列改成 `minmax(190px, 220px)`
 *         （固定上限：参数就两个控件，不需要 1/3 屏宽）
 *
 * 备选方案（用户**没定**，别默认启用）：
 *   · "整页**太长了**"：把 `.stage` 的 `min-height` 上限调小（现在是 `clamp(320px, 62vh, 760px)`），
 *     例如 `clamp(280px, 44vh, 560px)`（代价：4× 预览会被容器压小，那行"已按容器缩放显示"会重新出现）。
 */
/* ≤1100px：改成上下堆叠（图片格在上、参数侧栏在下；两块都整行） */
@media (max-width: 1100px) {
  .upper { grid-template-columns: minmax(0, 1fr); }
}
/* ≤760px：仍然是单列（参数格本身已经没有最小高度限制，这里不需要额外规则了） */

/* ── 左格：细工具条 + 画布舞台 ── */

/*
 * ★ 2026-10-05（0.7 那一版，用户追加的一条）：**图片这块大面板改成规规矩矩的方角矩形**。
 *
 *   `.card` 的默认外观是"圆角 8px 的卡片"；用户要的是这一块（以及它内部的工具栏、舞台、
 *   取景图层）**方角 + 1px 细边框 + 深色底铺满** —— 也就是"一块画布面板"，不是一张卡片。
 *   ⚠ **只改这一块**：工具侧栏 / 参数行 / 8 槽 / 自检区仍是原来的圆角卡片
 *     （用户没让全局改；他要是想全局方角会另说）。
 *   ⚠ 白框（`.crop-frame`）的形状**不受影响**：它本来就是正方形，见下面的注释。
 */
.pane-image {
  display: flex;
  flex-direction: column;
  min-width: 0;                       /* 允许在 2fr 里被压缩，不要把栅格撑破 */
  border: 1px solid var(--line);      /* 细边框（与 .card 同款；写出来是为了"方角 + 细边"一眼可见） */
  border-radius: 0;                   /* ★ 方角 */
}
.image-toolbar {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
  padding-bottom: 8px;
  margin-bottom: 8px;
  border-bottom: 1px solid var(--line);
}
.image-toolbar .lbl { color: var(--dim); font-size: 12.5px; }
.image-toolbar .orig-badge { margin: 0; }

/*
 * 画布舞台 = **自动填满左侧面板的工作区**（2026-10-05，0.9 用户：
 * "我截图中红圈部分，能不能改成自动填满或者说适应这一个长方形区域"）。
 *
 * ## 尺寸规则
 *
 *   1. `flex: 1 1 auto` + `width: 100%` —— 宽度 = 列宽，高度 = **这一行剩下的全部高度**
 *      （同排的参数侧栏把行撑起来，舞台再长满它）⇒ 工作区随窗口大小**自动填满**，
 *      形状是**长方形**，不再是固定边长的正方形；
 *   2. `min-height: clamp(320px, 62vh, 760px)` —— ★ **兜底 + 下限**。窄屏（≤1100px）时上下堆叠，
 *      这一格的高度不再由同排元素决定；而舞台里那两层都是**绝对定位**（没有内在高度），
 *      没有这个下限它会塌成 0。宽屏时它同时决定"这块工作区**至少**多高"。
 *      ⚠ 取 62vh 是**量出来的**（0.10 那一版改的）：4× 预览要 512px，加内边距要 ≥ 524px 的舞台；
 *      原来写 56vh，在 852px 高的视口上只有 477px ⇒ 预览被压到 465px，还点亮了那句
 *      "已按容器缩放显示：期望 4×（512px）→ 实际约 3.63×（465px）"（用户："我希望它是完全展开的"）。
 *      62vh 在 852 上给 528px ⇒ 512 装得下；再高对取景/预览都没有帮助（白框上限 420px），只把页面拉长；
 *   3. **没有 `aspect-ratio`、也没有 `max-width`** —— 上一版（0.8）用
 *      `aspect-ratio: 1 / 1 + max-width: 560px + margin-inline: auto` 把它做成 560×560 的方块；
 *      用户看过后要求改成"填满"（"可以挤压右侧的工具"那句只保留了备选注释，0.22 起右侧是参数侧栏）。
 *
 * ## 白框规则一个字没动
 *
 *   白框仍是**固定的正方形**、边长 = 工作区**短边** × 70%（夹在 `[120, 420]`，
 *   见 `logic/cropGeometry.ts::frameSizeFor`）、框外照旧压暗。工作区变大 ⇒ 白框通常也更大
 *   （例如 700×430 的工作区 ⇒ 白框 301px），但那条"框只看舞台短边"的语义没变（`ui.test.ts` 有断言）。
 *
 * `position: relative` + `overflow: hidden`：里面叠两层（`#stage-final` 与 `#stage-crop`），
 * 同一时刻只显示一层 ⇒ "预览"与"取景"共用同一格，且永远不出滚动条（上一版定下的约定）。
 */
.stage {
  position: relative;
  flex: 1 1 auto;                     /* ★ 高度填满左格剩下的空间（同排参数侧栏撑出这一行） */
  width: 100%;
  min-height: clamp(320px, 62vh, 760px); /* ★ 兜底 + 下限：≥524px 才装得下 4×（512px）预览 */
  border: 1px solid var(--line);
  border-radius: 0;                   /* ★ 方角（原来是 6px 圆角） */
  background: #0f1216;
  overflow: hidden;
}
/* 图片面板内部的这几块都跟着方角（工具栏 / 舞台 / 取景图层 / 取景舞台） */
.pane-image .image-toolbar,
.pane-image .stage,
.pane-image .crop-layer,
.pane-image .crop-stage {
  border-radius: 0;
}
.stage-layer {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
}
.stage-layer[hidden] { display: none; }

/*
 * 取景区：**中性深色**底。
 * ⚠ 上一版这里是**棋盘格**（表示"透明"）—— 用户明确否掉了：
 *   "棋盘格会让人以为在看透明度"，而取景要看的只是"白框里那块图"。
 *   深色还能和白框形成对比，一眼看清哪块会被裁下来。
 */
.crop-layer {
  background: #0b0e12;
}

/*
 * ★★ `#view-preview` **必须自己有尺寸**（`width/height: 100%`），不能让浏览器"按内容收缩"。
 *
 * 0.9 用户报的"载入图片以后默认这么小"就是这个 bug：`.stage-layer` 是 flex 容器，而
 * `#view-preview` 没有任何尺寸规则 ⇒ 它的盒子 = 里面那张 canvas 的盒子（content 决定），
 * 可 canvas 的尺寸**正是** `pipeline.ts::fitDisplaySize()` 量了 `#view-preview` 之后算出来的
 * ⇒ **量一次缩一次**（128 → 116 → 104 → …），最后缩成 68px，还把那句
 * "已按容器缩放显示：期望 4×（512px）→ 实际约 0.53×（68px）"给点亮了。
 *
 * 现在它是"铺满舞台 + 居中"的一层：量到的就是舞台的可用尺寸 ⇒ 4× 就是 512px（只有真的装不下才缩）。
 */
#stage-final #view-preview {
  width: 100%;
  height: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
}

/* 当前图片（= 将来编辑画布）：128×128 的方画布，等比自适应 */
#stage-final #view-preview canvas {
  display: block;
  aspect-ratio: 1 / 1;
  max-width: 100%;
  max-height: 100%;
  width: auto;
  height: auto;
  image-rendering: pixelated;
  background: #14181d;
}

/*
 * 取景视图：白框固定在舞台正中，**图片**在它下面按 transform 缩放/平移。
 *
 * ★ `#view-source` 的坐标原点 = `#crop-stage` 的原点（都从 0,0 起）⇒ 白框与图片
 *   共用同一个坐标系，cropView.ts 的换算只需要"框矩形 + 显示倍率 k"两个量。
 */
.crop-stage {
  position: relative;
  width: 100%;
  height: 100%;
  overflow: hidden;
  cursor: grab;
  touch-action: none;
}
.view-source {
  position: absolute;
  left: 0;
  top: 0;
  width: 0;
  height: 0;
}
/*
 * ⚠ 画布按**源图自然尺寸**做 CSS 像素，再整体 scale —— 所以这里**绝对不能**有
 *   `max-width/max-height: 100%`（那会让浏览器二次缩放，指针换算就跟屏幕对不上了）。
 */
.view-source canvas {
  position: absolute;
  left: 0;
  top: 0;
  display: block;
  max-width: none;
  max-height: none;
  transform-origin: 0 0;
  will-change: transform;
}
/*
 * ★ 白色方框 = "取景区"（用户要的示意区域）。位置/边长由 cropView.ts 按舞台算出来，**拖不动**。
 *   ⚠ 它**永远是正方形**（`frameRectFor()` 只给一个 `size`，宽高都写这个值），
 *     用户说的"改成矩形"指的是**外面那块大面板**（见 `.pane-image` 的方角注释）—— 别动这里。
 * `box-shadow: 0 0 0 9999px` 把框外压暗：既突出白框，也直观地表示"框外的部分不要"。
 */
.crop-frame {
  position: absolute;
  box-sizing: border-box;
  border: 2px solid #ffffff;
  box-shadow:
    0 0 0 9999px rgba(6, 8, 11, 0.62),
    inset 0 0 0 1px rgba(0, 0, 0, 0.55);
  pointer-events: none;
}
.crop-frame::after {
  /*
   * ★ 0.41（审查抓到）：角标文字**不再写死** '128×128' —— 目标边长的唯一来源是
   *   `state.params.targetSize`（`defaults.ts::TARGET_SIZE`），写死的话将来换值（例如 PS1 的
   *   64×64）这里就变成一句假话。现在读 `#crop-frame` 的 `data-label`，由
   *   `cropView.ts::layoutCropView()` 按 `params.targetSize` 写进去。
   */
  content: attr(data-label);
  position: absolute;
  left: 0;
  top: -18px;
  font-size: 10.5px;
  color: #ffffff;
  text-shadow: 0 1px 2px rgba(0, 0, 0, 0.9);
  white-space: nowrap;
}
.crop-stage.dragging { cursor: grabbing; }
.crop-stage.dragging .crop-frame { border-color: #ffffff; }

.crop-actions {
  flex: 0 0 auto;
  margin-top: 8px;
  gap: 8px;
  align-items: center;
  flex-wrap: wrap;
}

/*
 * ★ 0.12：取景动作行里的**实时读数**（就一行，跟着拖动/滚轮变）。
 * ⚠ 存在的理由：这些数字原来只写在 `#status` 里，而状态行在页面最下面（8 槽那一块），
 *   取景时看不到 —— 用户问"状态行在哪"，所以把同一份信息搬到白框正下方。
 * `tabular-nums` 让数字跳动时不抖；到"最小（1:1）"时换成警示色，一眼看出滚轮到底了。
 */
.crop-readout {
  flex: 0 0 auto;
  color: var(--dim);
  font-size: 12px;
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}
.crop-readout.at-min { color: var(--warn); }
/*
 * 取景那行的一句话说明（用户要的：一行就够）。
 * ★ 0.38：改成**定宽不压扁**（`flex: 0 0 auto` + `nowrap`）—— 滑条进来之后这行更挤了，
 *   原来的 `flex: 1 1 220px` 会把句子从中间掰断（实测"（滚轮缩 / 放）"）；现在窄了就**整句**
 *   折到第二行，读起来还是完整一句话。
 * ⚠ 别直接删掉它：取景时**页面最下面的状态行是看不到的**（0.12 就是为这个把读数搬上来的），
 *   这行是"拖图片 / 滚轮"唯一在视野内的说明。
 */
.crop-hint {
  flex: 0 0 auto;
  white-space: nowrap;
  color: var(--dim);
  font-size: 12px;
}

/*
 * ★ 0.38（用户）：白框边长滑条 + 输入框（"现在的取景框只能用鼠标缩放，精度不够高"）。
 *   · 滑条宽度 `clamp(200px, 30vw, 420px)` —— ★ 0.38 第二版（用户："把滑条做长一点"）：
 *     原来 120–240px 只有 ~120 档像素，不够用。
 *   ⚠ **必须用 id 选择器**：浏览器**内置样式表**里有 `input[type="range"] { width: 130px }`，
 *     它的优先级（0,1,1）**高于**类选择器 `.crop-size-range`（0,1,0）⇒ 用类写宽度会被它压掉、
 *     滑条永远 130px（这一版第一稿就是这么翻车的，实测 `cssWidth: "130px"`）。
 *     顺带把输入框也写成 id：同一条内置规则里 `input[type=number]` 之类的属性谁先谁后不必再猜。
 *   · 滑条用 `accent-color` 取主题强调色（Chromium 自带轨道样式，不必手搓）；
 *     输入框 68px 够放 4 位数（源图长边一般 < 4096）+ `tabular-nums`（数字跳动不抖）。
 *   ⚠ 两个都 `flex: 0 0 auto`：它们是"定宽控件"，让它俩伸缩会随窗口宽度乱跑。
 */
#crop-size-range {
  flex: 0 0 auto;
  width: clamp(200px, 30vw, 420px);
  accent-color: var(--accent);
}
#crop-size-num {
  flex: 0 0 auto;
  width: 68px;
  font-variant-numeric: tabular-nums;
}

/*
 * ★ 0.38（用户）：〔确定取景〕〔取消〕**右对齐**（用户："确定取景和取消右对齐"）。
 *   `margin-left: auto` 挂在**第一个**按钮上 ⇒ 它俩连同后面的空白一起被推到行尾；
 *   窄屏折行时这两个按钮会整体落到第二行、并且仍然贴右边（auto 外边距在折行后照样生效）。
 *   ⚠ 别改成给 `.crop-actions` 加 `justify-content: space-between`：那会把中间的
 *   提示与读数拆开（用户要的是"按钮贴右"，不是"整行摊开"）。
 */
#btn-crop-ok {
  margin-left: auto;
}

/* "已按容器缩放显示：期望 8×（1024px）→ 实际约 3×（384px）" —— 淡色小字 */
.zoom-note-host { flex: 0 0 auto; min-height: 0; }
.zoom-note { color: var(--dim); font-size: 11px; }

/* ── 右格：参数侧栏（0.22：原来这里是「工具侧栏」，内置编辑器不做了 ⇒ 位置给了参数） ── */

.pane-params {
  display: flex;
  flex-direction: column;
  min-width: 0;
  min-height: 0;
}
/* 侧栏里字段**竖排**（宽屏时不再是"独立整行 + 横向成对"那套） */
.params-grid {
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.params-grid .field {
  /* 每个字段是一组"标签 + 控件 + 小字说明" */
  min-width: 0;
  margin: 0;
}
.params-grid .field > label {
  display: block;
  color: var(--dim);
  font-size: 12.5px;
  margin-bottom: 4px;
}
.params-grid .field > select,
.params-grid .field > input[type='number'] { width: 100%; }
.params-grid .field > input[type='range'] { width: 100%; }
.params-grid .hint { margin-top: 4px; }

/* ── ★ 0.26：必须点掉的弹窗（打开页面时的告知 / 取景模式拦截） ── */

.modal-host {
  position: fixed;
  inset: 0;
  z-index: 100;
  background: rgba(4, 6, 9, 0.72);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
}
.modal-host[hidden] { display: none !important; }
.modal-box {
  max-width: 620px;
  background: var(--box);
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 16px 18px;
  box-shadow: 0 12px 40px rgba(0, 0, 0, 0.55);
}
.modal-title { font-weight: 600; font-size: 14.5px; margin-bottom: 8px; }
.modal-body { font-size: 13px; color: var(--fg); white-space: pre-wrap; }
.modal-actions { margin-top: 14px; text-align: right; }

/* ─────────────────────────── 下：8 槽 ─────────────────────────── */

/* ★ 0.37：原来是"8 槽摘要行"的位置，现在只放"本作品在卡上还没目录"那条条件警告（没情况时 hidden）。 */
.slot-note { margin-bottom: 6px; font-size: 12px; }

.slot-grid {
  display: grid;
  /* ★ 0.31：最小列宽 150 → 200px；★ 0.37：文字没了，图片占满整格 ⇒ 这个下限继续管着"图片最小多大" */
  grid-template-columns: repeat(4, minmax(200px, 1fr));
  gap: 8px;
}
/*
 * ★ 0.37：窄屏断点从"2 列"改成 **4 列** —— 文字删掉、图片占满整格之后，2 列会让每张图变成
 *   496px 见方（1100px 视口实测），8 格撑出 3457px 的页面；4 列是 245px 左右，和宽屏一个量级。
 */
@media (max-width: 1100px) { .slot-grid { grid-template-columns: repeat(4, minmax(120px, 1fr)); } }

/*
  ★ 0.37（用户）：8 格改成"**上面 = 槽号**、**下面 = 缩略图**"（用户给的版式："上面是槽（序号），
  下面红色的部分显示图片（红色部分是位置示意）"）—— 卡片上**除了槽号没有任何文字**。
  ⇒ 原来是 0.31 的"左图右文"两列（`.slot-text` / `.slot-name` / `.slot-meta` / `.slot-check`），
  那几条纹样随文字一起删除；图片从"占左列"变成"占满整格"。
  ⚠ 尺寸纪律：缩略图**不许**在 JS 里写 inline 宽高（会盖掉这里的 CSS）—— 见 `slotsView.ts::thumbNode()`。
*/
.slot {
  background: var(--box2);
  border: 1px solid var(--line);
  border-radius: 7px;
  padding: 8px;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  gap: 6px;
  outline: none;
}
.slot:hover { border-color: #46525f; }
.slot-selected { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent) inset; }
.slot-empty { opacity: .78; }
.slot-no { font-weight: 600; font-size: 12.5px; }
/* 图片：占满整格宽度、正方形（`max-width` 封顶去掉 —— 卡片本身多宽，图画多大） */
.thumb-cv {
  image-rendering: pixelated;
  background: #0f1216;
  border-radius: 3px;
  display: block;
  width: 100%;
  aspect-ratio: 1 / 1;
}
.thumb-empty {
  display: flex; align-items: center; justify-content: center;
  font-size: 34px; color: #4a5260;
  background: #14181d;
  border: 1px dashed #363e49;
  border-radius: 4px;
  width: 100%;
  aspect-ratio: 1 / 1;
}

.lower-bottom { display: grid; grid-template-columns: minmax(320px, 1fr) minmax(260px, 1fr); gap: 10px; margin-top: 10px; }
@media (max-width: 1100px) { .lower-bottom { grid-template-columns: 1fr; } }

.actions { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.busy { color: var(--warn); font-size: 12.5px; }

.hintblock { display: flex; flex-direction: column; gap: 5px; }
.write-hint { font-size: 12px; }
.write-hint .bad { white-space: pre-wrap; }
.write-hint .warn { white-space: pre-wrap; }
.status { color: var(--dim); font-size: 12px; }

.write-log {
  grid-column: 1 / -1;
  background: #0f1216;
  border: 1px solid var(--line);
  border-radius: 6px;
  padding: 8px 10px;
  font-size: 12px;
  font-family: Consolas, "Courier New", monospace;
  max-height: 190px;
  overflow: auto;
  white-space: pre-wrap;
  word-break: break-word;
}
.write-log .log-ok { color: var(--ok); }
.write-log .log-bad { color: var(--bad); }
.write-log .log-line { color: var(--dim); }

/* ─────────────────────────── 提示条 ─────────────────────────── */

/* ⚠ 页脚那一块（`.foot`）连同那两行文字已经按用户要求**整块删除**，
   所以这里也不再保留 `.foot` 的样式（别留死代码）。
   那句"先完全退出 PCSX2"的安全提示仍然存在 —— 在「写入选中槽」的**确认框**里
   （`logic/writeGuard.ts::QUIT_PCSX2_WARNING`），`ui.test.ts` 有断言钉住它。 */

#toasts {
  position: fixed;
  right: 14px;
  bottom: 14px;
  width: min(520px, 46vw);
  display: flex;
  flex-direction: column;
  gap: 8px;
  z-index: 9999;
  pointer-events: none;
}
.toast {
  pointer-events: auto;
  position: relative;
  background: #20262e;
  border: 1px solid var(--line);
  border-left-width: 4px;
  border-radius: 7px;
  padding: 9px 30px 9px 12px;
  box-shadow: 0 6px 20px rgba(0, 0, 0, .45);
  font-size: 12.5px;
}
.toast-title { font-weight: 600; margin-bottom: 2px; white-space: pre-wrap; }
.toast-body { color: var(--dim); white-space: pre-wrap; word-break: break-word; max-height: 220px; overflow: auto; }
.toast-ok { border-left-color: var(--ok); }
.toast-info { border-left-color: var(--accent); }
.toast-warn { border-left-color: var(--warn); }
.toast-error { border-left-color: var(--bad); }
.toast-x {
  position: absolute;
  top: 4px;
  right: 5px;
  padding: 1px 6px;
  font-size: 14px;
  line-height: 1.1;
  background: transparent;
  border: none;
  color: var(--dim);
  cursor: pointer;
}
</style>
</head>
<body>

<!-- ══════════════════════ 顶栏 ══════════════════════ -->
<header class="topbar">
  <div class="brand">
    <span class="brand-title" data-en="PS2 Armored Core · Emblem Tool" data-ja="PS2 アーマード・コア · エンブレムツール" data-ko="PS2 아머드 코어 · 엠블럼 도구">PS2 装甲核心 · 徽章工具</span>
    <!--
      版本号：这里只放一个**占位符**，构建时由 build.mjs 从 src/ui/logic/version.ts
      的 APP_VERSION 替换成真值（main.ts 里还有一次 JS 兜底赋值，开发期直接开 shell 也对）。
      ⇒ 版本号只有**一个**来源，且 JS 没跑起来时也不会显示 `v?`。
    -->
    <span class="brand-sub" id="app-version" data-app-version="v0.47">v0.47</span>
  </div>

  <div class="topbar-block" id="card-drop" title="把 .ps2 记忆卡拖到这里（Chrome / Edge 下能拿到写句柄 ⇒ 保存时可直接覆盖原文件）" data-en-title="Drop a .ps2 memory card here (Chrome/Edge grants a write handle, so saving can overwrite the original file)" data-ja-title="ここに .ps2 メモリーカードをドロップ（Chrome/Edge は書き込みハンドルを渡すので、保存で元のファイルを上書きできます）" data-ko-title="여기에 .ps2 메모리 카드를 떨어뜨리세요 (Chrome/Edge 는 쓰기 핸들을 주므로 저장 시 원본 파일을 덮어쓸 수 있습니다)">
    <span class="lbl" data-en="Memory card" data-ja="メモリーカード" data-ko="메모리 카드">记忆卡</span>
    <span id="card-info" class="card-info"><span class="dim">未选择记忆卡</span></span>

      return;
    }
    const handle = handles[0];
    const file = await handle.getFile();
    const bytes = new Uint8Array(await file.arrayBuffer());
    // ★ 0.25：把选卡那一刻的文件状态一起记下来 —— 落盘前会拿它比对，
    //   变了就说明"这张卡在工具读过之后又被别的进程改过"（最常见是 PCSX2），
    //   那时 Chrome 的 createWritable() 会抛 InvalidStateError；我们改成**先拒绝**并说清怎么做。
    const r = await openCardFromBytes(file.name || handle.name, bytes, handle, {
      mtime: file.lastModified,
      size: file.size,
    });
    if (r.ok) afterCardLoaded();
    else refreshCardViews(null); // ★ 0.19（D2）：失败了也要把界面从"上一张卡"改回来
  });
}

async function openCardViaInput(file      )                {
  const bytes = new Uint8Array(await file.arrayBuffer());
  const r = await openCardFromBytes(file.name, bytes, null);
  if (r.ok) {
    toast('info', t('这是只读方式打开的', 'Opened in read-only mode', '読み取り専用で開きました', '읽기 전용으로 열었습니다'), t('保存时会改成"下载一份改好的卡"（这个环境没给写句柄）。', 'Saving will download a modified copy of the card instead (this environment gave no write handle).', '保存時は代わりに「修正済みのカードをダウンロード」になります（この環境では書き込みハンドルが得られませんでした）。', '저장 시 대신 "수정된 카드 다운로드"로 처리됩니다 (이 환경에서는 쓰기 핸들을 받지 못했습니다).'));

function currentGameContext()                {
  const sel = document.getElementById('game-select')                            ;
  const id = sel ? sel.value : DEFAULT_GAME_ID;
  const custom = (document.getElementById('custom-serial')                           )?.value ?? '';

}

/**
 * 顶栏「作品」那一段的**文字**：下拉右边的"⚠ 未验证…"警告 + 解析失败的红字。
 * 返回值 = 解析结果，调用方接着用它决定要不要重建槽位模型。
 *
 * ★ 0.39：抽成单独一份 —— **切语言时必须重画它**。原来 `relayoutForLang()` 只重画了下拉框，
 *   把这两块忘了，于是出现"下拉已经是中文、右边那句警告还是英文"的错位（用户实测截图抓到的）。
 *   ⚠ 以后往这一段加文字，它会被 `onGameChanged()`、`boot()`、`relayoutForLang()` **三条路**走到。
 */
function renderGameBlock()                {
  const r = currentGameContext();
  const entry = findGame((document.getElementById('game-select')                            )?.value ?? '');
  renderGameNote(entry ?? null);
  const err = $('game-error');
  clear(err);
  if (!r.ok) {
    err.appendChild(el('span', { class: 'bad', text: r.error ?? t('作品无法解析', 'Cannot resolve the game', 'タイトルを特定できません', '타이틀을 확인할 수 없습니다') }));
  }
  return r;
}

function onGameChanged()       {
  const r = renderGameBlock();
  if (!r.ok) {
    // 作品没法解析（例如自定义序列号还没填对）⇒ 退回"不过滤"，而不是把卡显示成空的。
    // ★ 0.19（D3）：这里也必须走 `refreshCardViews()` —— 原先手抄的版本漏了缩略图与卡片信息，
    //   于是"模型不过滤、缩略图还是上一次过滤的" ⇒ 槽名与缩略图可能来自不同目录。
    refreshCardViews(null);
    return;
  }

  // ★ 切作品 = 换一套槽：重建模型（按新作品过滤）+ 重读缩略图 + 重画 + 刷新提示。
  //   `state.selectedSlot` **保留**：槽号不变，该槽在新作品里可能是空槽，那是正常状态。
  refreshCardViews(r.ctx);
  if (state.card) {
    if (state.model && state.model.dirNames.length === 0) {
      // ★ 0.40：带上 `redo`（切语言时按新语言再说一遍，而不是被清掉）
      const redo = ()         => noDirForGameText(state.model?.serial ?? null, state.model?.excludedDirNames.length ?? 0);
      setStatus(redo(), redo);
    } else {
      // ★ 0.37：切作品只报"切到了哪个作品"（原来后面还挂一句槽位摘要，那句已按用户要求整句删除）。

    }
  }
}

  const isLr = ctx.entry.form === 'lr-archive';
  // ★ 0.21：单槽（〔批量写 8 槽〕已删）⇒ 一个目标、一条提醒、一条拒绝理由。
  const plan = planWriteTarget(ctx, state.selectedSlot);
  if (plan.error) {
    // ★ 0.43（用户："我觉得这部分的提示过于重复了"）：**一个事实只在主位讲一遍**。

    return;

  // ★ 0.32（用户）：原来这里还有一行把**目标文件**提前念一遍 —— 「槽 N → 目录\文件」后面再挂一个

  //   ⚠ 0.37 起**槽卡片上也不再写目标文件**（用户把卡片上的文字整段删掉了）⇒ "会盖掉哪个文件 /
  //   是不是盖掉"现在只在**落盘确认框**里说一遍（`logic/writeGuard.ts::confirmWriteMessage()`
  //   = 即将直接覆盖 + 改动摘要 + 那句硬提示），那才是安全提示该在的地方（SPEC.md §三 / §八 4）。
  //   ⚠ 上面那条 `plan.error` **不能删**：它是唯一说清"这一槽为什么写不了"的地方。
  if (plan.warning) host.appendChild(el('div', { class: 'warn', text: '⚠ ' + plan.warning }));
  if (state.model.dirNames.length === 0) {
    host.appendChild(el('div', { class: 'warn', text: '⚠ ' + noDirForGameText(state.model.serial, state.model.excludedDirNames.length) }));
  }
  if (!isLr) {
    const same = sameGameBlocks(ctx);
    host.appendChild(
      el('div', {
        class: same.length ? 'dim' : 'warn',
        text: same.length
          ? t(
              `作品常量可从卡上同作品的真实存档里取（找到 ${same.length} 个：${same.map((s) => `${s.dir}\\${s.file}`).join('、')}）`,
              `Game constants can be taken from real saves of this game on the card (found ${same.length}: ${same.map((s) => `${s.dir}\\${s.file}`).join(', ')})`, `タイトル定数はカード上の同じタイトルの実セーブデータから取得できます（${same.length} 件：${same.map((s) => `${s.dir}\\${s.file}`).join('、')}）`, `타이틀 상수는 카드에 있는 같은 타이틀의 실제 세이브 데이터에서 가져올 수 있습니다 (${same.length}개 발견: ${same.map((s) => `${s.dir}\\${s.file}`).join(', ')})`,

/**

 *      而不是在测试里手抄一遍"导入应该做什么"。
 */
function applyImportedImage(img             , name        , opts                          = {})       {
  // 换图时先离开取景视图（取景框是按**旧图标尺**算的，留着会错位）
  closeCropView();
  // ★ 0.40：`name` 只存**原文件名**（语言无关）；"剪贴板"那个前缀由 `renderOriginalBadge()`
  //   按当前语言现拼 —— 原来在这里就把 `t()` 的结果存进 state，切语言后那行永远是旧语言。
  state.source = { ...img, name, clipboard: opts.clipboard === true };
  // ★ 导入新图 ⇒ 手动取景按"**填满** 128×128 框"重新算初始值（不是 1:1）。
  //   用户 2026-10-05 的原话：「每次打开图片，图片默认就顶住这个方框部分，图片的一边顶住就行，
  //   顶住就停，不缩放」⇒ 短边贴框、白框里没有透明边。
  //   也不能沿用上一张图的平移/缩放（那看起来像"图不见了"）。
  //   SPEC §五 ② 的"默认进手动"没变，变的只是初始值。
  fillManualToTarget();
  const r = recompute();
  refreshImage();
  toast(
    r.ok ? 'ok' : 'warn',
    r.ok ? t(`已导入 ${name}`, `Imported ${name}`, `${name} を読み込みました`, `${name}을(를) 불러왔습니다`) : t(`已导入 ${name}，但还不合规`, `Imported ${name}, but it is not compliant yet`, `${name} を読み込みましたが、まだ適合していません`, `${name}을(를) 불러왔지만 아직 적합하지 않습니다`),
    r.ok
      ? t(
          `${img.width}×${img.height} → ${state.params.targetSize}×${state.params.targetSize}，实色 ${state.prepared?.report.colorsAfter ?? '?'}；` +
            `已按「填满白框」给好初始取景（倍率 ${state.params.manualFitScale.toFixed(3)}）。` +
            '★ 已进入取景模式：拖动图片 / 滚轮缩放，白框下面那行是实时读数，满意就按〔确定取景〕。',
          `${img.width}×${img.height} → ${state.params.targetSize}×${state.params.targetSize}, solid colors ${state.prepared?.report.colorsAfter ?? '?'}; ` +
            `initial crop set by "fill the white box" (scale ${state.params.manualFitScale.toFixed(3)}). ` +

        )
      : r.error ?? '',
  );
  // ★ 0.16：直接进取景模式（这一步会顺手把状态行写成取景读数，所以上面不再另写"图片就绪…"）
  openCropView();

    renderStatus();
  }
}

function bindParams()       {
  // ★ 2026-10-05（0.13）：原来这里绑的是「取景」四档下拉（`#fit-mode`），**已删** ——
  //   界面现在**永远**是 'manual'（`DEFAULT_PARAMS.fitMode`），理由写在 index.html 那段注释里：
  //   那三档自动模式会无视手动取景、自己重算一套，等于"偷偷丢掉你调好的取景"。
  //   核心 `image.ts` 的四个模式没动，`UiParams.fitMode` 字段也留着（`prepareEmblem()` 需要它）。

  // ★ 0.28：填充抽成 `fillKernelSelect()` —— 语言切换时选项文案要跟着换（值不变）
  fillKernelSelect();
  const kSel = $('kernel')                     ;
  kSel.addEventListener('change', () => {
    state.params.kernel = kSel.value                     ;
    commitParams();
  });

  const th = $('alpha-threshold')                    ;
  const thNum = $('alpha-threshold-num')                    ;
  th.min = String(PARAM_LIMITS.alphaThreshold.min);
  th.max = String(PARAM_LIMITS.alphaThreshold.max);
  th.value = String(state.params.alphaThreshold);
  thNum.min = th.min;
  thNum.max = th.max;
  thNum.value = th.value;
  const applyThreshold = (v        )       => {
    const clamped = Math.min(PARAM_LIMITS.alphaThreshold.max, Math.max(PARAM_LIMITS.alphaThreshold.min, Math.round(v || 128)));
    state.params.alphaThreshold = clamped;
    th.value = String(clamped);
    thNum.value = String(clamped);
    commitParams();
  };
  th.addEventListener('input', () => applyThreshold(Number(th.value)));
  thNum.addEventListener('change', () => applyThreshold(Number(thNum.value)));

  // ★ 2026-10-05（0.15）：原来这里还绑着「收边（去杂点）」「减色上限」「取景数值（倍率/X/Y）」三格，
  //   **按用户要求整块删除**（"我感觉这三个选项都没什么用啊" → 讨论后选"三样全删"）。
  //   ⚠ 删 UI 不等于删能力：`state.params.despeckle / maxColors / manualScale...` 都还在，
  //     默认值也还是"收边关 / 减色 255"（`DEFAULT_PARAMS`），核心 `image.ts` 一个字没动 ⇒ 行为不变。
  //     要看当前取景的几个数：点左上的〔取景〕，白框下面那行实时读数一直在写。

  const zoom = $('preview-zoom')                     ;
  clear(zoom);
  for (const z of [1, 2, 4, 8]) {
    zoom.appendChild(el('option', { value: String(z), selected: z === state.params.previewZoom }, z === 1 ? '1:1' : `${z}×`));
  }
  zoom.value = String(state.params.previewZoom);
  zoom.addEventListener('change', () => {
    state.params.previewZoom = Number(zoom.value) || 4;
    // ★ 只影响"当前图片"那一块画布 ⇒ 用轻量的 renderImageViews()，别顺带重建统计面板。
    //   ⚠ 0.41（审查抓到）：原来这里的理由写的是"`refreshImage()` 里的 `renderOriginalBadge()`
    //   会把整张源图扫一遍、0.8 M 像素实测 ~99 ms" —— 那个 `imageStats()` 在 0.9 就删了，
    //   现在 `renderOriginalBadge()` 只写一行"名字 · 尺寸"。结论仍然对（预览倍率不需要重算管线、
    //   也不需要重画那行字），只是理由过时了。
    renderImageViews();
  });
}

/**

  const ctx = currentGameContext();

/**
 * ★ 0.42：**在点击那一刻**把写权限问好（用户实测的真 bug 的修法）。
 *
 * 请求写权限（`requestPermission`）需要 **transient user activation**：只有用户手势起 ~5 秒内、
 * 且中间没经过 `confirm()` 这种模态框才允许调。旧代码是在"整条管线 + 落盘确认框"之后才问 ⇒ 必然抛
 * 浏览器抛 `SecurityError`（"要用户手势才能请求权限"）—— 界面表现为
 * "内存写 + 回读自检全过，最后一句英文错"，用户根本没法照做。
 *
 * ⇒ 现在：`doWrite()` / 〔删除槽〕**一进来**（任何 `await` 之前）就问一次，结论记在
 * `state.card.writePerm` 上；`cardOps.ts::persistCardChange()` 只读那个结论，**永不**再问。
 *
 * ⚠ 拿不到权限**不是错误**：产品一直承诺"没写句柄/没权限 ⇒ 改成下载一份改好的卡"。这里只提前
 * 告诉用户一声（免得等到最后才发现），流程照走。
 */
async function requestWritePermissionIfNeeded()                {
  const lc = state.card;
  if (!lc || !lc.handle) return; // 没句柄 ⇒ 本来就走下载那条路
  if (lc.writePerm?.ok) return; // 这个会话里已经拿到了
  const r = await ensureWritePermission(lc.handle);
  lc.writePerm = r;
  if (r.ok) return;
  const hint = writePermHintKey(r);
  toast(
    'warn',
    t('这次拿不到写权限 ⇒ 会改为下载一份改好的卡', 'No write permission this time - a modified copy will be downloaded instead', '今回は書き込み権限が取得できないため ⇒ 代わりに修正済みのカードをダウンロードします', '이번에는 쓰기 권한을 받지 못함 ⇒ 대신 수정된 카드를 다운로드합니다'),
    hint === 'gesture'
      ? t(
          '浏览器要求"请求写权限"必须由点击触发 —— 请再点一次〔写入选中槽〕。',
          'The browser requires the permission request to come from a click - press the button again.', 'ブラウザーの仕様により「書き込み権限の要求」はクリックで行う必要があります —— 〔選択スロットに書き込み〕をもう一度押してください。', '브라우저는 "쓰기 권한 요청"이 클릭으로 시작되어야 합니다 —— 〔선택한 슬롯에 쓰기〕를 다시 눌러 주세요.',
        )
      : hint === 'denied'
        ? t('你在权限框里点了"不允许"。想直接覆盖原卡的话，再点一次并选择允许。', 'You chose "don\'t allow" in the permission prompt. To overwrite the card directly, press again and allow it.', '権限ダイアログで「許可しない」を選びました。元のカードに直接上書きするには、もう一度押して許可を選んでください。', '권한 대화상자에서 "허용 안 함"을 선택했습니다. 원본 카드에 직접 덮어쓰려면 다시 누르고 허용을 선택하세요.')
        : t('这个文件句柄只有读权限（例如拖进来的卡）。', 'This file handle is read-only (a dropped card, for example).', 'このファイルハンドルは読み取り専用です（ドラッグ＆ドロップしたカードなど）。', '이 파일 핸들은 읽기 전용입니다 (드래그 앤 드롭한 카드 등).'),
    12_000,
  );
}

async function doWrite(slotIndex        , what        )                {
  if (state.busy) return;
  // ★ 0.42：**第一件事**就是问写权限（手势还在）—— 别夹在别的 await 后面
  await requestWritePermissionIfNeeded();
  // ★ 0.26（用户要求）：**取景模式里不许写入** —— 取景没〔确定〕之前，参数行还是上一次确定的值，
  //   这时候写下去的是"上一次的取景"，跟你在白框里看到的不一样。弹窗说清，然后中止。
  if (isCropActive()) {
    // ★ 0.40：`showModal()` 收**渲染函数**（切语言时它会被重放 ⇒ 标题正文按钮一起换语言）
    showModal(() => ({
      title: t('先在取景视图里点〔确定取景〕', 'First press "Apply crop" in the crop view', '先にトリミングビューで〔トリミングを確定〕を押してください', '먼저 자르기 보기에서 〔자르기 적용〕을 누르세요'),
      body: t(
        '你现在还在取景模式：白框里的取景还没有生效，这时候写入用的是上一次确定的取景，' +
          '和你在屏幕上看到的不一样。\n\n' +
          '请点左边那行里的〔确定取景〕（想放弃这次调整就点〔取消〕），然后再点〔写入选中槽〕。',
        'You are still in crop mode: the crop inside the white box has not taken effect yet, so writing now would use the previous confirmed crop, ' +
          'which is not what you see on screen.\n\n' +
          'Press "Apply crop" on the line at the left (press "Cancel" to drop this adjustment), then press "Write to selected slot".', `まだトリミングモードです：白枠の中のトリミングがまだ反映されていないため、このまま書き込むと前回確定したトリミングが使われ、画面で見ているものと違います。\\n\\n左の行の〔トリミングを確定〕を押し（この調整をやめるなら〔キャンセル〕）、それから〔選択したスロットに書き込み〕を押してください。`, `아직 자르기 모드입니다: 흰색 상자 안의 자르기가 아직 반영되지 않아, 지금 쓰면 이전에 적용한 자르기가 사용되어 화면에서 보는 것과 다릅니다.\\n\\n왼쪽 줄의 〔자르기 적용〕을 누르고(이번 조정을 버리려면 〔취소〕), 그다음 〔선택한 슬롯에 쓰기〕를 누르세요.`,
      ),
    }));
    return;
  }
  const r = currentGameContext();
  if (!r.ok || !r.ctx) {
    toast('error', t('作品没选对', 'Wrong game selected', 'タイトルの選択が正しくありません', '타이틀 선택이 올바르지 않습니다'), r.error ?? t('请在下拉框里选一个作品', 'Pick a game in the dropdown', 'ドロップダウンでタイトルを選んでください', '드롭다운에서 타이틀을 선택하세요'));
    return;
  }
  if (!state.prepared) {
    toast('error', t('还没有可写入的图像', 'No image ready to write', '書き込みできる画像がまだありません', '쓰기 가능한 이미지가 아직 없습니다'), state.prepareError ?? t('先导入一张图（拖入 / 点击选择 / Ctrl+V 粘贴）。', 'Import an image first (drop / click to choose / Ctrl+V paste).', '先に画像を読み込んでください（ドラッグ＆ドロップ / クリックして選択 / Ctrl+V で貼り付け）。', '먼저 이미지를 불러오세요 (드래그 앤 드롭 / 클릭하여 선택 / Ctrl+V 붙여넣기).'));
    return;
  }
  setBusy(true, t(`${what}中：生成徽章块 → 在内存副本上写 → 回读自检 …`, `${what} in progress: build the emblem block → write to the in-memory copy → read back to verify …`, `${what}中：エンブレムブロックを生成 → メモリー上のコピーに書き込み → 読み戻して自己検証 …`, `${what} 중: 엠블럼 블록 생성 → 메모리 사본에 쓰기 → 다시 읽어 자체 검증 …`));
  try {
    const isLr = r.ctx.entry.form === 'lr-archive';
    const outcome = await writeSlot(r.ctx, slotIndex, { isLr, finalCheck: recheckFinal });
    showLog(outcome.lines);
    // ★★ 0.40（审查抓到的真 bug）：**无论成败都要重建视图** —— `writeSlot()` 的顺序是
    //   "先在内存副本上写 → 弹落盘确认框 → 回读自检"，所以用户在确认框里按**取消**、或回读自检
    //   不过时，**内存副本已经变了**（`cardOps.ts` 里 `writeBlockToTarget()` 在 `persistCardChange()`
    //   之前）。原来这里只在 `outcome.ok` 时重建 ⇒ 模型还说这一槽是空的，用户第二次点写入会撞
    //   "已经有 dataN，拒绝覆盖"，〔删除槽〕也说"本来就是空的" ⇒ **卡死**，只能重开卡/切作品。
    //   〔删除槽〕那条路一直是这么做的（见 `btn-delete`：无论成败都 refreshCardViews）。
    refreshCardViews(r.ctx);
    if (outcome.ok) {
      setStatus(outcome.persisted ?? t('写入完成', 'write complete', '書き込み完了', '쓰기 완료'), () => t('写入完成', 'write complete', '書き込み完了', '쓰기 완료'));
      toast('ok', t(`${what}成功`, `${what} succeeded`, `${what}に成功`, `${what} 성공`), outcome.persisted ?? '');
    } else if (outcome.cancelled) {
      // ★ 0.40：取消不是失败 —— 别报"被拒绝"（`cardOps.ts::WriteOutcome.cancelled`）
      setStatusPair(`${what}已取消（内存里的改动没落盘）`, `${what} cancelled (the in-memory change was not written to disk)`, `${what}をキャンセルしました（メモリ上の変更はディスクに書かれていません）`, `${what} 취소됨 (메모리의 변경 사항은 디스크에 기록되지 않았습니다)`);
    } else if (outcome.refused) {
      // ★ 0.43：**预检就被拒**时，正文已经在提示行（`#write-hint`）讲过了 ⇒ 状态行只说一句标签 +
      //   指针；日志里**没有**任何行（"预检被拒 = 没发生任何事"），所以不能说"见右侧日志"。
      //   `note()` 每次重算 ⇒ 切语言时这句话跟着一起换（`setStatus(…, redo)`）。
      const refused = ()         => t(`${what}被拒绝：${outcome.refused .note()}`, `${what} was refused: ${outcome.refused .note()}`, `${what}が拒否されました：${outcome.refused .note()}`, `${what}이(가) 거부되었습니다: ${outcome.refused .note()}`);
      setStatus(refused(), refused);
    } else {
      setStatusPair(`${what}被拒绝（见右侧日志）`, `${what} was refused (see the log on the right)`, `${what}を拒否しました（右のログを参照）`, `${what} 거부됨 (오른쪽 로그를 보세요)`);
    }
  } finally {
    setBusy(false);
    renderStatus();
  }
}

// --------------------------------------------------------------------------
// PCSX2 自检（面板常驻在**页面最下面**，默认展开、无折叠按钮）
// --------------------------------------------------------------------------
//
// ★ 关于"默认能找到 C:\Users\M\Documents\PCSX2"（很重要，写在代码里免得以后再纠结）：
//   `file://` 页面**不能凭路径读本地文件** —— 这是浏览器的规定，不是我们的选择。
//   所以"默认找到"只能做成 **一次点击到位 + 记住上次的位置**：
//     · 主路径：`showDirectoryPicker({ id: 'pcsx2', startIn: 'documents' })`
//       —— `id` 让 Chrome 记住上次选的目录；`startIn:'documents'` 让第一次直接开在"文档"。
//     · 句柄再存进 IndexedDB；下次打开若权限还在（`queryPermission === 'granted'`）就**自动读一遍**。
//     · 兜底：`<input type="file" webkitdirectory multiple>`（不依赖 File System Access API）。
//     · 再兜底：把文件/文件夹拖进来。
//   三条路都会在界面上写明**这次走的是哪条**（用来判断 file:// 下到底能不能用 showDirectoryPicker）。

const PCSX2_DB_NAME = 'emblem-tool';
const PCSX2_DB_STORE = 'handles';
const PCSX2_HANDLE_KEY = 'pcsx2-dir';

/** 这一次自检的文件是从哪来的（显示给用户，也用来判断 API 可用性）。 */
                                                                

/**
 * `Pcsx2Route` ⇒ 界面那一行「本次来源：…」的文案（**中文原文 + 英文紧跟**）。
 *
 * ★ 值本身是**语言无关的代号**：切语言时 `relayoutForLang()` 会重跑 `renderPcsx2()`，
 *   由这里按当前语言重新取一次文案 —— 否则那一行会停在切语言之前的语言。
 *   ⚠ `'目录选择框'` / `'未提供'` 这些中文原文必须留在这里的 `t()` 第一参数里
 *   （`ui.test.ts` 分节 k3 直接拿源码断言它们在）。
 */
function pcsx2RouteText(route            )         {
  if (route === 'picker') return t('目录选择框', 'folder picker', 'フォルダ選択ダイアログ', '폴더 선택기');
  if (route === 'input') return t('目录输入框', 'the folder input box', 'フォルダの入力欄', '폴더 입력란');
  if (route === 'drop') return t('拖入文件', 'dropped files', 'ドラッグ＆ドロップされたファイル', '드래그 앤 드롭한 파일');
  if (route === 'auto') return t('自动（记住的目录）', 'the remembered folder (automatic)', '自動（記憶されたフォルダ）', '자동 (기억된 폴더)');
  return t('未提供', 'not provided', '未指定', '제공되지 않음');
}

let pcsx2Files                = [];
let pcsx2Route             = 'none';

/**
 * ★ 0.23：PCSX2 自检面板**默认折叠**（用户："自检改成默认折叠起来"）。
 *
 * 折叠的是"三条入口 + 结论 + 说明"整块（`#pcsx2-panel`），**头一行常驻**（标题 + 说明 + 〔展开/收起〕）。
 * 但**读进文件之后会自动展开一次** `setPcsx2Open(true)` —— 否则用户点了〔选择 PCSX2 目录〕
 * 却看不到结论，会以为没反应。清空（`btn-pcsx2-clear`）时收回默认的折叠态。
 *
 * ⚠ 折叠靠 `hidden` 属性（`styles.css` 有 `[hidden] { display: none !important }`），
 *   不写 inline `style.display` —— 那样会被 `.row { display: flex }` 盖掉（0.9 踩过的坑）。
 *   `aria-expanded` 跟着一起改，给读屏软件用（`ui.test.ts` 分节 k2 钉住"默认折叠 + 可展开"）。
 */
let pcsx2Open = false;

function setPcsx2Open(open         )       {
  pcsx2Open = open;
  const panel = document.getElementById('pcsx2-panel');
  if (panel) panel.hidden = !open;
  const btn = document.getElementById('btn-pcsx2-toggle')                            ;
  if (btn) {
    btn.textContent = open ? t('收起', 'Collapse', '折りたたむ', '접기') : t('展开', 'Expand', '展開', '펼치기');
    btn.setAttribute('aria-expanded', open ? 'true' : 'false');
  }
}

/** 把一批文本文件塞进自检并立刻重画（**读进来就立刻出结论**，不需要用户再点一次）。 */
async function setPcsx2Files(files                , route            )                  {
  const list = Array.from(files);
  const cls = classifyPcsx2Input(list);
  const out                = [];
  for (const f of cls.read) {
    try {
      // 名字用 webkitRelativePath（有就带上，界面上一眼能看出是哪个目录的）
      out.push({ name: f.webkitRelativePath || f.name, text: await f.text() });
    } catch (e) {
      toast('warn', t(`读不了 ${f.name}`, `Cannot read ${f.name}`, `${f.name} を読み込めません`, `${f.name}을(를) 읽을 수 없습니다`), e instanceof Error ? e.message : String(e));
    }
  }
  // ★ 0.19（D12）：无论读到几个都更新 —— "本次来源"与结论面板必须说同一件事
  //   （原先 0 个文件时不赋值 ⇒ 面板留着上一次的结论表，来源行也是旧的）。
  pcsx2Files = out;
  pcsx2Route = route;
  // ★ 0.23：有文件进来了就展开（默认是折叠的）—— 否则用户点了目录却看不到结论。
  if (out.length > 0) setPcsx2Open(true);
  renderPcsx2();
  if (out.length === 0) {
    toast(
      'warn',
      t('这个目录里没有找到 PCSX2 的自检文件', 'No PCSX2 check files found in this folder', 'このフォルダには PCSX2 のチェック用ファイルが見つかりません', '이 폴더에서 PCSX2 점검 파일을 찾지 못했습니다'),
      describeFoundFiles(list.map((f) => f.webkitRelativePath || f.name)),
    );
    return 0;
  }
  toast(
    'ok',
    t(`读到 ${out.length} 个文件（${pcsx2RouteText(route)}）`, `Read ${out.length} files (${pcsx2RouteText(route)})`, `${out.length} 個のファイルを読み込みました（${pcsx2RouteText(route)}）`, `${out.length}개 파일을 읽었습니다 (${pcsx2RouteText(route)})`),
    describeFoundFiles(out.map((f) => f.name)) +
      (cls.skippedTooBig.length ? t(`；跳过 ${cls.skippedTooBig.length} 个超过 4 MiB 的文件（memcards 那些用不到）`, `; skipped ${cls.skippedTooBig.length} files over 4 MiB (the memcards ones are not needed)`, `；4 MiB を超える ${cls.skippedTooBig.length} 個のファイルをスキップしました（memcards 内のものは不要）`, `; 4 MiB를 초과하는 ${cls.skippedTooBig.length}개 파일을 건너뛰었습니다 (memcards 안의 파일은 필요 없음)`) : ''),
  );
  return out.length;
}

// ── 主路径：showDirectoryPicker ────────────────────────────────────────────

                             
                             
                
                                
                     
                                           
 

const pickerWindow = ()                    => window                                ;

/** 递归读一个目录句柄下的**文本文件**（有上限，别把 8 MB 的记忆卡也读进内存）。 */
async function readTextFilesFromHandle(
  dir                           ,
  prefix = '',
  out                                      = [],
  depth = 0,
)                                               {
  if (depth > 4) return out;
  for await (const [name, handle] of dir                                                        ) {
    const rel = prefix ? `${prefix}/${name}` : name;
    if (handle.kind === 'directory') {
      // 只往我们关心的目录里钻（inis / gamesettings / logs），别把 memcards 也走一遍
      if (depth === 0 && !['inis', 'gamesettings', 'logs'].includes(name.toLowerCase())) continue;
      await readTextFilesFromHandle(handle                             , rel, out, depth + 1);
      continue;
    }
    if (!isPcsx2TextFile(rel)) continue;
    const file = await (handle                        ).getFile();
    if (file.size > PCSX2_MAX_TEXT_BYTES) continue;
    out.push({ name: rel, file });
  }
  return out;
}

/** 用句柄读一次并出结论；返回读到几个文件。 */
async function readFromDirectoryHandle(dir                           , route            )                  {
  const found = await readTextFilesFromHandle(dir);
  const out                = [];
  for (const it of found) out.push({ name: it.name, text: await it.file.text() });
  if (out.length) {
    pcsx2Files = out;
    pcsx2Route = route;
  } else {
    pcsx2Files = []; // ★ 0.19（D12）：理由同 setPcsx2Files —— 状态与面板不许打架
    pcsx2Route = route;
  }
  renderPcsx2();
  return out.length;
}

/** 打开句柄库 —— `rememberPcsx2Handle` / `recallPcsx2Handle` 共用（0.19 去重，A29）。 */
async function openHandleDb()                       {
  return await new Promise             ((res, rej) => {
    const req = indexedDB.open(PCSX2_DB_NAME, 1);
    req.onupgradeneeded = () => {
      const d = req.result;
      if (!d.objectStoreNames.contains(PCSX2_DB_STORE)) d.createObjectStore(PCSX2_DB_STORE);
    };
    req.onsuccess = () => res(req.result);
    req.onerror = () => rej(req.error ?? new Error(t('indexedDB.open 失败', 'indexedDB.open failed', 'indexedDB.open に失敗', 'indexedDB.open 실패')));
  });
}

/** 把句柄存进 IndexedDB（失败就静默放弃 —— 这只是"锦上添花"）。 */
async function rememberPcsx2Handle(dir                           )                {
  try {
    const db = await openHandleDb();
    await new Promise      ((res, rej) => {
      const tx = db.transaction(PCSX2_DB_STORE, 'readwrite');
      tx.objectStore(PCSX2_DB_STORE).put(dir, PCSX2_HANDLE_KEY);
      tx.oncomplete = () => res();
      tx.onerror = () => rej(tx.error ?? new Error(t('写入 IndexedDB 失败', 'Failed to write to IndexedDB', 'IndexedDB への書き込みに失敗', 'IndexedDB 쓰기 실패')));
    });
    db.close();
  } catch {
    /* 静默放弃：记不住只是"下次要多点一下"，不影响功能 */
  }
}

/** 取回上次记住的句柄（取不到返回 null）。 */
async function recallPcsx2Handle()                                            {
  try {
    const db = await openHandleDb();
    const handle = await new Promise                                  ((res, rej) => {
      const tx = db.transaction(PCSX2_DB_STORE, 'readonly');
      const req = tx.objectStore(PCSX2_DB_STORE).get(PCSX2_HANDLE_KEY);
      req.onsuccess = () => res((req.result                             ) ?? null);
      req.onerror = () => rej(req.error ?? new Error(t('读取 IndexedDB 失败', 'Failed to read from IndexedDB', 'IndexedDB からの読み取りに失敗', 'IndexedDB 읽기 실패')));
    });
    db.close();
    return handle;
  } catch {
    return null;
  }
}

/**
 * 启动时尝试"自动读一遍"：只在**上次授权还在**的情况下做（`queryPermission === 'granted'`）。
 * 权限没了就**静默不读**（绝不弹权限框打扰用户 —— 那必须由一次点击触发）。
 */
async function autoReadPcsx2IfRemembered()                {
  if (typeof pickerWindow().showDirectoryPicker !== 'function') return;
  const handle = await recallPcsx2Handle();
  if (!handle) return;
  let perm = 'prompt';
  try {
    perm = await handle.queryPermission({ mode: 'read' });
  } catch {
    return;
  }
  if (perm !== 'granted') return;
  try {
    const n = await readFromDirectoryHandle(handle, 'auto');
    if (n > 0) {
      toast(
        'info',
        t(`已自动读取记住的 PCSX2 目录（${handle.name}，${n} 个文件）`, `Automatically read the remembered PCSX2 folder (${handle.name}, ${n} files)`, `記憶された PCSX2 フォルダを自動で読み込みました（${handle.name}、${n} 個のファイル）`, `기억된 PCSX2 폴더를 자동으로 읽었습니다 (${handle.name}, ${n}개 파일)`),
        t('结论见页面最下面那块；想换目录就点「选择 PCSX2 目录」。', 'The result is in the panel at the bottom of the page; to change the folder, click "Choose PCSX2 folder".', '結論はページ最下部のパネルにあります。フォルダを変える場合は「PCSX2 フォルダを選択」をクリックしてください。', '결론은 페이지 맨 아래 패널에 있습니다. 폴더를 바꾸려면 "PCSX2 폴더 선택"을 클릭하세요.'),
      );
    }
  } catch {
    /* 句柄失效（目录被删/改名）⇒ 静默放弃，用户点一次就好 */
  }
}

/** 兜底路径：`<input webkitdirectory>`（不依赖 File System Access API）。 */
function openPcsx2DirInput()       {

/** 收下"拖进来的东西"：可能是三个文件，也可能是一个目录（能拿到 entry 就递归走）。 */
async function handlePcsx2Drop(dt              )                {
  // ① 优先用 FileSystemEntry 递归（拖目录时 dt.files 不含子文件——那是浏览器的行为）
  const entries                    = [];
  for (const item of Array.from(dt.items ?? [])) {
    if (item.kind !== 'file') continue;
    const anyItem = item                                                                  ;
    const entry = anyItem.webkitGetAsEntry ? anyItem.webkitGetAsEntry() : null;
    if (entry) entries.push(entry);
  }
  if (entries.length) {
    const collected         = [];
    for (const e of entries) await collectEntryFiles(e, collected);
    if (collected.length) {
      await setPcsx2Files(collected, 'drop');
      return;
    }
  }
  // ② 拿不到 entry（旧浏览器）⇒ 就用 dt.files（拖三个文件时是够的）
  const files = Array.from(dt.files ?? []);
  if (files.length) {
    await setPcsx2Files(files, 'drop');
    return;
  }
  toast(
    'warn',
    t('没收到任何文件', 'No files received', 'ファイルを受け取れませんでした', '받은 파일이 없습니다'),
    t('请拖 inis\\PCSX2.ini、gamesettings\\*.ini、logs\\emulog.txt，或整个 PCSX2 目录。', 'Drop inis\\PCSX2.ini, gamesettings\\*.ini, logs\\emulog.txt, or the whole PCSX2 folder.', 'inis\\PCSX2.ini、gamesettings\\*.ini、logs\\emulog.txt、または PCSX2 フォルダ全体をドラッグ＆ドロップしてください。', 'inis\\PCSX2.ini, gamesettings\\*.ini, logs\\emulog.txt 또는 PCSX2 폴더 전체를 드래그 앤 드롭하세요.'),
  );
}

/** 递归把 entry 展开成文件（目录深度上限 4，只看我们关心的三个目录）。 */
async function collectEntryFiles(entry                 , out        , depth = 0)                {
  if (depth > 4) return;
  if (entry.isFile) {
    const file = await new Promise             ((res) => {
      (entry                       ).file(
        (f) => res(f),
        () => res(null),
      );
    });
    if (file && isPcsx2TextFile(entry.fullPath || file.name) && file.size <= PCSX2_MAX_TEXT_BYTES) out.push(file);
    return;
  }
  if (!entry.isDirectory) return;
  // ★ 0.19（A4）：删掉了一段**永假**的死分支
  //   （`if (depth === 0 && …) { if (depth > 0) return; }` —— `depth` 在外层已经是 0）。
  //   ⚠ 它原来"看起来"是想着过滤目录名，其实什么都没做；而且**拖入**这条路本来就不按目录名过滤
  //     （`readTextFilesFromHandle()` 那条"目录选择框"的路才会只进 inis/gamesettings/logs）。
  //     两条路都靠 `isPcsx2TextFile()` 按"后缀 + 目录段"判，行为一致，别再加名字过滤。
  const reader = (entry                            ).createReader();
  for (;;) {
    const batch = await new Promise                   ((res) => {
      reader.readEntries(
        (list) => res(list),
        () => res([]),
      );
    });
    if (!batch.length) break;
    for (const child of batch) await collectEntryFiles(child, out, depth + 1);
  }
}

function installDropZones()       {
  const stop = (ev           )       => {
    ev.preventDefault();
    ev.stopPropagation();
  };
  // 拖入的目标：顶栏的记忆卡、中间那格的舞台、自检条
  // （`editor` / `view-original` 两个挂载点随面板一起删掉了）
  for (const id of ['card-drop', 'image-drop', 'pcsx2-drop']) {
    const zone = document.getElementById(id);
    if (!zone) continue;
    zone.addEventListener('dragover', (ev) => {
      stop(ev);
      zone.classList.add('drop-hot');
    });
    zone.addEventListener('dragleave', () => zone.classList.remove('drop-hot'));
    zone.addEventListener('drop', (ev) => {
      stop(ev);
      zone.classList.remove('drop-hot');
      void handleDrop(id, ev                                              );
    });
  }
}

async function handleDrop(zoneId        , ev                                            )                {
  const dt = ev.dataTransfer;
  // 未来能拿到句柄就优先用（⇒ 保存时可直接覆盖原文件）
  const items = (dt.items ? Array.from(dt.items) : []).filter((i) => i.kind === 'file');
  if (zoneId === 'card-drop') {
    const files = Array.from(dt.files);
    if (!files.length) return;
    // ★ 0.41：写入进行中不许换卡（否则计划与落盘可能不是同一张卡）
    if (blockedWhileBusy(t('拖入记忆卡：等这一步写完再来。', 'Dropping a memory card: wait until this write finishes.', 'メモリーカードのドラッグ＆ドロップ：この書き込みが終わってからにしてください。', '메모리 카드 드래그 앤 드롭: 이 쓰기가 끝난 뒤에 하세요.'))) return;
    const f = files[0];
    let handle                              = null;
    try {
      const anyItem = items[0]                                                                                 ;
      const h = anyItem && anyItem.getAsFileSystemHandle ? await anyItem.getAsFileSystemHandle() : null;
      if (h && h.kind === 'file') handle = h                        ;
    } catch {
      handle = null; // 拿不到句柄不是错误，退化到只读
    }
    const bytes = new Uint8Array(await f.arrayBuffer());
    // ★ 0.41（审查抓到）：这一路原来**不传 `lastSeen`** ⇒ 首次写入跳过"写前查磁盘被改过"那道闸门
    //   （只能等 `createWritable()` 抛 InvalidStateError 兜）。既然手里有 File，就把它一起传下去
    //   —— 与〔选择记忆卡〕那条路（`openCardViaPicker()`）口径一致。
    const consumed = await openCardFromBytes(f.name, bytes, handle, { mtime: f.lastModified, size: f.size });
    if (consumed.ok) afterCardLoaded();
    else refreshCardViews(null); // ★ 0.19（D2）
    return;
  }
  if (zoneId === 'pcsx2-drop') {
    // ★ 拖进来的可能是"三个文件"，也可能是**整个 PCSX2 目录**
    //   （拖目录时 `dt.files` 不含子文件 —— 那是浏览器行为，所以要走 FileSystemEntry 递归）
    await handlePcsx2Drop(dt);
    return;
  }
  // 图片区
  const files = Array.from(dt.files).filter((f) => /^image\//.test(f.type) || IMG_EXT_RE.test(f.name));
  // ★ 0.41：写入进行中不许换图（否则预览是新图、日志报告"旧图写成功"—— 0.19 D8 就是为这个禁的按钮）
  if (files.length && blockedWhileBusy(t('拖入图片：等这一步写完再来。', 'Dropping an image: wait until this write finishes.', '画像のドラッグ＆ドロップ：この書き込みが終わってからにしてください。', '이미지 드래그 앤 드롭: 이 쓰기가 끝난 뒤에 하세요.'))) return;
  const rejected = Array.from(dt.files).filter((f) => !files.includes(f));
  for (const f of rejected) {
    toast(
      'warn',
      t(`不接受 ${f.name}`, `Rejected ${f.name}`, `${f.name} は受け付けません`, `${f.name}은(는) 지원하지 않습니다`),
      t('PSD / TIFF / 多页 RAW 请先导出 PNG（SPEC.md §五：不做格式猜测）。', 'Export PSD / TIFF / multi-page RAW to PNG first (SPEC.md §5: no format guessing).', 'PSD / TIFF / 複数ページ RAW は先に PNG に書き出してください（SPEC.md §5：形式の推測は行いません）。', 'PSD / TIFF / 다중 페이지 RAW는 먼저 PNG로 내보내세요 (SPEC.md §5: 형식을 추측하지 않음).'),
    );
  }
  if (files.length) await loadImageFromBlob(files[0], files[0].name);
}

function installPaste()       {
  window.addEventListener('paste', (ev) => {
    const dt = (ev                  ).clipboardData;
    if (!dt) return;
    // ★ 0.41：写入进行中不许粘贴换图（与拖入同一条规矩）
    if (blockedWhileBusy(t('粘贴图片：等这一步写完再来。', 'Pasting an image: wait until this write finishes.', '画像の貼り付け：この書き込みが終わってからにしてください。', '이미지 붙여넣기: 이 쓰기가 끝난 뒤에 하세요.'))) return;
    const files = Array.from(dt.files ?? []);
    const img = files.find((f) => /^image\//.test(f.type));
    if (img) {
      // ★ 0.40：只传**原文件名** + `clipboard: true`（前缀在渲染时按语言拼，别在这里 t()）
      void loadImageFromBlob(img, img.name, { clipboard: true });
      ev.preventDefault();
      return;
    }
    const items = Array.from(dt.items ?? []);
    const it = items.find((i) => i.type.startsWith('image/'));
    if (it) {
      const f = it.getAsFile();
      if (f) {
        // ★ 0.40：这条路的图**没有文件名**（截图直接粘的就是一个匿名 blob）⇒ 名字留空，
        //   由 `renderOriginalBadge()` 拼成"剪贴板 · image"（按当前语言）
        void loadImageFromBlob(f, '', { clipboard: true });
        ev.preventDefault();
      }
    }
  });
}

  $('btn-image-open').addEventListener('click', () => void pickImageFile());
