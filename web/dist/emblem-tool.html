// ─────────────────────────── Card ───────────────────────────

/**
 * PS2 记忆卡。**内部只有一个 `Uint8Array` 镜像** —— 读和写都作用于它。
 *
 * 用法（Node / 浏览器都一样）：
 * ```ts
 * const buf = new Uint8Array(await file.arrayBuffer());  // ← 已是一份副本
 * const card = new Card(buf);
 * card.dirents(card.rootdir, card.dirCount(card.rootdir));
 * ```
 */
       class Card {
  /** 整卡镜像（唯一读写来源）。 */
           buf            ;
  /** 超块 `page_len`（真卡 512）。 */
           pageLen        ;
  /** 每簇页数（真卡 2）。 */
           ppc        ;
  /** 每块页数（真卡 16）。 */
           ppb        ;
  /** 簇总数（真卡 8192）。 */
           clusters        ;
  /** 数据区相对簇号的起点（alloc_offset，真卡 41）。 */
           allocOffset        ;
  /** 数据区末端（alloc_end，真卡 8135）。 */
           allocEnd        ;
  /** 根目录首簇（相对簇号，真卡 0）。 */
           rootdir        ;
  /** 超块里的 32 个 ifc 项（其中 [0] = 间接 FAT 所在簇，绝对簇号）。 */
           ifc          ;
  /** 间接 FAT：256 个 FAT 块簇号（绝对簇号），`0xFFFFFFFF` = 无。 */
           ind          ;
  /** 页数 = size / 528。 */
           npages        ;
  /** 整卡字节数。 */
           size        ;

  constructor(buf            ) {
    this.buf = buf;
    this.size = buf.length;
    if (this.size % STRIDE !== 0) {
      throw new Error(`不是 PS2 记忆卡：大小 ${this.size} 不是 ${STRIDE} 的整数倍`);
    }
    this.npages = this.size / STRIDE;

    const sb = this.readPageRaw(0);
    const magic = String.fromCharCode(sb[0], sb[1], sb[2], sb[3]);
    if (magic !== 'Sony') {
      throw new Error(`不是 PS2 记忆卡（超块魔数不符）: ${JSON.stringify(magic)}`);
    }
    this.pageLen = u16le(sb, 0x28);
    this.ppc = u16le(sb, 0x2a);
    this.ppb = u16le(sb, 0x2c);
    this.clusters = u32le(sb, 0x30);
    this.allocOffset = u32le(sb, 0x34);
    this.allocEnd = u32le(sb, 0x38);
    this.rootdir = u32le(sb, 0x3c);
    // ★ 0.19：超块字段必须**自洽**，否则后面每一个"用 0 兜底"的读取都会静默算错。
    //   ⚠ 这是 D18 那一类事故的源头：Python 版在这里会抛（struct.error），JS 版以前只是继续跑。
    if (this.pageLen !== PAGE_SIZE) {
      throw new Error(`不是 PS2 记忆卡（超块 page_len=${this.pageLen}，应为 ${PAGE_SIZE}）`);
    }
    if (!(this.ppc >= 1) || !(this.clusters > 0)) {
      throw new Error(`不是 PS2 记忆卡（超块 ppc=${this.ppc} clusters=${this.clusters}）`);
    }
    if (!(this.allocEnd > this.allocOffset) || this.allocEnd > this.clusters) {
      throw new Error(
        `不是 PS2 记忆卡（超块 alloc_offset=${this.allocOffset} alloc_end=${this.allocEnd} clusters=${this.clusters} 不自洽）`,
      );
    }
    this.ifc = [];
    for (let i = 0; i < 32; i++) this.ifc.push(u32le(sb, 0x50 + i * 4));

    // 间接 FAT：1024 B = 256 × u32（跨 2 页，从绝对簇 ifc[0] 起）
    // ★ 0.19：`sysRead()` 现在读不满就抛（见它自己的注释）⇒ ifc[0] 无效的卡**在构造时就报错**，
    //   而不是把 ind[] 全填 0、之后被 `writeFat` 拿去当"第 0 簇"用（那会把超块写坏）。
    const indRaw = this.sysRead(this.ifc[0], 1024);
    this.ind = [];
    for (let i = 0; i < 256; i++) this.ind.push(u32le(indRaw, i * 4));
  }

  // ── 页级原语（唯一真正碰 `this.buf` 的地方） ──

  /**
   * 读第 `n` 页的 512 B 数据区（**副本**）。
   *
   * ★ 0.19 两处修正（都是"静默出错"）：
   *   ① **越界要抛**，不再返回空数组 —— 原先 `readFile()` 会把空读当成"读到了"，
   *      继续 `got += PAGE_SIZE`，于是给调用方一段**全 0** 的数据（看着像"这张徽章是空的"）；
   *   ② **必须真的是副本**：`this.buf` 若是 Node `Buffer`，`Buffer.prototype.slice`
   *      返回的是**视图**（与 `Uint8Array.prototype.slice` 相反）⇒ 调用方改返回值会改到卡。
   *      这里走 `new Uint8Array(view)` 显式复制，与底层是 Buffer 还是 Uint8Array 无关。
   */
  readPageRaw(n        )             {
    if (!Number.isInteger(n) || n < 0 || n >= this.npages) {
      throw new Error(`读页越界：第 ${n} 页（本卡 0..${this.npages - 1}）`);
    }
    const off = n * STRIDE;
    return new Uint8Array(this.buf.subarray(off, off + PAGE_SIZE));
  }

  /** 读第 `n` 页的 16 B 备用区（**副本** —— 理由同 `readPageRaw`）。 */
  readSpareRaw(n        )             {
    if (!Number.isInteger(n) || n < 0 || n >= this.npages) {
      throw new Error(`读备用区越界：第 ${n} 页（本卡 0..${this.npages - 1}）`);
    }
    const off = n * STRIDE + PAGE_SIZE;
    return new Uint8Array(this.buf.subarray(off, off + SPARE_SIZE));
  }

  /** 写第 `n` 页的 512 B 数据区 + **重算 ECC**（写 16 B 备用区）。 */
  writePageRaw(n        , page512            )       {
    if (page512.length !== PAGE_SIZE) {
      throw new Error(`页必须正好 ${PAGE_SIZE} B，实为 ${page512.length}`);
    }
    if (!Number.isInteger(n) || n < 0 || n >= this.npages) {
      throw new Error(`页号越界：${n}（本卡 0..${this.npages - 1}）`);
    }
    const off = n * STRIDE;
    this.buf.set(page512, off);
    this.buf.set(pageEcc(page512), off + PAGE_SIZE);
  }

  /** 只写备用区（不重算 ECC）—— 给"故意造坏 ECC"的探针用。 */
  writeSpareRaw(n        , spare16            )       {
    if (spare16.length !== SPARE_SIZE) {
      throw new Error(`备用区必须正好 ${SPARE_SIZE} B`);
    }
    if (!Number.isInteger(n) || n < 0 || n >= this.npages) {
      throw new Error(`页号越界：${n}（本卡 0..${this.npages - 1}）`);
    }
    this.buf.set(spare16, n * STRIDE + PAGE_SIZE);
  }

  /** 按 ECC 算法校验第 `n` 页，返回是否一致。 */
  eccOk(n        )          {
    return bytesEqual(this.readSpareRaw(n), pageEcc(this.readPageRaw(n)));
  }

  // ── 系统区（绝对簇号） ──

  /** 系统区：绝对簇 `cl` 的第 `k` 页号。 */
  sysPage(cl        , k = 0)         {
    return cl * this.ppc + k;
  }

  /**
   * 从系统区绝对簇 `cl` 起连续读 `n` 字节（沿簇递增，最多 512 簇）。
   *
   * ★ 0.19：**读不满就抛**。原先它会 `return out.slice(0, got)` 静默返回短缓冲，
   *   而 `u32le()` 越界读又是 0 ⇒ "读不到"被悄悄变成"读到 0"（D18 的根因）。
   *   Python 参考实现在同一处也是抛（`struct.unpack_from` 越界）⇒ 现在两边一致。
   * ⚠ 512 簇是**硬上限**（原先没写在注释里）：正常调用（间接 FAT 1024 B、FAT 块 1024 B）远小于它。
   */
  sysRead(cl        , n        )             {
    if (!Number.isInteger(cl) || cl < 0) {
      throw new Error(`sysRead: 绝对簇号非法（${cl}）`);
    }
    const out = new Uint8Array(n);
    let got = 0;
    for (let i = 0; i < 512 && got < n; i++) {
      for (let k = 0; k < this.ppc; k++) {
        const p = this.sysPage(cl, k);
        if (p >= this.npages) {
          throw new Error(
            `sysRead: 读不到 —— 绝对簇 ${cl} 的第 ${k} 页 = ${p} 超出本卡 ${this.npages} 页（超块字段可能坏了）`,
          );
        }
        const chunk = this.readPageRaw(p);
        const take = Math.min(PAGE_SIZE, n - got);
        out.set(chunk.subarray(0, take), got);
        got += take;
      }
      cl += 1;
    }
    if (got < n) throw new Error(`sysRead: 只读到 ${got}/${n} 字节（绝对簇 ${cl} 起、512 簇上限）`);
    return out;
  }

  // ── 数据区（相对 alloc_offset） ──

  /** 数据区：相对簇 `rel` 的第 `k` 页号（绝对页号）。 */
  dataPage(rel        , k = 0)         {
    return (rel + this.allocOffset) * this.ppc + k;
  }

  /**
   * 相对簇 `rel` 是否**整簇**都落在卡镜像里。
   *
   * ★ 0.19 新增（D19）：`clusters`（超块里的簇总数）与"镜像真实存在的页数"并不总是同一件事 ——
   *   真卡上数据区末尾之后还有一段"簇号合法但页不存在"的区间。原先 `readFile()` 对这段
   *   照写不误（`readPageRaw` 返回空数组、`got` 却继续加）⇒ 调用方拿到一段**全 0**。
   *   现在读取路径一律先问这个方法，读不到就停在链上（= Python 的"短缓冲"行为）。
   */
  clusterInImage(rel        )          {
    if (!Number.isInteger(rel) || rel < 0) return false;
    return this.dataPage(rel, this.ppc - 1) < this.npages;
  }

  /** 读数据页（512 B）。 */
  readDataPage(rel        , k = 0)             {
    return this.readPageRaw(this.dataPage(rel, k));
  }

  /** 写数据页（512 B，**重算 ECC**）。 */
  writeDataPage(rel        , k        , page512            )       {
    this.writePageRaw(this.dataPage(rel, k), page512);
  }

  // ── FAT ──

  /**
   * FAT 块所在簇号的自检。
   *
   * ★ 0.19 新增（D18）：`ind[]` 里除 `0xFFFFFFFF`（= 该块不存在，合法）以外的值
   *   都必须是**真实存在的簇**。原先只查"是不是 undefined/0xFFFFFFFF"，
   *   于是 `fc = 0`（例如超块 ifc[0] 坏掉、`ind[]` 被填成 0）会被当成合法 FAT 块
   *   ⇒ `sysPage(0,0) = 0` = **超块自己**，`writeFat()` 一写就把 "Sony" 魔数毁掉。
   *   `fc >= 1` 排除簇 0（它是超块/保留区，从不是 FAT 块）。
   */
          checkFatCluster(fc        , blk        )       {
    if (fc === INVALID_CLUSTER) return; // 该 FAT 块不存在（合法）
    if (!Number.isInteger(fc) || fc < 1) {
      throw new Error(`FAT 块 ${blk} 的簇号非法：${fc}（0 是超块/保留区，不可能是 FAT 块）—— 超块可能损坏`);
    }
    if (this.sysPage(fc, this.ppc - 1) >= this.npages) {
      throw new Error(`FAT 块 ${blk} 的簇 ${fc} 超出本卡（${this.npages} 页）—— 超块可能损坏`);
    }
  }

  /**
   * 读一个 FAT 项（相对簇号 `rel`）。
   *
   * 布局：每 256 个簇一个 FAT 块（1024 B），块号 `rel // 256`，
   *       块内字节偏移 `(rel % 256) * 4`；块所在簇号从 `ind[]` 查。
   * 越界（`rel >= clusters`）或该块不存在 ⇒ `0xFFFFFFFF`。
   */
  readFat(rel        )         {
    if (!Number.isInteger(rel) || rel < 0) {
      throw new Error(`readFat: 相对簇号非法（${rel}）`);
    }
    if (rel >= this.clusters) return INVALID_CLUSTER;
    const blk = Math.floor(rel / 256);
    const off = (rel % 256) * 4;
    const fc = this.ind[blk];
    if (fc === undefined || fc === INVALID_CLUSTER) return INVALID_CLUSTER;
    this.checkFatCluster(fc, blk);
    return u32le(this.sysRead(fc, 1024), off);
  }

  /**
   * 写一个 FAT 项。**读和写都走 `this.buf`（同一个镜像）** —— 见文件头那个坑。
   *
   * 逐行对应 `65_us2jp.py::Writable.set_fat`：
   *   blk, off = rel // 256, (rel % 256) * 4
   *   fc = self.ind[blk]
   *   p0 = sys_page(fc, 0)
   *   raw = _rd_page(p0) + _rd_page(p0+1)     # ← 从**同一个**镜像读
   *   pack_into('<I', raw, off, value)
   *   _wr_page(p0, raw[:512]); _wr_page(p0+1, raw[512:])
   */
  writeFat(rel        , value        )       {
    if (!Number.isInteger(rel) || rel < 0) {
      throw new Error(`writeFat: 相对簇号非法（${rel}）`);
    }
    if (rel >= this.clusters) {
      throw new Error(`FAT 项越界：rel=${rel} >= clusters=${this.clusters}`);
    }
    const blk = Math.floor(rel / 256);
    const off = (rel % 256) * 4;
    const fc = this.ind[blk];
    if (fc === undefined || fc === INVALID_CLUSTER) {
      throw new Error(`FAT 块 ${blk} 不存在（ind[${blk}] = ${fc}）`);
    }
    this.checkFatCluster(fc, blk);
    const p0 = this.sysPage(fc, 0);
    if (p0 + 1 >= this.npages) {
      throw new Error(`FAT 块 ${blk} 的页号越界：${p0}..${p0 + 1}（本卡 ${this.npages} 页）`);
    }
    const raw = new Uint8Array(1024);
    raw.set(this.readPageRaw(p0), 0);
    raw.set(this.readPageRaw(p0 + 1), 512);
    setU32le(raw, off, value >>> 0);
    this.writePageRaw(p0, raw.subarray(0, 512));
    this.writePageRaw(p0 + 1, raw.subarray(512, 1024));
  }

  /**
   * 簇链遍历：从 `first` 起，沿 FAT 走到链尾。
   *
   * 逐行对应 `61_mc_survey.py::Card.chain`：
   *   while cl not in (LAST, 0xFFFFFFFF) and cl < clusters and len(out) < maxn:
   *       out.append(cl)
   *       nxt = fat(cl) & 0x7FFFFFFF
   *       if nxt in out: break          // ★ 防环
   *       cl = nxt
   *
   * ★ 两条边界语义（测试里专门覆盖）：
   *   1. **跨 FAT 块**：`fat()` 按 `rel // 256` 选块，链跨过 256 的倍数时块号会变
   *      （真卡上 `ind[]` 是**不连续**的 9,10,…,40 ⇒ 必须每次重新查 `ind[]`，不能假定连续）。
   *   2. **最后一簇**：`rel < clusters` 是硬边界；`clusters` 之后一律视为不可达，
   *      即使 FAT 里写着别的值。
   */
  chain(first        , maxn = 8192)           {
    if (!Number.isInteger(first) || first < 0) {
      // ★ 0.19：负数/小数簇号原先会被走成 `[-1]`（`dataPage(-1)` 还能落到一张**真实无关的页**上）。
      throw new Error(`chain: 起始簇号非法（${first}）`);
    }
    const out           = [];
    const seen = new Set        ();
    let cl = first;
    while (
      cl !== FAT_END &&
      cl !== INVALID_CLUSTER &&
      cl < this.clusters &&
      out.length < maxn
    ) {
      out.push(cl);
      seen.add(cl);
      const nxt = this.readFat(cl) & FAT_MASK;
      if (seen.has(nxt)) break; // 防环
      cl = nxt;
    }
    return out;
  }

  /**
   * 按 dirent 声明的首簇 + 长度读文件。
   *
   * ★ 偏移语义（与 Python 完全一致）：数据是**簇对齐**的，`n` 只是最终截断长度，
   *   即"读满整条链、最后 `slice(0, n)`"。`n === 0` ⇒ 空数组（不读任何页）。
   *   链比 `n` 短时返回的就是实际能读到的长度（**不补零**）—— 保持原版行为。
   */
  readFile(first        , n        )             {
    if (n <= 0) return new Uint8Array(0);
    const chain = this.chain(first, Math.floor(n / 1024) + 16);
    const total = chain.length * this.ppc * PAGE_SIZE;
    const raw = new Uint8Array(total);
    let got = 0;
    for (const cl of chain) {
      if (!this.clusterInImage(cl)) break; // ★ 图外簇：停在这里（返回短缓冲，不补零）
      for (let k = 0; k < this.ppc; k++) {
        raw.set(this.readDataPage(cl, k), got);
        got += PAGE_SIZE;
      }
    }
    return raw.slice(0, Math.min(n, got));
  }

  /** 把一个文件写进给定的簇链（簇不够时按数据长度补零），返回实际写了的页号。 */
  writeFileIntoClusters(clusters          , data            )           {
    const clen = this.ppc * PAGE_SIZE;
    if (data.length > clusters.length * clen) {
      // ★ 0.19：原先**静默截断**（文档只提了"不够时补零"）。写卡路径宁可报错也不要写半个文件。
      throw new Error(
        `writeFileIntoClusters: ${data.length} 字节装不进 ${clusters.length} 簇（${clusters.length * clen} 字节）`,
      );
    }
    const pages           = [];
    for (let i = 0; i < clusters.length; i++) {
      const chunk = new Uint8Array(clen);
      const src = data.subarray(i * clen, Math.min((i + 1) * clen, data.length));
      chunk.set(src, 0);
      for (let k = 0; k < this.ppc; k++) {
        const rel = clusters[i];
        this.writeDataPage(rel, k, chunk.subarray(k * PAGE_SIZE, (k + 1) * PAGE_SIZE));
        pages.push(this.dataPage(rel, k));
      }
    }
    return pages;
  }

  /** 写一条簇链的 FAT：中间 `0x80000000 | next`，末簇 `0x80000000 | 0x7FFFFFFF`。 */
  writeFatChain(clusters          )       {
    for (let i = 0; i < clusters.length; i++) {
      const last = i === clusters.length - 1;
      // 0x80000000 | x 在 JS 里会变成负 int32 ⇒ 用 >>> 0 归一到无符号
      this.writeFat(clusters[i], (0x80000000 | (last ? FAT_END : clusters[i + 1])) >>> 0);
    }
  }

  // ── 目录项 ──

  /**
   * 读 `count` 个目录项。
   *
   * 逐行对应 `61_mc_survey.py::Card.dirents`：
   *   · 目录 = count 个 512 B 项，**沿 FAT 链跨簇连续排布** ⇒ 必须按 `count*512` 读完整条链，
   *     不能只读一簇（真卡根目录 11 项 = 3 个簇）。
   *   · 空槽（mode == 0xFFFFFFFF）跳过，**但 `index` 保留原位号**（调用方靠 index 定位槽）。
   *   · "已用" = **bit15 (0x8000)**，不是 bit31。⚠️ Python 里 `mode & 0x8000 == 0` 有优先级坑，
   *     原版靠加括号绕过；TS 里 `&` 优先级低于 `===`，同样必须加括号。
   */
  dirents(first        , count        )           {
    const need = count * PAGE_SIZE;
    if (need <= 0) return [];
    const chain = this.chain(first, Math.floor(need / 1024) + 16);
    const raw = new Uint8Array(chain.length * this.ppc * PAGE_SIZE);
    let got = 0;
    for (const cl of chain) {
      if (!this.clusterInImage(cl)) break; // ★ 图外簇 ⇒ 停（下面 `(i+1)*PAGE_SIZE > raw.length` 会收尾）
      for (let k = 0; k < this.ppc; k++) {
        raw.set(this.readDataPage(cl, k), got);
        got += PAGE_SIZE;
      }
    }
    const out           = [];
    for (let i = 0; i < count; i++) {
      if ((i + 1) * PAGE_SIZE > raw.length) break; // 链不够长
      const e = raw.slice(i * PAGE_SIZE, (i + 1) * PAGE_SIZE);
      const mode = u32le(e, DIRENT_MODE);
      if (mode === DIRENT_EMPTY_MODE) continue; // 空槽
      if ((mode & 0x8000) === 0) continue; // ★ 括号不能省
      const { name, nameRaw } = decodeName(e.subarray(DIRENT_NAME, DIRENT_NAME + DIRENT_NAME_MAX));
      const isDot = name === '.' || name === '..';
      out.push({
        index: i,
        mode,
        length: u32le(e, DIRENT_LENGTH),
        cluster: u32le(e, DIRENT_CLUSTER),
        parent: u32le(e, DIRENT_PARENT),
        name,
        nameRaw,
        raw: e,
        isDir: modeIsDir(mode),
        isDot,
        isEmblemDir: !isDot && isEmblemArchiveDirName(name),
      });
    }
    return out;
  }

  /**
   * 目录的"自述项数"：读它第 0 项（`.`）的 length。
   *
   * ⚠️ 真卡上**子目录**的 `.` 项 length 恒为 **0**，项数实际记在**根目录里那个 dirent** 的
   *    length 上（见文档 `01-项目理解\04-记忆卡与存档处理.md` 坑 #3）。
   *    所以 `dirCount()` 只对**根目录**可信；子目录请用其父目录条目的 `length`。
   */
  dirCount(first        )         {
    const cl = this.chain(first, 4);
    if (cl.length === 0) return 0;
    const raw = this.readDataPage(cl[0], 0);
    return u32le(raw, 4);
  }

  /** 根目录项列表（项数取自根目录 `.` 项）。 */
  listRoot()           {
    return this.dirents(this.rootdir, this.dirCount(this.rootdir));
  }

  /** 在根目录里按名字找一项（不含 `.` / `..`）。 */
  findInRoot(name        )                {
    for (const e of this.listRoot()) {
      if (e.isDot) continue;
      if (e.name === name) return e;
    }
    return null;
  }

  /**
   * 按目录名列出其内容。
   * 项数优先用**根目录条目声明的 length**（真卡口径）；取不到时退回 `.` 项的 length。
   */
  listDir(name        )           {
    const e = this.findInRoot(name);
    if (!e) return [];
    const count = e.length > 0 ? e.length : this.dirCount(e.cluster);
    return this.dirents(e.cluster, count);
  }

  /**
   * 识别"徽章存档目录"。
   *
   * ★★ **不能**用 `mode & 0x2000` 判目录（`dump_card_emblems.py` 的实测注释）：
   *    本卡目录 = `0x8427`、文件 = `0x8497` —— 判据是名字最稳。
   *    `E##` 结尾（SL / NX / NB 的 `BISLPS-25169E00` 之类）
   *    或 `EMB` 结尾（LR 的单个 `BISLPS-25462EMB`，内含 `data0..7`）。
   *
   * ★ 0.19：`emblemDirs()` 那个便捷包装删掉了（只有测试在用）——
   *   调用方直接 `listRoot().filter((e) => e.isEmblemDir)`，判据仍在 `Dirent.isEmblemDir` 上。
   */

  // ── 分配 ──

  /**
   * 收集"已占用"的相对簇集合。
   *
   * ★★ 必须包含三类（`65_us2jp.py` 第一步踩过的坑：只标"文件链"会把**目录自己的簇**
   *    当空闲 ⇒ 写数据时**覆盖根目录**）：
   *      1. 根目录自己的簇链
   *      2. 每个子目录自己的簇链 + 其下每个文件的簇链
   *      3. **系统区**：间接 FAT 所在簇 `ifc[0]` + 每个 FAT 块所在簇 `ind[]`
   *    （3 是绝对簇号，但真卡上 `alloc_offset` 之后的相对号与绝对号有固定偏移，
   *      而分配器扫的是相对号区间 `[aoff+2, aend-4)` ⇒ 把绝对号也塞进同一个集合，
   *      与 Python 原版**逐字节等价**，且只会让分配更保守。）
   */
  collectUsedClusters()              {
    const used = new Set        ();
    const mark = (first        )       => {
      for (const cl of this.chain(first, 4096)) used.add(cl);
    };
    used.add(this.ifc[0]); // 间接 FAT（绝对簇号）
    for (const fc of this.ind) {
      if (fc !== INVALID_CLUSTER) used.add(fc); // 各 FAT 块（绝对簇号）
    }
    mark(this.rootdir); // ★ 根目录自己
    // ⚠ 只沿 **dirent 链** 走 ⇒ "刚分配、还没有 dirent 指向"的那些数据簇**看不见**。
    //   `createFileInDir` 第 4 步（扩目录簇）必须自己把它们并回集合 —— 理由与实测见那一段。
    for (const e of this.listRoot()) {
      if (e.isDot) continue;
      mark(e.cluster); // 子目录自己
      const count = e.length > 0 ? e.length : 0;
      if (count <= 0) continue;
      for (const s of this.dirents(e.cluster, count)) {
        if (s.isDot || !s.length || !s.cluster) continue;
        mark(s.cluster); // 文件链
      }
    }
    return used;
  }

  /**
   * 分配 `n` 个空闲簇（返回**连续**的相对簇号）。
   *
   * 逐行对应 `write_data2_inverted.py` / `65_us2jp.py` 的分配循环：
   *   cur = aoff + 2
   *   while len(got) < n:
   *       if cur >= aend - 4: 空间不足
   *       if cur in used: cur += 1; continue
   *       got.append(cur); used.add(cur); cur += 1
   *
   * ★ `aoff + 2` 的起点是**参考实现的选择**（真卡上 `aoff+0` / `aoff+1` 属保留区），
   *   本移植**原样保留**——换成"找最小空闲簇"会让结果与已验证的实机卡不一致。
   */
  allocateClusters(n        , used              )           {
    if (!Number.isInteger(n) || n < 1) {
      // ★ 0.19：`n` 原先只受 `cur >= allocEnd - 4` 约束 ⇒ 直接调这个 API 传个天文数字
      //   会真的去 push 那么多个元素（OOM/卡死）。卡容量在这里就是硬上限。
      throw new Error(`allocateClusters: 簇数必须是正整数（收到 ${n}）`);
    }
    if (n > this.clusters) {
      throw new Error(`allocateClusters: 要 ${n} 簇，超过本卡总簇数 ${this.clusters}`);
    }
    const u = used ?? this.collectUsedClusters();
    const got           = [];
    let cur = this.allocOffset + 2;
    while (got.length < n) {
      if (cur >= this.allocEnd - 4) {
        throw new Error(`卡上空间不足：已分配 ${got.length} / 需要 ${n} 簇`);
      }
      if (u.has(cur)) {
        cur += 1;
        continue;
      }
      got.push(cur);
      u.add(cur);
      cur += 1;
    }
    return got;
  }

  /**
   * 在目录链里找第一个空槽，返回项号；没有则 `-1`。
   *
   * ★ **空槽判据 = `mode === 0xFFFFFFFF`（整项 FF）** ——
   *   **绝不能**写成 `(mode & 0x8000) === 0`：`0xFFFFFFFF` 的 **bit15 = 1**，
   *   那个式子会把"空槽"判成"已用"，于是永远找不到空槽（然后去扩目录、
   *   甚至覆盖同簇的另一页）。真卡依据：`BISLPS-25462GAME` 第 10 槽
   *   （绝对页 1557）整页 FF、mode=0xFFFFFFFF；而 `.` / `..` / `data0` 等
   *   有效项的 mode 都带 bit15。
   *
   * ★ 扫描顺序：**从 0 一路扫到链尾**（不区分"声明项数之内 / 之外"）。
   *   为什么要扫到声明项数**之外** —— 真卡的声明项数会**滞后**（实测 `BISLPS-25462EMB`
   *   曾"声明 6 项、里面已有 7 项"），只看 `[0, count)` 会把已存在的项覆盖掉。
   *   副作用：对 `BISLPS-25462GAME`（声明 9 项 / 链 10 槽）调 `findFreeSlot(chain, 9)`
   *   返回的是 **9（未声明的那个空槽）**，不是 -1 —— 复用它是安全且正确的。
   *   （0.20：原先写成"先扫 `[0, count)`、再扫 `[count, slots)`"两个逐字相同的循环，
   *    注释声称"有意为之"但两段代码没有任何区别 ⇒ 合成一个循环。语义逐字不变：
   *    两段拼起来就是从 0 扫到 `slots`，`count` 只在这条注释里还有意义。）
   */
  findFreeSlot(first        , count        )         {
    const chain = this.chain(first, 4096);
    const slots = chain.length * this.ppc;
    const raw = new Uint8Array(slots * PAGE_SIZE);
    let got = 0;
    for (const cl of chain) {
      if (!this.clusterInImage(cl)) break; // ★ 图外簇 ⇒ 停
      for (let k = 0; k < this.ppc; k++) {
        raw.set(this.readDataPage(cl, k), got);
        got += PAGE_SIZE;
      }
    }
    // `count` 只用于文档/调用方语义（见上），扫描范围是整条链
    void count;
    for (let i = 0; i < slots; i++) {
      if (u32le(raw, i * PAGE_SIZE) === DIRENT_EMPTY_MODE) return i;
    }
    return -1;
  }

  /** 把一条 512 B dirent 写进目录的某个槽（**数据 + 备用区一起写，重算 ECC**）。 */
  writeDirent(dirFirst        , slot        , entry512            )         {
    if (entry512.length !== PAGE_SIZE) throw new Error('dirent 必须 512 B');
    const chain = this.chain(dirFirst, 4096);
    const ci = Math.floor(slot / this.ppc);
    if (ci >= chain.length) throw new Error(`槽 ${slot} 超出目录链（${chain.length} 簇）`);
    const k = slot % this.ppc;
    const page = this.dataPage(chain[ci], k);
    this.writePageRaw(page, entry512);
    return page;
  }

  /**
   * 一条"空 dirent"的 512 B = **整页 `0xFF`**（mode / length / cluster / parent / 名字全 FF）。
   *
   * ★ 真卡实测（`out\evidence\Mcd001_embdata2.ps2` 的 `BISLPS-25462GAME` 第 10 槽，
   *   链 `[465,466,516,680,737]` 的 cl=737 / k=1，绝对页 **1557**）：
   *   空槽**不是**"从没写过的原始页"，而是**被显式写过的整页 FF** ——
   *   它的 16 B 备用区是**算好的 ECC**（`77 7f 7f 77 7f 7f 77 7f 7f 77 7f 7f 00 00 00 00`
   *   = `pageEcc(FF×512)`），而**不是**未写入态的 `FF × 16`。
   *   ⇒ 铺一个新槽/扩目录簇时，必须连备用区一起写（走 `writePageRaw` 会自动重算 ECC）。
   *   只写 512 B 数据区（例如 `buf.set(data, off)`）会留下 `FF×16` 的备用区，
   *   `eccOk()` 就会报坏页 —— 这正是本层第一版扩目录时的缺陷。
   */
  emptyDirent()             {
    return new Uint8Array(PAGE_SIZE).fill(0xff);
  }

  /** 把一条 dirent 写进目录的某个槽，并用它**铺满它所在簇的另一页**（真卡口径：空槽 = FF+ECC）。 */
  writeDirentIntoSlot(dirFirst        , slot        , entry512            )         {
    const page = this.writeDirent(dirFirst, slot, entry512);
    const otherK = 1 - (slot % this.ppc);
    const other = this.dataPage(
      this.chain(dirFirst, 4096)[Math.floor(slot / this.ppc)],
      otherK,
    );
    // 只在"另一页确实是空槽"时才铺 —— 否则会覆盖同簇的另一个有效项
    if (u32le(this.readPageRaw(other), 0) === DIRENT_EMPTY_MODE) {
      this.writePageRaw(other, this.emptyDirent());
    }
    return page;
  }

  /** 只改 dirent 的 length 字段（保持其余字节不动），返回页号。 */
  setDirentLength(dirFirst        , slot        , length        )         {
    const chain = this.chain(dirFirst, 4096);
    const ci = Math.floor(slot / this.ppc);
    if (ci >= chain.length) throw new Error(`槽 ${slot} 超出目录链`);
    const k = slot % this.ppc;
    const page = this.dataPage(chain[ci], k);
    const raw = this.readPageRaw(page);
    setU32le(raw, DIRENT_LENGTH, length >>> 0);
    this.writePageRaw(page, raw);
    return page;
  }

  /**
   * 构造一条新 dirent 的 512 B 字节。
   *
   * 与真卡 layout 的关系：
   *   · mode / length / cluster / parent 写死为给定值；
   *   · 名称区 32 B 完全由 `encodeName()` 决定（名 + `00` + 补 `00`）—— 与真卡一致；
   *   · **其余字节（含 8 B 创建/修改时间）保持 `0xFF`** —— 这是"空槽 + 只填必需字段"的
   *     保守写法（真卡上是合法 BCD 时间）。`createFileInDir` 默认走 `cloneDirent()`，
   *     所以时间戳会**继承自模板文件**；本函数只作为没有模板时的兜底。
   */
  makeDirent(opts   
                 
                    
                   
                  
                    
   )             {
    const e = new Uint8Array(PAGE_SIZE).fill(0xff);
    setU32le(e, DIRENT_MODE, (opts.mode ?? MODE_FILE) >>> 0);
    setU32le(e, DIRENT_LENGTH, opts.length >>> 0);
    setU32le(e, DIRENT_CLUSTER, opts.cluster >>> 0);
    setU32le(e, DIRENT_PARENT, (opts.parent ?? 1) >>> 0);
    e.set(encodeName(opts.name), DIRENT_NAME);
    return e;
  }

  /**
   * 克隆一条已存在的 dirent，只改首簇 + 长度 + 名字。
   *
   * ★ 这是 `write_data2_inverted.py` 第 6 步的做法（实机验证过）：
   *   直接拷 `data0` 的整项、改 `cluster` / `name`，**时间戳等字段原样继承**。
   *   好处是"创建时间 / 修改时间"这种我们不打算复刻的字段自动合法。
   *
   * ★ 名称字段的**确切写法**来自真卡实测（`Mcd001_embdata2.ps2` 的 EMB 目录逐项 dump）：
   *   名称区 32 B = ASCII 名 + `00` + 一串 `00`（**不是 FF**）。
   *   例：`data0` ⇒ `64 61 74 61 30 00 00 …00`。
   *   所以克隆时把整块 32 B 名称区**覆盖成 `encodeName()` 的 32 B**（其余字段整项继承）。
   *   ⚠️ 这里**不能**先 `fill(0xff)` 再只覆盖 `name.length+1` 个字节 ——
   *      那会把"名字之后的填充"留成 FF，与真卡不符（第一版就踩了这个）。
   */
  cloneDirent(src        , newName        , newCluster        , newLength         )             {
    const e = src.raw.slice();
    setU32le(e, DIRENT_CLUSTER, newCluster >>> 0);
    if (newLength !== undefined) setU32le(e, DIRENT_LENGTH, newLength >>> 0);
    e.set(encodeName(newName), DIRENT_NAME);
    return e;
  }

  // ── 高层：在目录里新建一个文件 ──

  /**
   * ★ 在 `dirName` 目录里新建 `fileName`，内容 `data`。**五步**，逐条对应
   *   `write_data2_inverted.py`（那张卡实机验证通过）：
   *
   *   1. **分配簇**：`allocateClusters(ncl)`（占用集合含系统区 + 目录链 + 文件链）
   *   2. **写数据**：逐簇写、每页**重算 ECC**（`writeFileIntoClusters`）
   *   3. **写 FAT 链**：`0x80000000 | next`，末簇 `0x80000000 | 0x7FFFFFFF`（`writeFatChain`）
   *   4. **写 dirent**：克隆同目录下的一条已有文件 dirent（改名 + 改首簇 + 改长度），
   *      写进目录的**空槽**（`writeDirentIntoSlot`：数据 + 备用区一起写、重算 ECC）
   *   5. **更新项数**：`BISLPS-25462EMB` / `BISLPS-25462GAME` 这类目录的项数记在
   *      **根目录里那个 dirent 的 length** 上（目录自己的 `.` 项 length 恒为 0）
   *      ⇒ 默认写 `rootEntry`（见 `CreateFileOptions.countLocation`）。
   *
   *   ★ 空槽怎么找 —— 两条路径，两条都在真卡上有实测依据：
   *
   *   | 情形 | 真卡例子 | 处理 |
   *   |---|---|---|
   *   | **链内有空槽** | `BISLPS-25462GAME`：声明 9 项 / 链 5 簇 = **10 槽** / 第 10 槽是 FF | **复用**该槽（本次实测：绝对页 1557）；`dirExtensionClusters` 为空 |
   *   | **链内全满** | `BISLPS-25462EMB`：声明 8 项 / 链 4 簇 = **8 槽** / 全满 | **扩 1 簇**接进链尾；该簇**两页都初始化**（第 0 页 = 新 dirent，第 1 页 = 整页 FF 空 dirent + 正确 ECC） |
   *
   *   ⚠️ 扩簇时**不能只写第 0 页**：真卡上空槽的形态是"整页 FF **且备用区是算好的 ECC**"
   *      （`pageEcc(FF×512)`），不是"从没写过的 `FF×16` 未写入态"。
   *      只写数据不写备用区 ⇒ `eccOk()` 报坏页，与真卡不符。
   *
   *   返回：改了哪些页、分配了哪些簇、项数改成了什么。
   */
  createFileInDir(
    dirName        ,
    fileName        ,
    data            ,
    opts                    = {},
  )                   {
    const countLocation = opts.countLocation ?? 'rootEntry';
    const extendDir = opts.extendDir ?? true;

    const dirEnt = this.findInRoot(dirName);
    if (!dirEnt) throw new Error(`根目录里没有目录 ${dirName}`);
    const dirFirst = dirEnt.cluster;
    let dirCount = dirEnt.length;
    if (dirCount <= 0) dirCount = this.dirCount(dirFirst);

    // 重名保护
    for (const s of this.dirents(dirFirst, Math.max(dirCount, 1))) {
      if (!s.isDot && s.name === fileName) {
        throw new Error(`${dirName} 里已经有 ${fileName}，拒绝覆盖`);
      }
    }

    const touched           = [];

    // ---- 1) 分配数据簇 ----
    //   ⚠ `used` 会被 `allocateClusters()` **就地补进**这 18 个数据簇；第 4 步扩目录簇时
    //     要重新收集并把这 18 个并回去（理由见那一段的注释）。
    let used = this.collectUsedClusters();
    const ncl = Math.max(1, Math.ceil(data.length / (this.ppc * PAGE_SIZE)));
    const clusters = this.allocateClusters(ncl, used);

    // ---- 2) 写数据（每页重算 ECC） ----
    touched.push(...this.writeFileIntoClusters(clusters, data));

    // ---- 3) 写 FAT 链 ----
    for (const cl of clusters) touched.push(...this.fatPages(cl));
    this.writeFatChain(clusters);

    // ---- 4) 找空槽；没有就扩目录 ----
    //
    // ★ 两条路径（都在真卡上有依据）：
    //   ① **链内有空槽**（真卡 `BISLPS-25462GAME`：声明 9 项 / 链 10 槽 / 第 10 槽是 FF 空槽）
    //      ⇒ 直接复用那个槽，`dirExtensionClusters` 保持空 —— **不扩簇**。
    //   ② **链内全满**（真卡 `BISLPS-25462EMB`：声明 8 项 / 链 8 槽）
    //      ⇒ 再分配 1 簇、接进目录 FAT 链尾，并**把这个新簇的两页都初始化**：
    //         第 0 页 = 新 dirent；第 1 页 = **整页 FF 空 dirent + 算好的 ECC**。
    //      ⚠️ 第一版只写了第 0 页，留下"原始未写入态"的第 1 页（数据 FF… + 备用 FF×16）
    //         ⇒ `eccOk()` 报坏页，与真卡"空槽 = 整页 FF + 正确 ECC"的形态不符。
    //         真卡依据：`Mcd001_embdata2.ps2` 的 `BISLPS-25462GAME` 空槽（绝对页 1557）
    //         备用区 = `77 7f 7f 77 7f 7f 77 7f 7f 77 7f 7f 00 00 00 00` = `pageEcc(FF×512)`。
    const dirExtensionClusters           = [];
    let slot = this.findFreeSlot(dirFirst, dirCount);
    if (slot < 0) {
      if (!extendDir) throw new Error(`${dirName} 没有空槽（需要扩目录）`);
      // ★★ 0.20 修正（占用集合的三条腿都要是最新的）：

//   ⚠ 0.20 更正（原先这段注释说"只给 `verifyChecksumsUpstream()` 做逐行对照用"，与实现不符）：
//     · `verifyChecksumsUpstream()` **用的不是 `DANGLING`**，而是 `FINAL_ALPHA_POS`
//       （上游把末段校验写在 alpha 那一格；`prevCheck + dangling` 只是**代数上等于**它，

//     · `DANGLING` / `DANGLING_LR` 现在**只有测试在用**（两条常量值与上述恒等式），

       const FINAL_CHECK_OFF_LR = LR_SAVE_SIZE - TRAILING - 1; // 0x4414（= palette[255].alpha）

       const DANGLING = FINAL_CHECK_OFF - (17 * BLOCK - 1); // 0x35 = 53
       const DANGLING_LR = FINAL_CHECK_OFF_LR - (17 * BLOCK - 1); // 0x15 = 21

// ---- 修正后的末段常量 ----
/** 0x4400 末段数据起点（两种布局相同）。 */

/** 末段数据长度（含 palette[255].alpha）；= 上游的 dangling。key: LR? */
       const FINAL_DATA_LEN = { false: 53, true: 21 }         ;
/** 末段校验字节位置：0x4435 / 0x4415。 */

  true: FINAL_SEG_OFF + FINAL_DATA_LEN.true,
}         ;
/** palette[255].alpha 位置：0x4434 / 0x4414。 */

  true: FINAL_CHECK_OFF_LR,
}         ;
/** 校验字节之后的 10 字节：游戏写成 `01` + 9 个 0（不参与校验）。 */
       const FINAL_TRAILER = Uint8Array.from([0x01, 0, 0, 0, 0, 0, 0, 0, 0, 0]);
/** 游戏把每个调色板项的 alpha 都写成 0x80（"完全不透明"），索引 0 那项写 0x00。 */
       const PALETTE_ALPHA_OPAQUE = 0x80;

/** 第一段校验的"魔数"种子 —— 上游注释：the first one has a magic number added to sum。 */
       const SEED = 0x98;
       const SEED_LR = 0xb8;

// 非 LR 的「作品常量」字段 0x14..0x1C（9 字节）

//   0x00..0x0B  魔数（= 载荷长度 0x4420、0x4420、图像长度 0x4000）

//   ⇒ "游戏是否真的校验这 9 字节"记为 **[待复测]**，但**照抄真实存档的做法不变**。

       const HEADER_TAIL_OFF = 0x14;
       const HEADER_TAIL_LEN = 9;

       const KNOWN_HEADER_TAIL                                = {

/**
 * 格式错误。Python 版抛 `ValueError` / `RuntimeError`，这里统一成一个类，
 * 但**消息文本与 Python 版逐字对应**（便于排错时两边对得上）。
 */
       class EmblemFormatError extends Error {
  constructor(message        ) {

// --------------------------------------------------------------------------
// 基础工具
// --------------------------------------------------------------------------

/**
 * 逻辑下标 → 物理偏移。等价上游 OffsetIndex()。
 *
 * 每 0x3FF 个数据字节后有一个校验字节，所以物理位置要加上"已经跳过的校验字节数"。
 *
 * ★ 必须用这个函数定位，**绝不能用连续切片**（例如"调色板第 k 项的前 4 字节"）——
 *   0x400 块的边界与 4 字节调色板项的边界不对齐（0x43FF 处有一个校验字节插进来）。
 */
       function offsetIndex(i        , emblemOffset = 0)         {
  return emblemOffset + i + Math.floor(i / BLOCK_DATA);
}

/** RGBA → u32，等价上游 PackColor()（r 在高位）。 */
       function packColor(r        , g        , b        , a        )         {
  return (((r & 0xff) << 24) | ((g & 0xff) << 16) | ((b & 0xff) << 8) | (a & 0xff)) >>> 0;
}

/** u32 → RGBA（packColor 的逆运算）。 */
       function unpackColor(c        )                                   {
  return [(c >>> 24) & 0xff, (c >>> 16) & 0xff, (c >>> 8) & 0xff, c & 0xff];
}

/**
 * 调色板索引乱序重排，等价上游 UnscramblePalette()。
 *
 * 以 32 项为一组，交换中间两组 8 项：
 *     [0..7][8..15][16..23][24..31]  →  [0..7][16..23][8..15][24..31]
 * LR 不做这一步。
 *
 * ★★ 这个置换**自逆**（两次调用回到原值）—— 上游只有一个函数名，Python 版也只有一个
 *    `unscramble_palette()`；两个用途共用它：
 *     · 提取：[像素字节] → 调色板槽号（`UNSCRAMBLE_LUT`）
 *     · 注入：新建的调色板槽号 → [写进像素字节的值]
 *   ⚠ 别"想当然"写成"一个正向 + 一个反向"：那会让非 LR 的索引整体错位
 *     （本移植第一版就是这么错的：lut[8] 算成 0，结果 usedPaletteSlots 只有 64 个）。
 *   ⚠ 0.20：原先那个"方向性别名" `scramblePalette()`（与它逐字相同）已删 ——
 *     它是同一个置换、生产路径零调用点，留着只会让人再问一次"到底哪个是逆"。
 */
       function unscramblePalette(index        )         {
  const group = Math.floor((index % 32) / 8);
  if (group === 1) return index + 8;
  if (group === 2) return index - 8;
  return index;
}

/**
 * 由置换表求**真正的**逆表（仅用于自检：证明上面那个置换确实自逆）。
 * 与上游/Python 无关，不要拿它去替换 UNSCRAMBLE_LUT。
 */
       function invertPalettePermutation(lut            )             {
  const inv = new Uint8Array(256);
  for (let i = 0; i < 256; i++) inv[lut[i]] = i;
  return inv;
}

/**
 * 256 项置换表（上游/Python 只有这一张表）。
 *
 * ★★ 0.20 合并：原先还有一份"逐字相同"的 `scramblePalette()` 与 `SCRAMBLE_LUT`，
 *   注释说"为了读起来有方向感" —— 但两者是**同一个自逆置换**
 *   （`scramble(x) === unscramble(x)`，见 `invertPalettePermutation` 的断言），
 *   而且 `scramblePalette` / `SCRAMBLE_LUT` **在生产路径一个调用点都没有**
 *   （只有测试在用，测试里也顺手断言了"两者逐项相同"）⇒ 收成这一份。
 *   想表达"注入方向"的调用点，直接写 `UNSCRAMBLE_LUT[slot]` 并看本行的说明即可 ——
 *   换成一个只有方向感、没有语义差别的别名，只会让"它到底是不是逆置换"再被问一次。
 */
       const UNSCRAMBLE_LUT             = (() => {
  const t = new Uint8Array(256);
  for (let i = 0; i < 256; i++) t[i] = unscramblePalette(i);
  return t;
})();

/**
 * 是否按 Last Raven 布局解析（上游只看文件大小）。
 *
 * ⚠ 判据是**恰好等于** `LR_SAVE_SIZE`（0x4420），比它短/长都不算 —— 这是公开口径，
 *   别改成"≤"：`container`（比 0x4420 长）与各种畸形缓冲都靠它区分。
 */
       function isLrSave(bytes            )          {
  return bytes.length === LR_SAVE_SIZE;
}

/**
 * `applyChecksums` 用的**布局判据**（仅在"写校验"这条路上替代 `isLrSave`）。
 *
 * 为什么需要它：`isLrSave()` 是**恰好相等**，于是一份 `LR_SAVE_SIZE - 1` 的缓冲会被
 * 当成"非 LR 的短缓冲" ⇒ 末段 alpha 位置取 0x4434 ⇒ 立刻抛 `缓冲区太短`
 * （实测：`applyChecksums(new Uint8Array(0x441F))` 抛在 `writeByteInPlace`）。
 * 但 Python 参考实现在这里**不会抛**：它按 `is_lr = len(save) == LR_SAVE_SIZE` 判，
 * 用的却是**切片赋值**（`z[alpha:] = bytes(size - alpha)`）⇒ 17439 字节的缓冲会被
 * 一路补成 17440 且 18/18。也就是说这条路上真正该用的判据是
 * "**差最后那几个字节**（< `FINAL_DATA_LEN.true` = 21）⇒ 意图显然是 LR 块"，
 * 而不是"必须已经完整"。
 *
 * 边界：`len >= LR_SAVE_SIZE - 1` 才算 —— 与 `LR_SAVE_SIZE - 2` 的行为对照见
 * `core.test.ts`（前者必须补成 0x4420 且 18/18，后者必须抛）。
 * `len > LR_SAVE_SIZE`（容器）**不受影响**，仍按非 LR 处理。
 */
function layoutIsLr(bytes            )          {
  if (isLrSave(bytes)) return true;
  return bytes.length < LR_SAVE_SIZE && bytes.length >= LR_SAVE_SIZE - 1;
}

// --------------------------------------------------------------------------
// 定位
// --------------------------------------------------------------------------

/**
 * 徽章块在文件里的起点。等价上游 FindOffset()。
 *
 * 语义（含上游的怪癖，务必照做）：
 *   * len === 0x4440 → 直接返回 0（不搜索）
 *   * len === 0x4420 → 直接返回 0（不搜索）
 *   * len  > 0x4440 → 在文件里"找" EMBLEM_HEADER
 *   * len  < 0x4440 且 !== 0x4420 → 抛异常（文件太小）
 *
 * ⚠ 上游的"找"是**子序列**匹配而不是子串匹配：它按顺序匹配 header 的 12 个字节，
 *   中途失配就把计数清零，但**不要求 12 个字节相邻**。文件里若散落着这些字节，
 *   定位就可能落在错误的位置。本函数忠实复刻该行为；
 *   `findOffsetContiguous()` 给出"正确"的连续搜索版本，selftest 会比对两者。
 *
 * ⚠ 循环顶部的判断意味着：找到匹配时返回的是"**最后一个匹配字节之后** j 个字节处
 *   再往前退 j"的位置，即 `i - j`（i 是循环当前下标）——与 Python 版逐行一致。
 */
       function findOffset(bytes            )         {
  const n = bytes.length;
  if (n > SAVE_SIZE) {
    let j = 0;
    for (let i = 0; i < n; i++) {
      if (j === EMBLEM_HEADER.length) return i - j;
      if (bytes[i] === EMBLEM_HEADER[j]) j++;
      else j = 0;
    }
    // 循环结束前最后一次匹配也可能刚好凑满
    if (j === EMBLEM_HEADER.length) return n - j;
    throw new EmblemFormatError('findOffset: 在文件里找不到徽章数据（缺少 12 字节魔数）');
  }
  if (n < SAVE_SIZE && n !== LR_SAVE_SIZE) {
    throw new EmblemFormatError(
      `findOffset: 文件太小，不可能是徽章存档（${n} 字节；应为 0x${LR_SAVE_SIZE.toString(16).toUpperCase()} 或 0x${SAVE_SIZE.toString(16).toUpperCase()}）`,
    );
  }
  return 0;
}

/** 正确的连续子串搜索（用于对照上游的子序列搜索）。 */
       function findOffsetContiguous(bytes            )         {
  outer: for (let i = 0; i + EMBLEM_HEADER.length <= bytes.length; i++) {
    for (let k = 0; k < EMBLEM_HEADER.length; k++) {
      if (bytes[i + k] !== EMBLEM_HEADER[k]) continue outer;
    }
    return i;
  }
  throw new EmblemFormatError('findOffsetContiguous: 找不到 12 字节魔数');
}

/**
 * 上游 FindPaletteOffset() 的复刻 —— 判定"拖进来的文件像不像存档"的启发式。
 *
 * 逐字节扫描 [0, stop)，对每个位置取 13 字节，要求：
 *     buf[0..3] 全为 0x00；buf[7] === 0x80；buf[11] === 0x80
 * 中间 6 个字节不检查。
 *
 * ⚠ 上游这一函数有两处缺陷，本函数照做以求行为一致：
 *   ① C++ 里 `curr+i % 0x400 == 0x3FF` 因运算符优先级实际等于 `curr + i == 0x3FF`
 *      （`%` 先算），只在文件开头附近生效；
 *   ② 这个判据本身和 kEmblemHeader 对不上（header[0] = 0x20 ≠ 0），
 *      所以它并不能真正认出徽章存档。
 * 返回命中的偏移，找不到返回 null。
 */
       function findPaletteOffset(data            , stop = 0xffff)                {
  const n = Math.min(data.length, stop);
  let pos = 0;
  while (pos < n) {
    const buf = data.subarray(pos, pos + 13);
    if (buf.length < 13) break;
    let found = true;
    for (let i = 0; i < 12; i++) {
      const off = pos + i === 0x3ff ? 1 : 0; // 见上面 ①
      if (i + off >= buf.length) {
        found = false;
        break;
      }
      if (i < 4 && buf[i + off] !== 0x00) {
        found = false;
        break;
      }
      if ((i === 7 || i === 11) && buf[i + off] !== 0x80) {
        found = false;
        break;
      }
    }
    if (found) return pos;
    pos += 1;
  }
  return null;
}

// --------------------------------------------------------------------------
// 校验和
// --------------------------------------------------------------------------

const LR_KEY = (isLr         ) => (isLr ? 'true' : 'false')                    ;

/**
 * (段起点, 数据字节数, 校验字节位置, 种子) 列表 —— 共 18 段（17 常规 + 1 末段）。
 *
 * 这是从格式本身推出的布局，不照抄上游循环，因此可用作独立判据。
 * 只有第 0 段带魔数种子（0x98 / 0xB8），其余段的累加器都从 0 开始。
 *
 * ★ 末段按**修正后的真实布局**：数据 0x4400..(0x4434 / 0x4414)，校验字节紧随其后
 *   （0x4435 / 0x4415）。上游把校验写在数据内部（0x4434 / 0x4414）是差一个字节的，
 *   见文件顶部的常量说明；`verifyChecksumsUpstream()` 保留上游写法做对照。
 */
       function segmentLayout(isLr         )            {
  const size = isLr ? LR_SAVE_SIZE : SAVE_SIZE;
  const seed0 = isLr ? SEED_LR : SEED;
  const segs            = [];
  for (let k = 0; k < 17; k++) {
    const start = k * BLOCK;
    segs.push({
      start,
      dataLen: BLOCK_DATA,
      checkPos: start + BLOCK_DATA,
      seed: k === 0 ? seed0 : 0,
    });
  }
  const key = LR_KEY(isLr);
  segs.push({
    start: FINAL_SEG_OFF,
    dataLen: FINAL_DATA_LEN[key],
    checkPos: FINAL_CHECK_POS[key],
    seed: 0,
  });
  // 对应 Python 的 assert segs[-1][2] < size
  if (!(segs[segs.length - 1].checkPos < size)) {
    throw new EmblemFormatError('segmentLayout: 末段校验位置越界（内部错误）');
  }
  return segs;
}

/** checksum = (-(种子 + 数据字节之和 + 数据字节数)) & 0xFF。 */
       function computeChecksum(dataRegion            , dataLen        , seed = 0)         {
  let sum = seed + dataLen;
  for (let i = 0; i < dataRegion.length; i++) sum += dataRegion[i];
  return (-sum) & 0xff;
}

/** copy(b, base + start, base + checkPos)，越界时截断（= Python 的列表切片语义）。 */
function sliceClamped(b            , from        , to        )             {
  const lo = Math.max(0, Math.min(from, b.length));
  const hi = Math.max(lo, Math.min(to, b.length));
  return b.subarray(lo, hi);
}

/** 读取一个字节；越界时返回 -1（Python 会抛 IndexError ⇒ 这里显式转成可判定的错）。 */
function byteAt(b            , i        )         {
  if (i < 0 || i >= b.length) {
    throw new EmblemFormatError(`字节越界：偏移 0x${i.toString(16)}，文件长度 ${b.length}（对不上任何布局）`);
  }
  return b[i];
}

/**
 * 复刻 Python `bytearray` 的**切片赋值**扩容：保证下标 `index` 可写。
 * 返回**可能换过底层的数组**（调用方必须接收返回值）。
 *
 * ⚠ 只对"切片赋值"语义使用它（本文件里唯一一处是"校验之后那 10 字节"）。
 *   Python 的**单下标**越界赋值会抛 `IndexError`，那种语义用 `writeByteInPlace()`。
 */
function ensureWritable(b            , index        )             {
  if (index < 0) throw new EmblemFormatError(`ensureWritable: 负下标 ${index}`);
  if (index < b.length) return b;
  const grown = new Uint8Array(index + 1);
  grown.set(b, 0);
  return grown;
}

/** 块起点：长度 > SAVE_SIZE 才搜索，否则 0（与 Python 版各处的 `find_offset(...) if len > SAVE_SIZE else 0` 一致）。 */
function blockBase(bytes            )         {
  return bytes.length > SAVE_SIZE ? findOffset(bytes) : 0;
}

/**
 * 独立复核一个徽章存档的全部 18 段校验字节（按**修正后的真实布局**）。
 *
 * 返回 `{ ok, badSegments }`，只列不通过的段。
 * 这是**独立判据**：它按格式定义重算，而不是把写入器的循环再跑一遍。
 *
 * ★ 末段用的是真实位置（0x4435 / 0x4415）。真实存档全部通过；
 *   上游 `acet` 从空白块造出来的存档会在末段**不通过**（差 0xFF），这正是
 *   非 LR 写入被游戏判 `破損ファイル` 的原因。要看上游写法是否自洽，
 *   用 `verifyChecksumsUpstream()`。
 */
       function verifyChecksums(bytes            )               {
  const isLr = isLrSave(bytes);
  const base = blockBase(bytes);
  const segs = segmentLayout(isLr);
  const badSegments               = [];

  segs.forEach((seg, idx) => {
    const absStart = base + seg.start;
    const absCheck = base + seg.checkPos;
    const data = sliceClamped(bytes, absStart, absCheck);
    if (data.length !== seg.dataLen) {
      badSegments.push({ name: `seg${String(idx).padStart(2, '0')}(截断)`, offset: absCheck, got: -1, expect: -1 });
      return;
    }
    const expect = computeChecksum(data, seg.dataLen, seg.seed);
    const got = absCheck < bytes.length ? bytes[absCheck] : -1;
    if (got !== expect) {
      badSegments.push({ name: `seg${String(idx).padStart(2, '0')}`, offset: absCheck, got, expect });
    }
  });
  return { ok: badSegments.length === 0, badSegments };
}

/**
 * 按**上游 `acet` 的（差一个字节的）末段写法**复核，仅供对照。
 *
 * 上游：末段校验在 0x4434 / 0x4414，输入是 0x4400..0x4433 加上校验之后的尾巴。
 * 真实存档同时满足两套写法（见文件顶部说明），所以这个函数对真实存档也返回通过。
 */
       function verifyChecksumsUpstream(bytes            )               {
  const isLr = isLrSave(bytes);
  const base = blockBase(bytes);
  const size = isLr ? LR_SAVE_SIZE : SAVE_SIZE;
  const end = base + size;
  const segs = segmentLayout(isLr);
  const finalPos = FINAL_ALPHA_POS[LR_KEY(isLr)];
  const badSegments               = [];

  segs.forEach((seg, idx) => {
    let absCheck        ;
    let expect        ;
    if (idx === segs.length - 1) {
      const absStart = base + FINAL_SEG_OFF;
      absCheck = base + finalPos;
      // Python: bytes(save[abs_start:abs_check]) + bytes(save[abs_check+1:end])
      // （末段校验之前的 53/21 字节数据 + 校验字节之后到文件末尾的全部尾巴）
      const head = sliceClamped(bytes, absStart, absCheck);
      const tail = sliceClamped(bytes, absCheck + 1, end);
      const data = new Uint8Array(head.length + tail.length);
      data.set(head, 0);
      data.set(tail, head.length);
      expect = computeChecksum(data, seg.dataLen - 1, seg.seed);
    } else {
      const absStart = base + seg.start;
      absCheck = base + seg.checkPos;
      const data = sliceClamped(bytes, absStart, absCheck);
      expect = computeChecksum(data, seg.dataLen, seg.seed);
    }
    const got = absCheck < bytes.length ? bytes[absCheck] : -1;
    if (got !== expect) {
      badSegments.push({ name: `seg${String(idx).padStart(2, '0')}`, offset: absCheck, got, expect });
    }
  });
  return { ok: badSegments.length === 0, badSegments };
}

/**
 * 就地重算全部 18 段校验字节（按**修正后的真实布局**）。
 *
 * 流程：
 *   1. 把末段的 `palette[255].alpha`（0x4434 / 0x4414）写成游戏约定值 `0x80`；
 *   2. 它之后那 10 字节：**已有非零值就原样保留**（那是游戏写下的字段），
 *      只有从空白块造（全零）时才补上游戏那种 `01 00 00 00 00 00 00 00 00 00`；
 *   3. 逐段算校验：17 个 0x400 块的校验 @0x3FF..0x43FF；
 *      末段 = -(sum(0x4400..0x4434 / 0x4414) + 53 / 21) & 0xFF，写在紧随其后的那一格。
 *
 * ★ 这样写出来的文件**同时满足**上游写法与真实写法（尾部 `X 01 00*9` 使两式恒等），
 *   所以官方 exe 也仍然能正确读回。
 * ★ 本函数作用在**游戏自己写的存档**上时是**逐字节复原**的（`_selftest/validate_writer.py`
 *   对 10 份真实存档断言了这一点）—— 这是判断写入器是否正确的硬判据。
 *
 * ★★ 0.19 修正（D22）：**"Python 会静默扩容 bytearray"这个前提是错的** ——
 *   Python 只有**切片赋值**才扩容，**单下标越界赋值抛 `IndexError`**
 *   （实测 Python 3.12：`bytearray(4)[0x4434]=1` → IndexError；`b[0x4432:0x4434]=…` → 扩容）。
 *   所以这里的语义改成与它逐条对齐：
 *     · `palette[255].alpha` 与 18 个校验字节都是**单下标写** ⇒ 缓冲区不够就**抛**；
 *     · 只有"校验之后那 10 字节"走**切片赋值**（`set`）⇒ 那一段允许扩容（与 Python 一致）。
 *   于是 `0x443F`（差 1 字节）能像 Python 一样补成 17472 且 18/18。
 *   ⚠ 下面 0.20 把 LR 那侧的边界也补齐了：`0x441F`（= LR 差 1 字节）**不再抛**，而是补成
 *     0x4420 且 18/18（Python 同结果）；真正该抛的边界下移到 `0x441E`。
 *
 * ★★ 0.20 修正（两处，都与"短缓冲"有关）：
 *   ① **布局判据**从 `isLrSave()`（"必须恰好 0x4420"）改成 `layoutIsLr()`（"差最后 1 字节也算 LR"）。
 *      原先 `LR_SAVE_SIZE - 1` 的缓冲会被当成"非 LR 的短缓冲" ⇒ 末段 alpha 位置取 0x4434
 *      ⇒ `writeByteInPlace()` 直接抛。Python 参考实现在这里**不会**抛（它按 `len == 0x4420`
 *      判，但用的是**切片赋值**，17439 字节会被补成 17440 且 18/18）。
 *   ② **扩容目标**从"尾巴最后一格"（`trailEnd - 1`）改成
 *      `max(trailEnd - 1, base + 末段校验位)`，并在扩容后**重新算一遍 `base`**。
 *      现状下这两句都是"把不变式写清楚"（`ensureWritable` 是同下标扩长、所有校验位本来就
 *      ≤ `trailEnd - 1`），但它们把"18 个校验位都装得下"这件事从**推断**变成了**保证** ——
 *      以后谁动了 `ensureWritable` 的语义（例如把块搬到 0），这里不会静默写坏数据。
 *
 * ⚠ 返回值：扩容时数组会换底层（`ensureWritable`），**调用方必须接收返回值**。
 */
       function applyChecksums(save            )             {
  const isLr = layoutIsLr(save);
  let base = blockBase(save);
  const segs = segmentLayout(isLr);

  // 1) + 2) 先把末段里的「非校验字节」安置好，再统一算校验
  const alphaPos = base + FINAL_ALPHA_POS[LR_KEY(isLr)];
  save = writeByteInPlace(save, alphaPos, PALETTE_ALPHA_OPAQUE);
  const trailPos = alphaPos + 2; // 校验字节之后的 10 字节
  const trailEnd = trailPos + FINAL_TRAILER.length;
  // 扩容目标见函数注释：尾巴最后一格 **与** 最后一个校验位（末段的 checkPos）里取大者。
  // ⚠ 这里**必须**用 `segs[segs.length - 1].checkPos`，不能用常量拼 —— 布局变动时要跟着变。
  const lastCheckAbs = base + segs[segs.length - 1].checkPos;
  const grown = ensureWritable(save, Math.max(trailEnd - 1, lastCheckAbs)); // ← Python 里是切片赋值 ⇒ 允许扩容
  if (grown !== save) {
    // ★ 扩容过（返回的是新数组）⇒ 把 `base` 重新算一遍再往下用。
    //   `ensureWritable()` 是"**同下标**扩长"（`grown.set(b, 0)`，块的位置不变），所以重算出来的
    //   `base` 与扩容前**必然相同**（`base > 0` 的容器也照旧）；这里重算纯粹是为了不让
    //   "扩容前算的偏移"跨过扩容那道坎继续用 —— 一旦 `ensureWritable` 将来改成"把块搬到 0"，
    //   这一段会自己跟上，而不是继续用过期偏移写坏数据。
    save = grown;
    base = blockBase(save);
    if (base + segs[segs.length - 1].checkPos >= save.length) {
      throw new EmblemFormatError(
        `applyChecksums: 扩容后仍装不下最后一个校验位（块起点 0x${base.toString(16)}、` +
          `长度 ${save.length}）—— 内部错误`,
      );
    }
  }
  // ★ 那 10 字节是**游戏写下的字段**（上游最初的手工逆向里就是从源存档原样抄的），
  //   所以「有真值就保留」；只有从空白块造（全零）时才补上游戏那种 `01 00*9`。
  let anyNonZero = false;
  for (let i = trailPos; i < trailEnd; i++) {
    if (save[i] !== 0) {
      anyNonZero = true;
      break;
    }
  }
  if (!anyNonZero) save.set(FINAL_TRAILER, trailPos);

  // 3) 逐段写校验（末段的数据区间包含刚写好的 alpha）。
  //   ⚠ `absStart` / `absCheck` 在循环**内部**按当前 `base` 算（别提到循环外）——
  //     上面那次扩容会改 `base`，提出来就又会用错偏移。
  for (const seg of segs) {
    const absStart = base + seg.start;
    const absCheck = base + seg.checkPos;
    const data = sliceClamped(save, absStart, absCheck);
    if (data.length !== seg.dataLen) {
      throw new EmblemFormatError(`applyChecksums: 第 ${seg.start / BLOCK} 段数据长度不足`);
    }
    save = writeByteInPlace(save, absCheck, computeChecksum(data, seg.dataLen, seg.seed));
  }
  return save;
}

/**
 * **单下标写**（Python 的 `b[i] = v` 语义）：越界**抛错**，绝不扩容。
 * 与下面的 `ensureWritable()`（切片赋值语义）配对使用 —— 见 `applyChecksums` 的说明。
 */
function writeByteInPlace(b            , index        , value        )             {
  if (index < 0) throw new EmblemFormatError(`writeByteInPlace: 负下标 ${index}`);
  if (index >= b.length) {
    throw new EmblemFormatError(
      `applyChecksums: 缓冲区太短（要写第 0x${index.toString(16)} 字节，只有 ${b.length} 字节）——` +
        'Python 参考实现在这里抛 IndexError，本实现同样拒绝"凭空造出一个块"',
    );
  }
  b[index] = value;
  return b;
}

// 提取 / 注入
// --------------------------------------------------------------------------

/**
 * 从徽章存档里取出 128×128 RGBA8888 图像。等价上游 ExtractImage()。
 *
 * 返回 NUM_PIXELS * 4 = 65536 字节。
 *
 * `alphaMode` 控制 alpha 怎么归一：
 *
 *   * `'acet'`（上游行为）：**任何非零 alpha 一律变成 0xFF**。
 *     用于与官方 exe 逐像素对齐（交叉验证）。
 *   * `'index0'`（★ **最接近游戏实际显示**）：**调色板索引 0 = 透明，其余不透明**，
 *     **完全忽略 alpha 字节**。依据是实机观测（见下）。
 *   * `'gs'`：按 PS2 GS 的 alpha 语义 0..0x80 线性映射。
 *     ⚠ **这个档位看着"更忠实"，但实机证明它不是游戏的行为** —— 保留只作分析用。
 *
 * ★★ 三个档位的由来（2026-10-04，实机定案）：
 *   把 `data0` 的调色板 RGB 全部取反（`palette[0]` 从 `00 00 00 40` 变成 `FF FF FF 40`）
 *   后写进卡上的 `data2`，游戏里那一格显示出来：
 *     · 背景**仍是黑的**（并**没有**变成白、也没有变成 50% 灰）
 *     · 全格找不到成片的纯白（>250）或中性灰（100..190 只有散点）
 *   ⇒ **游戏不把索引 0 的 RGB/alpha 当颜色画**；索引 0 就是"背景/透明色"。
 *   ⇒ 所以 `'index0'` 才是对得上眼睛的那一档；`'gs'` 只是把 alpha 字节当真了。
 *   （未定：索引 0 到底是"透明（露出黑色底板）"还是"被强制画成黑"——
 *     两种解释在实机上都表现为黑，对使用没有区别。）
 */
       function extractImage(save            , alphaMode            = 'acet')             {
  if (alphaMode !== 'acet' && alphaMode !== 'gs' && alphaMode !== 'index0') {
    throw new EmblemFormatError("extractImage: alphaMode 只能是 'acet' / 'gs' / 'index0'");
  }

  const isLr = isLrSave(save);
  const base = blockBase(save);
  const imageOffset = isLr ? LR_IMAGE_OFFSET : IMAGE_OFFSET;

  const pixels = new Uint8Array(NUM_PIXELS);
  for (let i = 0; i < NUM_PIXELS; i++) {
    const p = offsetIndex(imageOffset + i, base);
    if (p < 0 || p >= save.length) {
      throw new EmblemFormatError(`extractImage: 像素数据越界（i=${i}, 偏移 0x${p.toString(16)}）`);
    }
    pixels[i] = save[p];
  }

  const colors = new Uint8Array(PALETTE_SIZE);
  for (let i = 0; i < PALETTE_SIZE; i++) {
    const p = offsetIndex(imageOffset + NUM_PIXELS + i, base);
    if (p < 0 || p >= save.length) {
      throw new EmblemFormatError(`extractImage: 调色板数据越界（i=${i}, 偏移 0x${p.toString(16)}）`);
    }
    let c = save[p];
    // 徽章只有"有/无"两种透明度；完全不透明被编码成 0x80，不是 0xFF
    if (i % 4 === 3) {
      if (alphaMode === 'gs') {
        c = Math.min(255, Math.floor((c * 255) / 128)); // GS 0..0x80 → PNG 0..255
      } else if (c !== 0) {
        c = 0xff;
      }
    }
    colors[i] = c;
  }
  if (alphaMode === 'index0') {
    // 索引 0 = 背景/透明；其余一律不透明（忽略存下来的 alpha 字节）
    for (let k = 0; k < 256; k++) colors[k * 4 + 3] = k === 0 ? 0 : 0xff;
  }

  const out = new Uint8Array(NUM_PIXELS * 4);
  if (isLr) {
    for (let i = 0; i < NUM_PIXELS; i++) {
      const ci = pixels[i] * 4;
      out[i * 4] = colors[ci];
      out[i * 4 + 1] = colors[ci + 1];
      out[i * 4 + 2] = colors[ci + 2];
      out[i * 4 + 3] = colors[ci + 3];
    }
  } else {
    for (let i = 0; i < NUM_PIXELS; i++) {
      const ci = UNSCRAMBLE_LUT[pixels[i]] * 4;
      out[i * 4] = colors[ci];
      out[i * 4 + 1] = colors[ci + 1];
      out[i * 4 + 2] = colors[ci + 2];
      out[i * 4 + 3] = colors[ci + 3];
    }
  }
  return out;
}

/**
 * 把 128×128 RGBA8888 图像写进徽章存档（就地修改）。等价上游 InjectImage()。
 *
 * 规则：
 *   * alpha !== 0xFF 的像素一律当作全透明（写调色板 0 号项 = 全 0）；
 *   * 调色板按"首次出现顺序"分配，所以颜色数 > 255 就会溢出；
 *   * 非 LR 的最后要按 `UNSCRAMBLE_LUT` 重排索引（该置换自逆，与"取出方向"共用一张表）。
 *
 * `strict=true`（默认）时颜色数超限**报错**；`strict=false` 复刻上游的**静默截断**。
 */
       function injectImage(save            , image            , strict = true)             {
  const nPx = Math.floor(image.length / 4);
  if (nPx !== NUM_PIXELS) {
    throw new EmblemFormatError(
      `injectImage: 图像必须恰好 ${NUM_PIXELS} 像素（${IMAGE_WIDTH}×${IMAGE_HEIGHT}），收到 ${nPx}`,
    );
  }

  const isLr = isLrSave(save);
  const base = blockBase(save);
  const imageOffset = isLr ? LR_IMAGE_OFFSET : IMAGE_OFFSET;

  const paletteMap = new Map                ();
  paletteMap.set(packColor(0, 0, 0, 0), 0);

  const writePalette = (slot        , c        )       => {
    for (let ch = 0; ch < 4; ch++) {
      const pos = offsetIndex(imageOffset + NUM_PIXELS + slot * 4 + ch, base);
      // ★ 0.19（D22 附带）：这段注释原来写的是"Python 对越界赋值会静默扩容 bytearray" ——
      //   **那是错的**：Python 只有**切片赋值**才扩容，单下标越界赋值抛 `IndexError`。
      //   所以这里显式报错是与 Python 一致的（不是"刻意的差异"）。
      //   对合法尺寸的存档（0x4420 / 0x4440）两边行为本来就一致。
      // ⚠ 注意 `strict=false` 时 slot 可能是 256，它占 4 个字节：
      //     非 LR = 物理 0x4435..0x4438（**0x4435 正好是末段校验字节那一格**），
      //     LR   = 物理 0x4415..0x4418（0x4415 也正是末段校验字节）。
      //   ⇒ 都在文件长度之内，这个越界检查拦不住上游那条静默路径；
      //     而且写进去的第一格随后会被 `applyChecksums()` 重算覆盖 ⇒ 串色完全被掩盖。
      byteAt(save, pos);
      save[pos] = (c >>> (24 - ch * 8)) & 0xff;
    }
  };

  for (let i = 0; i < nPx; i++) {
    let c = 0;
    if (image[i * 4 + 3] === 0xff) {
      c = packColor(image[i * 4], image[i * 4 + 1], image[i * 4 + 2], 0x80);
    }

    if (!paletteMap.has(c)) {
      // ⚠ 上游判据是 `size() > 256`，所以第 257 项会被放进来，
      //   而其索引 256 写进 1 字节字段时截断成 0 ⇒ 静默串色。
      //   这里保持同样的阈值，但用 strict 把越界明确报出来。
      //
      // ⚠⚠ **判定顺序很要紧**（上游是"先判上限、后插入"）：
      //     · `size > 256` 在**插入前**判 ⇒ size 达到 257 时下一次插入才抛
      //       ⇒ 第 256 个"新颜色"（槽号 256）**已经写进调色板了**，只是它的像素
      //         索引会被截断成 0。这就是上游 257 色的失败方式。
      //     · `strict` 判在 `size >= 256` ⇒ 第 256 个新颜色（= 第 257 项）先抛。
      //   ⚠ 别把 `size += 1` 提前到判断之前 —— 那样连 strict=false 的第 256 项都会抛，
      //     与 Python 版行为不一致。
      if (paletteMap.size > 256) {
        throw new EmblemFormatError('injectImage: 颜色数超过 255（+透明）上限');
      }
      if (strict && paletteMap.size >= 256) {
        throw new EmblemFormatError(
          'injectImage: 第 257 个颜色项会溢出 1 字节索引（上游此处静默截断 ⇒ 串色）；strict=false 可复刻该行为',
        );
      }
      paletteMap.set(c, paletteMap.size);
      writePalette(paletteMap.get(c)          , c);
    }

    const slot = paletteMap.get(c)          ;
    const p = isLr ? slot : UNSCRAMBLE_LUT[slot & 0xff];
    // ⚠ 复刻 C++ 的 `uint8_t` 隐式截断：`strict=false` 时索引可能是 256，
    //    写进 1 字节字段就变成 0（= 透明项）—— 这正是上游 257 色的失败方式。
    const pos = offsetIndex(i + imageOffset, base);
    byteAt(save, pos);
    save[pos] = p & 0xff;
  }

  // ★★ 0.19（D22）：**必须把 `applyChecksums()` 的返回值交回调用方**。
  //   缓冲区偏短时它会换底层数组（"校验之后那 10 字节"是切片赋值 ⇒ Python 也在这里扩容），
  //   原先这里丢掉了返回值 ⇒ 尾字节与 18 段校验全写进了被丢弃的那一份，**不报错、静默无效**
  //   （实测 `injectImage(0x443F 的缓冲)` 之后 `verifyChecksums` 18 段全不过）。
  return applyChecksums(save);
}

/**
 * 辅助：按上游规则把 RGBA 图像量化成 (索引缓冲, 调色板 u32 列表)。
 *
 * 便于检查"这张图会被压成几个颜色 / 索引怎么排"。
 * ⚠ 这里**不做**乱序重排（与 Python 版一致：它是给分析用的，不是给写入用的）。
 */
       function injectPixelsToIndices(image            )                                             {
  const paletteMap = new Map                ();
  paletteMap.set(packColor(0, 0, 0, 0), 0);
  const indices = new Uint8Array(NUM_PIXELS);
  for (let i = 0; i < NUM_PIXELS; i++) {
    let c = 0;
    if (image[i * 4 + 3] === 0xff) {
      c = packColor(image[i * 4], image[i * 4 + 1], image[i * 4 + 2], 0x80);
    }

/** 待合帧的取景动作（一帧最多应用一次；见文件头那段）。 */
let pending                                                  = null;
/** 已排队的 rAF id（0 = 没有排）。 */
let rafId = 0;

/** 由 `main.ts` 注入：**提交**取景参数后跑一次完整管线 + 刷新面板（避免本模块 import pipeline 造成环）。 */
let onChanged                      = null;
/**
 * 由 `main.ts` 注入：只把"当前图片"重新量一次尺寸再画一遍（**不重算、不重建统计面板**）。
 * 进出取景视图时那两层切换 ⇒ 预览容器从"没布局"变回"有布局"，需要这一下；
 * 但它不该顺带跑 `prepareEmblem()`（那是上一版卡顿的一部分）。
 */
let onRelayout                      = null;

/** 数字读数：小于 100 保留 1 位小数，否则取整（`describeWindow`/`confirmCrop` 共用一份）。 */
function fmt(v        )         {
  return Math.abs(v) < 100 ? v.toFixed(1) : String(Math.round(v));
}

function collect()           {
  if (refs) return refs;
  const canvas = document.createElement('canvas');
  canvas.width = 1;
  canvas.height = 1;
  canvas.className = 'crop-canvas';
  $('view-source').appendChild(canvas);
  refs = {
    layer: $('stage-crop'),
    cropStage: $('crop-stage'),
    frame: $('crop-frame'),
    finalLayer: $('stage-final'),
    actions: $('crop-actions'),
    cropBtn: document.getElementById('btn-crop')                     ,
    zoomNote: document.getElementById('preview-zoom-note'),
    canvas,
    sizeRange: document.getElementById('crop-size-range')                           ,
    sizeNum: document.getElementById('crop-size-num')                           ,
  };
  installPointer(refs);
  return refs;
}

/**
 * 写状态行。
 *
 * ★ 0.40：原来这里自己又写了一遍 `#status`（`setStatus()` 已经写了）⇒ 拖动期间每帧写两遍同一个
 *   节点，纯浪费。现在就是 `setStatus()` 的薄包装，只负责把 `redo` 一起带上（切语言时重说）。
 */
function setStatusText(text        , redo               )       {
  setStatus(text, redo ?? null);
}

/**
 * 舞台内部可用尺寸（`.crop-stage` 的盒子 = 白框与源图的共同坐标系）。
 *
 * ⚠ 读 `getBoundingClientRect()` 会**强制布局**。拖动时一帧读一次本身还行，但"读→写→读→写"
 *   交替就是 layout thrash；所以这里的结果**缓存**起来，由 `layoutCropView()` 刷新、
 *   窗口尺寸变化时（`resize`）作废 —— 拖动过程中一次读都不做。
 */
function stageBox()                           {
  if (cachedBox) return cachedBox;
  const r = collect();
  const rect = r.cropStage.getBoundingClientRect();
  cachedBox = { w: Math.max(16, Math.floor(rect.width)), h: Math.max(16, Math.floor(rect.height)) };
  return cachedBox;
}

function windowBounds()                      {
  const s = state.source;
  // ★ 下限跟**目标边长**走（PS2 = 128）：窗口到 128 源像素就是 1:1，再小就是"吹像素"（见 cropGeometry 的长注释）
  return s ? windowBoundsFor(s.width, s.height, state.params.targetSize) : null;
}

/** 取当前窗口（没有就从参数推；永远夹在合法区间里）。 */
function resolveWindow()                    {
  const s = state.source;
  if (!s) return null;
  const b = windowBounds();
  if (!win) win = manualToWindow(state.params, s.width, s.height, state.params.targetSize);
  win = b ? clampWindow(win, s.width, s.height, b) : win;
  return win;
}

/**
 * 把源图画进画布（**只在换图时**重画一次）。
 *
 * ⚠ 画布按**源图自然尺寸**做 CSS 像素，再整体 `scale(k)`：
 *   这样"源像素 → 屏幕像素"只有一个因子 `k`，与 `cropGeometry` 的推导完全一致，
 *   **不能**用 `max-width:100%` 之类让浏览器二次缩放（那会让指针换算悄悄算歪）。
 */
function paintSourceIfNeeded(s             )       {
  const r = collect();
  if (painted === s && r.canvas.width === s.width && r.canvas.height === s.height) return;
  r.canvas.width = s.width;
  r.canvas.height = s.height;
  r.canvas.style.width = `${s.width}px`;
  r.canvas.style.height = `${s.height}px`;
  const ctx = r.canvas.getContext('2d')                            ;
  ctx.clearRect(0, 0, s.width, s.height);
  const tmp = document.createElement('canvas');
  tmp.width = s.width;
  tmp.height = s.height;
  const tctx = tmp.getContext('2d')                            ;
  tctx.putImageData(new ImageData(s.data, s.width, s.height), 0, 0);
  ctx.imageSmoothingEnabled = false;
  ctx.drawImage(tmp, 0, 0);
  painted = s;
}

/**
 * 重排取景视图：摆白框（只看舞台尺寸）+ 按窗口把源图缩放/平移到正确位置。
 *
 * 白框的位置/边长来自 `frameRectFor(box)`；源图的位置来自 `imagePlacement(box, win)`
 * —— 后者保证"**窗口左上角正好落在白框左上角**"，也就是用户看到的那句话：
 * 白框里框住的那块源图，就是确定以后要被裁下来的那块。
 *
 * ★ 这个函数**只写样式**（+ 一帧一次的状态行文本），不读布局（盒子走缓存）、
 *   不碰参数、不跑管线、不重建任何面板 —— 所以可以每帧调一次。
 */
       function layoutCropView()       {
  if (!active) return;
  const r = collect();
  const s = state.source;
  if (!s) return;
  const box = stageBox();
  const f = frameRectFor(box);
  frameSide = f.size;
  // ★ 0.41：角标文字（`styles.css` 的 `.crop-frame::after { content: attr(data-label) }`）按
  //   **唯一真值** `params.targetSize` 写 —— 原来 CSS 里写死 '128×128'，换目标边长就会撒谎。
  {
    const label = `${state.params.targetSize}×${state.params.targetSize}`;
    if (r.frame.getAttribute('data-label') !== label) r.frame.setAttribute('data-label', label);
  }
  r.frame.style.left = `${f.left}px`;
  r.frame.style.top = `${f.top}px`;
  r.frame.style.width = `${f.size}px`;
  r.frame.style.height = `${f.size}px`;

  const w = resolveWindow();
  if (!w) return;
  paintSourceIfNeeded(s);
  const pl = imagePlacement(box, w);
  r.canvas.style.transformOrigin = '0 0';
  r.canvas.style.transform = `translate(${pl.left}px, ${pl.top}px) scale(${pl.k})`;
  // 放大（或整数倍缩小）用最近邻，其余缩小用浏览器平滑 —— 与核心选核的口径一致
  // （口径在 `core/image.ts::selectScaleKernel()`；0.41 审查顺手删掉了没人调用的旧包装 `chooseKernel()`）
  const inv = pl.k > 0 ? 1 / pl.k : 1;
  const crisp = pl.k >= 1 - 1e-9 || Math.abs(inv - Math.round(inv)) < 1e-9;
  r.canvas.style.imageRendering = crisp ? 'pixelated' : 'auto';
}

/**
 * ★ 0.40：切语言时重画取景那几行**文字**（`#crop-readout` + 状态行里那句"取景：白框 = …"）。
 *
 * 为什么需要单独一个入口：`layoutCropView()` **只写样式**，文字全在 `describeWindow()` 里，
 * 而切语言那条路原来只调了 `layoutCropView()` ⇒ 白框下面那行读数停在旧语言
 * （审查抓到的：中文进取景 → 切 English，读数还是"左上角 (320, 0) · 倍率 0.120 · ★ 已到最小…"）。
 * ⚠ 顺带把舞台尺寸缓存作废：两种语言的读数长短不同 ⇒ 动作行高度可能变 ⇒ 白框要重新摆一次。
 */
       function refreshCropText()       {
  if (!active) return;
  describeWindow();
  cachedBox = null;
  layoutCropView();
}

/**
 * ★ 0.12：取景动作行里那格**实时读数**（白框 = 源图哪一块 / 倍率 / 是否已到最小）。
 *
 * ⚠ 为什么要有它：这些数字原来只写进 `#status`，而状态行在**页面最下面**（8 槽那一块），
 *   取景时看不见（用户："ok了，然后状态行在哪"）。这里就在白框正下方，跟着拖动/滚轮一起变。
 * 每帧只写一次 `textContent`（不读布局、不建 DOM），性能契约不受影响。
 */
function setReadout(text        , atMin = false)       {
  const host = document.getElementById('crop-readout');
  if (!host) return;
  host.textContent = text;
  host.className = atMin ? 'crop-readout at-min' : 'crop-readout';
}

/**
 * ★ 0.38（用户）：把白框边长**一步设成** `size` 源像素 —— 滑条与输入框共用的**唯一**入口。
 *
 * 用户原话：「在图中红方块位置放一个缩放条，用于控制白框取景的大小，边上再加一个输入框，
 * 可以实时看到目前取景框的大小，也可以修改大小」「现在的取景框只能用鼠标缩放，精度不够高」。
 *
 * ⚠ 与拖动/滚轮一样**只动视觉**：不碰 `state.params`、不跑管线（性能契约不变，见文件头）。
 * 锚点是**白框中心**（`resizeWindowTo()`），与滚轮同一条规则 ⇒ 两种操作手感一致。
 */
       function setCropWindowSize(size        )       {
  const s = state.source;
  if (!active || !s || !win) return;
  win = resizeWindowTo(win, size, s.width, s.height, windowBounds() ?? undefined);
  layoutCropView();
  describeWindow(); // 顺手把滑条 / 输入框同步成夹取之后的真值
}

/**
 * 把滑条与输入框同步成**当前窗口**的边长（滚轮/拖动改过之后也要跟上）。
 *
 * ⚠ 两条纪律：
 *   ① **输入框正在被编辑时不回写** —— 否则用户敲"1"（想输 180）就先被夹成 128 再写回框里，
 *      字直接被吃掉。`force = true`（敲完那一下：`change` / `blur`）才写：那一刻用户已经
 *      "交卷"了，把夹取之后的真值显示给他才是对的（输 `9999` 就该看到 `604`，不能留一个假读数）。
 *   ② 值没变就**不写** —— 这个函数每帧（拖动/滚轮期间）都会被 `describeWindow()` 叫一次，
 *      无谓的赋值会让浏览器白干活。
 */
function syncSizeControls(force = false)       {
  const b = windowBounds();
  if (!b || !win) return;
  const r = collect();
  const v = Math.round(win.size);
  const lo = Math.ceil(b.min);
  const hi = Math.floor(b.max);
  for (const el of [r.sizeRange, r.sizeNum]) {
    if (!el) continue;
    if (el.min !== String(lo)) el.min = String(lo);
    if (el.max !== String(hi)) el.max = String(hi);
    if (el.step !== '1') el.step = '1';
  }
  if (r.sizeRange && r.sizeRange.value !== String(v)) r.sizeRange.value = String(v);
  if (r.sizeNum && (force || document.activeElement !== r.sizeNum) && r.sizeNum.value !== String(v)) {
    r.sizeNum.value = String(v);
  }
}

/** 输入框里那串字 ⇒ 边长；不是数字（空串 / 半截负号）⇒ `null`（这一下什么都不做）。 */
function sizeFromInput(raw        )                {
  const v = Number(raw.trim());
  return Number.isFinite(v) && v > 0 ? Math.round(v) : null;
}

/**
 * 绑定滑条与输入框。
 *
 *   · 滑条：`input` 事件实时生效（`step=1` ⇒ 精确到一个源像素）；
 *   · 输入框：`input` 事件里**只认合法数字**（边打边生效），敲完（`change`/`blur`）再校正一次
 *     —— 手输 `99999` 会被夹到上限、清空则回到当前值，两种都不会留下一个假读数。
 */
function bindSizeControls(r          )       {
  r.sizeRange?.addEventListener('input', () => {
    const v = sizeFromInput(r.sizeRange?.value ?? '');
    if (v !== null) setCropWindowSize(v);
  });
  r.sizeNum?.addEventListener('input', () => {
    const v = sizeFromInput(r.sizeNum?.value ?? '');
    if (v !== null) setCropWindowSize(v);
  });
  const tidy = ()       => {
    const v = sizeFromInput(r.sizeNum?.value ?? '');
    if (v !== null) setCropWindowSize(v);
    syncSizeControls(true); // 敲完了 ⇒ 强制把框里的字改成夹取之后的真值（输 9999 要看到 604）
  };
  r.sizeNum?.addEventListener('change', tidy);
  r.sizeNum?.addEventListener('blur', tidy);
}

/** 状态行上的取景读数（白框 = 源图上的哪一块）—— 顺手把当前倍率也报出来。 */
function describeWindow()       {
  const s = state.source;
  if (!s || !win) return;
  const scale = state.params.targetSize / win.size;
  // ★ 0.11：窗口有**下限**（= 目标边长，1:1）⇒ 到底了就明确说一句，别让人以为滚轮坏了
  const b = windowBounds();
  const atMin = !!b && win.size <= b.min + 1e-6;
  // ★ 0.38：读数里**不再重复"白框 N×N 源像素"** —— 它就写在同一个动作行的输入框里
  //   （那一格既可看又可改）；这一行挤了会把〔取消〕顶到第二行去。留下的是"位置 + 倍率 + 到没到最小"。
  // ① 白框下面那行（取景时唯一看得见的地方）
  setReadout(
    t(
      `左上角 (${fmt(win.x)}, ${fmt(win.y)}) · 倍率 ${scale.toFixed(3)}`,
      `top-left (${fmt(win.x)}, ${fmt(win.y)}) · zoom ${scale.toFixed(3)}`, `左上 (${fmt(win.x)}, ${fmt(win.y)}) · 倍率 ${scale.toFixed(3)}`, `왼쪽 위 (${fmt(win.x)}, ${fmt(win.y)}) · 배율 ${scale.toFixed(3)}`,
    ) + (atMin ? t(' · ★ 已到最小（1:1，不能再放大）', ' · ★ At minimum (1:1, cannot zoom in further)', ' · ★ 最小です（1:1、これ以上拡大できません）', ' · ★ 최소입니다(1:1, 더 이상 확대할 수 없음)') : ''),
    atMin,
  );
  // ② 页面最下面的状态行（也在写入日志旁边，留着方便回溯）
  //   ★ 0.40：写成**一个可重算的函数**并交给 `setStatus()` 当 `redo` —— 切语言时它会按新语言
  //   再说一遍（读的是**当前**窗口，所以拖动之后再切语言也不会说到旧数字）。
  const statusLine = ()         => {
    if (!win) return '';
    const sc = state.params.targetSize / win.size;
    const min = !!b && win.size <= b.min + 1e-6;
    return (
      t(
        `取景：白框 = 源图 ${fmt(win.size)}×${fmt(win.size)}，左上角 (${fmt(win.x)}, ${fmt(win.y)})，倍率 ${sc.toFixed(3)}`,
        `Crop: box = ${fmt(win.size)}×${fmt(win.size)} of the source image, top-left (${fmt(win.x)}, ${fmt(win.y)}), zoom ${sc.toFixed(3)}`, `トリミング：白枠 = 元画像の ${fmt(win.size)}×${fmt(win.size)}、左上 (${fmt(win.x)}, ${fmt(win.y)})、倍率 ${sc.toFixed(3)}`, `자르기: 흰색 상자 = 원본 이미지 ${fmt(win.size)}×${fmt(win.size)}, 왼쪽 위 (${fmt(win.x)}, ${fmt(win.y)}), 배율 ${sc.toFixed(3)}`,
      ) +
      (min
        ? t(
            `　——　★ 已经到最小（1:1，再往里滚不会更小：不允许把源图放大）`,
            '  —  ★ Already at minimum (1:1; scrolling further will not shrink it: upscaling the source is not allowed)', '　——　★ すでに最小です（1:1。これ以上スクロールしても小さくなりません：元画像の拡大はできません）', '　——　★ 이미 최소입니다(1:1, 더 스크롤해도 더 작아지지 않습니다: 원본 이미지 확대는 허용되지 않습니다)',
          )
        : '') +
      t(
        `　——　拖图片移动 · 滚轮缩放（缩小可看到整张图）；参数面板等〔确定取景〕时一次更新。`,
        '  —  Drag to move · scroll to zoom (zoom out to see the whole image); the parameter panel updates once you press Apply crop.', '　——　ドラッグで画像を移動 · ホイールで拡大縮小（縮小すると画像全体が見えます）。パラメータパネルは〔トリミングを確定〕で一度に更新されます。', '　——　드래그로 이미지 이동 · 휠로 확대·축소(축소하면 이미지 전체가 보입니다). 매개변수 패널은〔자르기 적용〕을 누를 때 한 번에 갱신됩니다.',
      )
    );
  };
  setStatusText(statusLine(), statusLine);
  // ★ 0.38：滑条 / 输入框跟着一起同步（滚轮、拖动、进视图都从这里过）
  syncSizeControls();
}

// --------------------------------------------------------------------------
// 拖动/滚轮：只动视觉，rAF 合帧（**不跑管线**）
// --------------------------------------------------------------------------

/**
 * 把 `pending` 里的位移/缩放应用到窗口上，然后重排一次（**一帧只会跑一次**）。
 * 没有待处理动作时也重排一下（那是"窗口尺寸变了/手动强制刷新"的情形）。
 */
function applyPending()       {
  const s = state.source;
  if (!s || !win || !pending) {
    if (active) layoutCropView();
    return;
  }
  const { dx, dy, zoom } = pending;
  pending = null;
  let next = win;
  // ★ 0.19（D15）：**先平移、后缩放**。累积的拖动量是"用户看到的那一屏"上量出来的，
  //   而 `panWindow` 要用屏幕倍率换算；先缩放就会拿**新**倍率去换算旧位移（一帧内偏差）。
  if (dx !== 0 || dy !== 0) {
    // `frameSide` 由 `layoutCropView()` 在每次进入/重排时写好；本函数只在取景视图里跑，
    // 所以它一定 > 0（不再需要"取不到就现算一次"的第二个真值来源）。
    next = panWindow(next, dx, dy, frameSide, s.width, s.height, windowBounds() ?? undefined);
  }
  if (zoom !== 1) next = zoomWindowAtCenter(next, zoom, s.width, s.height, windowBounds() ?? undefined);
  win = next;
  layoutCropView();
  describeWindow();
}

/**
 * ★ 把待处理的动作**立刻**应用 + 重排（并撤掉已排队的 rAF）。
 *
 * 浏览器里由 `scheduleFlush()` 的 rAF 每帧调一次；抬手时、以及测试/冒烟里
 * （桩环境没有真实帧循环）由本函数直接调 —— 两条路走的是同一段代码。
 */
       function flushCropLayout()       {
  if (rafId) {
    cancelAnimationFrame(rafId);
    rafId = 0;
  }
  applyPending();
}

function scheduleFlush()       {
  if (rafId) return;
  // 浏览器里一帧最多刷一次；桩环境（node:vm）把 rAF 实现成 setTimeout，同样只是"稍后一次"
  rafId = requestAnimationFrame(() => {
    rafId = 0;
    applyPending();
  });
}

/**
 * 拖动图片 `dx/dy` 屏幕像素（**指针处理与测试/冒烟共用这一个入口**）。
 * 只累加待处理量 + 排一次 rAF，**不**碰参数、**不**跑管线。
 */
       function applyDrag(dx        , dy        )       {
  if (!active || !win || !state.source) return;
  if (dx === 0 && dy === 0) return;
  pending = { dx: (pending?.dx ?? 0) + dx, dy: (pending?.dy ?? 0) + dy, zoom: pending?.zoom ?? 1 };
  scheduleFlush();
}

/** 缩放一格（`factor > 1` = 放大；同样只动视觉）。 */
       function applyZoom(factor        )       {
  if (!active || !win || !state.source) return;
  if (!(factor > 0) || factor === 1) return;
  pending = { dx: pending?.dx ?? 0, dy: pending?.dy ?? 0, zoom: (pending?.zoom ?? 1) * factor };
  scheduleFlush();
}

/** 丢掉还没应用的动作（离开取景视图时用）。 */
function cancelPending()       {
  pending = null;
  if (rafId) {
    cancelAnimationFrame(rafId);
    rafId = 0;
  }
}

/** 供测试/冒烟：当前取景视图的可观测状态（窗口 + 视觉）。 */
       function cropInfo()   
                  
               
            
            
                    
                    
  {
  return {
    active,
    size: win ? win.size : 0,
    x: win ? win.x : 0,
    y: win ? win.y : 0,
    frameSide,
    transform: refs ? String(refs.canvas.style.transform ?? '') : '',
  };

/**
 * 缩略图节点（**建的时候就把像素画好**）。
 *
 * ★ 0.19：原来先建空 canvas、等插进文档之后再跑一趟 `paintThumbs(querySelectorAll)`
 *   才 `putImageData`（配一个 `WeakMap` 记缩略图 + `dataset.rendered` 标记）。那套机制
 *   只为"延迟一次绘制"，而 `putImageData` 在游离 canvas 上本来就可用 ⇒ 直接画，少 ~15 行
 *   与两个失效标记（`dataset.rendered === '1'` 在"每次都新建 canvas"的前提下永远不成立）。
 * ★ 0.31 / 0.37（用户要图片"看起来更大"）：**尺寸交给 CSS** —— 原来这里写死
 *   `style.width/height = 96px`；现在图片**占满整张卡片的宽度**（`styles.css` 的 `.slot` /
 *   `.thumb-cv`：`width:100%` + `aspect-ratio:1/1`）。
 *   ⚠ 别把尺寸写回 inline style：inline 会盖掉 CSS，用户要的"更大"就没了。
 *   画布本身的 128×128 后备像素不变（`image-rendering: pixelated` 负责放大不糊）。
 */
function thumbNode(thumb                  )                                     {
  if (!thumb) return el('div', { class: 'thumb-empty', text: t('＋', '+', '＋', '＋') });
  const cv = el('canvas', { class: 'thumb-cv', width: 128, height: 128 });
  const ctx = cv.getContext('2d')                            ;
  ctx.imageSmoothingEnabled = false;
  ctx.putImageData(new ImageData(thumb.data, thumb.width, thumb.height), 0, 0);
  return cv;
}

/**
 * ★ 0.37（用户）：`renderSlots()` **不再收作品上下文** —— 卡片上已经没有需要按作品算出来的
 *   文字了（原来要算"这个空槽属于哪个目录 / 卡上有没有那个目录"，用来写空槽提示）。
 *   空槽提示连同整段卡片文本一起删除（见文件头）。
 */
       function renderSlots(model                  , cb               )       {
  const host = document.getElementById('slot-grid');
  if (!host) return;
  clear(host);

  // ★ 0.37：8 槽上方原来那行**摘要整句**已按用户要求删除（占用与空槽数、当前作品的目录名、
  //   卡上其它作品的清单，全都不再显示）。
  //   这里只剩一个**条件警告位**：本作品在卡上一个目录都没有、而卡上其实有别的作品的目录时，
  //   必须让用户看见"被隐藏了什么"（否则他会以为这张卡是空的）——这是原来那句摘要里唯一
  //   具有安全性的部分，所以它没被删掉，只是改成**只在需要时出现**。
  const note = document.getElementById('slot-note');
  if (note) {
    clear(note);
    const n = model?.excludedDirNames.length ?? 0;
    const warn = !!model && model.dirNames.length === 0 && n > 0;
    note.hidden = !warn;
    if (warn) {
      // ★ 0.43（用户："提示过于重复了"）：这条警告是"被隐藏了什么"的**主位**（就在 8 格正上方），
      //   所以它自己说全（几个别的作品的目录 + 切作品查看）；状态行/toast 那边只留一句指针。
      //   原来它写的是"卡上别的作品的徽章目录被隐藏了" —— 现在直接给出**条数**（更有信息量）。
      note.appendChild(
        el('span', {
          class: 'warn',
          text: t(
            `⚠ 这个作品在卡上还没有目录（卡上还有 ${n} 个别的作品的目录 · 切作品查看）`,
            `⚠ This game has no folder on this card yet (the card also holds folders for ${n} other games - switch game to view them)`, `⚠ この作品はまだカード上にフォルダがありません（カードには他に ${n} 作品分のフォルダがあります · 作品を切り替えて表示）`, `⚠ 이 작품은 아직 카드에 폴더가 없습니다 (카드에 다른 ${n}개 작품의 폴더가 있습니다 · 작품을 전환해 확인)`,
          ),
        }),
      );
    }
  }

  for (let i = 0; i < 8; i++) {
    const slot = model?.slots[i] ?? null;
    const thumb = state.thumbs[i] ?? null;
    const selected = state.selectedSlot === i;
    const occupied = !!slot?.occupied;
    const cls = ['slot', selected ? 'slot-selected' : '', occupied ? 'slot-occupied' : 'slot-empty']
      .filter(Boolean)
      .join(' ');

    // ★ 0.37（用户）：卡片 = **槽号在上、图在下**，没有第三样东西。
    //   版式原话："上面是槽（序号），下面红色的部分显示图片（红色部分是位置示意）"。
    const card = el(
      'div',
      {
        class: cls,
        'data-slot': String(i),
        role: 'button',
        tabindex: '0',
        onclick: () => cb.onSelect(i),
        onkeydown: (ev       ) => {
          const k = (ev                 ).key;
          // ★ 0.19（D14）：空格要 `preventDefault()`，否则"用空格选槽"会顺带把页面滚一段。
          if (k === 'Enter' || k === ' ') {
            ev.preventDefault();
            cb.onSelect(i);
          }
        },
      },
      el('span', { class: 'slot-no', text: t(`槽 ${i + 1}`, `Slot ${i + 1}`, `スロット ${i + 1}`, `슬롯 ${i + 1}`) }),
      thumbNode(thumb),
    );
    host.appendChild(card);
  }
}

/**
 * ★ 0.41（审查抓到）：**只改"哪一格被选中"的高亮**，不重建 8 格。
 *
 * 原来 `main.ts::selectSlot()` 每次点选都整批 `renderSlots()`（clear + 重建 8 张卡 + 8 次
 * `putImageData`）⇒ 被聚焦的那张卡**被删掉重建**，键盘焦点掉回 body（`tabindex` / `role=button`
 * 形同虚设：按 Tab 进去选一格，焦点就没了，没法接着用键盘选下一格），而且每次点选白重画 8 张缩略图。
 * 现在只切 class —— 卡还是那批节点，焦点与缩略图都留着。
 */
       function markSelectedSlot(index        )       {
  for (const card of document.querySelectorAll('.slot')) {
    card.classList.toggle('slot-selected', card.getAttribute('data-slot') === String(index));
  }
}

/** 作品下拉框（只在学校验一次）。 */
       function fillGameSelect(games                      , currentId        )       {
  const sel = document.getElementById('game-select')                            ;
  if (!sel) return;
  clear(sel);
  for (const g of games) {
    const label = t(g.label, g.en, g.ja, g.ko) + (g.verified ? ' ✅' : t(' ⚠ 未验证', ' ⚠ unverified', ' ⚠ 未検証', ' ⚠ 미검증'));
    // ★ 0.19（B9）：只写 `.value` —— 原来还额外给 option 加 `selected:` 属性（同一件事写两遍，
    //   而 option 不存在时 `.value =` 是**静默无效**的，两处不一致反而更难查）。
    sel.appendChild(el('option', { value: g.id }, label));
  }
  sel.value = currentId;
}

/** 作品说明 + 自定义序列号输入框的显隐。 */
       function renderGameNote(entry                  )       {
  const note = document.getElementById('game-note');
  if (note) {
    clear(note);
    // ★ 2026-10-05（0.9 / 0.10）：已验证的作品**不再显示**那行"✅ 有实机证据　<说明>"
    //   （用户："这两段也删了"）；只保留**未验证作品的警告** —— 那是安全标注，不能省
    //   （SPEC §七：AC2 / AC2AA / AC3 / NB / 自定义 都要标"未验证"）。
    //   未验证作品的 note 文案本身就以"⚠ 未验证"开头（见 `logic/games.ts`），直接原样显示。
    if (entry && !entry.verified) {
      note.appendChild(el('span', { class: 'warn', text: t(entry.note, entry.noteEn, entry.noteJa, entry.noteKo) }));
    }
  }
  const customRow = document.getElementById('custom-serial-row');
  if (customRow) customRow.style.display = entry && entry.id === 'custom' ? '' : 'none';
}

/**
 * 忙提示（`#busy` 那个转圈）。

 * ★ 0.19（B6）：状态行**文本**已经由 `state.ts::setStatus()` 一并写好（收口到一处），

 *   9 处里有 2 处忘了配（状态行永远停在上一条文字）。本函数是幂等的兜底。
 */
       function renderStatus()       {
  const s = document.getElementById('status');
  if (s) s.textContent = state.status;
  const busy = document.getElementById('busy');
  if (busy) busy.style.display = state.busy ? '' : 'none';
}

/** 写入日志（右下角那个滚动框）。 */
       function renderLog(lines                   )       {
  const host = document.getElementById('write-log');
  if (!host) return;
  clear(host);
  // ★ 0.18：界面上不再有"欢迎/说明"那几行 ⇒ 没有内容时**整个框藏起来**
  //   （原来是常驻一个空框，看着像出错了）。第一次写入/导出/看目录项之后它才出现。
  host.hidden = lines.length === 0;
  for (const l of lines) {
    host.appendChild(el('div', { class: l.startsWith('❌') ? 'log-bad' : l.startsWith('✅') ? 'log-ok' : 'log-line', text: l }));
  }
  host.scrollTop = host.scrollHeight;
}

exports.renderSlots = renderSlots;
exports.markSelectedSlot = markSelectedSlot;
exports.fillGameSelect = fillGameSelect;
exports.renderGameNote = renderGameNote;
exports.renderStatus = renderStatus;
exports.renderLog = renderLog;
