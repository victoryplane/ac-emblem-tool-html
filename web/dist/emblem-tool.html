// --------------------------------------------------------------------------
// 小工具
// --------------------------------------------------------------------------

function clamp8(v        )         {
  return v < 0 ? 0 : v > 255 ? 255 : Math.round(v);
}

function assertImage(rgba           )       {
  if (!Number.isInteger(rgba.width) || !Number.isInteger(rgba.height)
    || rgba.width <= 0 || rgba.height <= 0) {
    throw new Error(`image: 尺寸非法（${rgba.width}×${rgba.height}）`);
  }
  if (rgba.data.length !== rgba.width * rgba.height * 4) {
    throw new Error(
      `image: 缓冲长度 ${rgba.data.length} 与尺寸 ${rgba.width}×${rgba.height} 不符（应为 ${rgba.width * rgba.height * 4}）`,
    );
  }
}

/** 三个通道 + alpha 全等才算同一个像素（测试与"补背景计数"用）。 */
function sameRgba(data                   , i        , c      )          {
  const o = i * 4;
  return data[o] === c.r && data[o + 1] === c.g && data[o + 2] === c.b && data[o + 3] === c.a;
}

/**
 * 统计"逐通道等于背景色"的像素数 —— `backgroundPixels` 的**唯一**实现（0.19 抽出）。
 *
 * ★ 口径就是"**输出**里有几个像素长得与背景色一模一样"，不是"补了几个背景"：
 *   · 与背景同色的源像素被原样搬进输出后同样会被数进来（分不开，除非按分支另算）；
 *   · `'stretch'` 两支**都不补背景**（源图铺满目标），但同一口径照样成立
 *     ⇒ 直接对输出逐像素数即可，不需要"哪条分支"的特例。
 *   （0.19 曾把这里写成"与字段文档（补了多少背景）不符"，实际是**字段文档**说错了，
 *     0.20 已把两处文档改成这个口径 —— 别再把计数按分支改用别的定义。）
 */
function countBgPixels(data                   , w        , h        , bg      )         {
  let n = 0;
  for (let i = 0; i < w * h; i++) if (sameRgba(data, i, bg)) n += 1;
  return n;
}

/**
 * 不透明像素（alpha === 255）用到几种不同 RGB。
 *
 * 口径与 `tools/prepare_image.py::count_opaque_colors()` **完全一致**：
 * 只有 `alpha === 0xFF` 才计入，半透明像素**既不算实色也不算背景**（它属于
 * 二值化该处理掉的东西）。这是"treat 257 色"判据的统一口径，别自己发明第二套。
 */
       function distinctOpaqueColors(rgba           )         {
  assertImage(rgba);
  const d = rgba.data;
  const seen = new Set        ();
  for (let i = 0; i < rgba.width * rgba.height; i++) {
    const o = i * 4;
    if (d[o + 3] !== 0xff) continue;
    // 打包成 24 位整数：Set<number> 比 Set<string> 省得多（16k 像素逐点调用）
    seen.add((d[o] << 16) | (d[o + 1] << 8) | d[o + 2]);
  }
  return seen.size;
}

/** 半透明像素数（0 < alpha < 255）。合规判据之一是它必须为 0。 */
       function semiTransparentCount(rgba           )         {
  assertImage(rgba);
  const d = rgba.data;
  let n = 0;
  for (let i = 0; i < rgba.width * rgba.height; i++) {
    const a = d[i * 4 + 3];
    if (a > 0 && a < 255) n += 1;
  }
  return n;
}

/** 完全不透明像素数（alpha === 255）。 */
       function opaqueCount(rgba           )         {
  assertImage(rgba);
  const d = rgba.data;
  let n = 0;
  for (let i = 0; i < rgba.width * rgba.height; i++) if (d[i * 4 + 3] === 0xff) n += 1;
  return n;
}

/** 完全不透明像素的个数、色数与半透明个数 —— 一次遍历，UI 状态栏用。 */
       function imageStats(rgba           )   
                 
                       
                            
                          
                       
  {
  assertImage(rgba);
  const d = rgba.data;
  const seen = new Set        ();
  let opaque = 0;
  let semi = 0;
  const n = rgba.width * rgba.height;
  for (let i = 0; i < n; i++) {
    const o = i * 4;
    const a = d[o + 3];
    if (a === 0xff) {
      opaque += 1;
      seen.add((d[o] << 16) | (d[o + 1] << 8) | d[o + 2]);
    } else if (a > 0) {
      semi += 1;
    }
  }
  return {
    pixels: n,
    opaquePixels: opaque,
    transparentPixels: n - opaque - semi,
    semiTransparent: semi,
    opaqueColors: seen.size,
  };
}

/** 是否所有像素的 alpha 都只有 0 / 255（"已经二值化过了"）。 */
       function isAlphaBinary(rgba           )          {
  assertImage(rgba);
  const d = rgba.data;
  for (let i = 0; i < rgba.width * rgba.height; i++) {
    const a = d[i * 4 + 3];
    if (a !== 0 && a !== 0xff) return false;
  }
  return true;
}

/** 拷贝一个 RGBA 缓冲（所有变换函数的输出都是新缓冲，绝不改入参）。 */
// --------------------------------------------------------------------------
// ② alpha 二值化
// --------------------------------------------------------------------------

/**
 * alpha 二值化：半透明 → 全透明 / 全不透明。
 *
 * 语义与两处参考实现严格一致：
 *   · 上游 `wxImage::ConvertAlphaToMask()`：`alpha >= 128` 变不透明，`< 128` 变全透明
 *     （03-图片处理管线.md §二 ①）；
 *   · `prepare_image.py`：`a.point(lambda v: 255 if v >= alpha_threshold else 0)`。
 * ⇒ 判据是 **`alpha >= threshold` 即不透明**（不是 `>`）。threshold=128 时
 *   128 算不透明 —— 这条别改，改了会和 Python 参考实现的计数对不上。
 *
 * ★ 变透明的像素**同时把 RGB 清成 0**（= prepare_image.py 第 ④ 步的口径：
 *   "透明像素统一成 (0,0,0,0)"）。为什么宁可丢 RGB：
 *   游戏只看索引 0，透明处底下的颜色永远不会显示；留着一个不一致的 RGB 会让
 *   "逐像素等价"这种断言变得没法写（同图两处透明像素 RGB 不同就算不等）。
 *
 * 返回**新缓冲**，不改入参（纯函数）。
 */
       function binarizeAlpha(
  rgba           ,
  threshold = DEFAULT_ALPHA_THRESHOLD,
  opts                  = {},
)                    {
  assertImage(rgba);
  const { width, height } = rgba;
  const src = rgba.data;
  const out = new Uint8ClampedArray(width * height * 4);
  const n = width * height;

  for (let i = 0; i < n; i++) {
    const o = i * 4;
    if (src[o + 3] >= threshold) {
      out[o] = src[o];
      out[o + 1] = src[o + 1];
      out[o + 2] = src[o + 2];
      out[o + 3] = 0xff;
    }
    // else 保持全 0（透明 + RGB 清零）
  }

  if (opts.despeckle) {
    return despeckleOpaque(out, width, height, opts.minNeighbors ?? 3);
  }
  return out;
}

/**
 * 去"半透明杂边"（形态学：先腐蚀后膨胀，只在这里用 3×3 结构元）。
 *
 * 判据：不透明像素的 3×3 邻域里（含自身）不透明邻居数 < `minNeighbors` ⇒ 改成透明。
 *   · 效果：删掉孤立点、单个像素宽的毛刺、以及二值化后整片只剩几个点的碎边；
 *   · 为什么用"邻域计数"而不是"面积过滤"：徽章是 128×128 的小图 + 硬边，
 *     3×3 邻域就是"这个点有没有同伴"的直观定义，且**开销恒定 O(n)**；
 *   · ⚠ 它**会吃掉 1 像素宽的细线**（发丝线、细边框）—— 所以默认关闭、由 UI 勾选。
 *
 * ★ 不是幂等操作：删掉一层后又会出现新的"孤立点"，重复调用会继续啃。
 *   实现里**读写分离**（判定全部基于入参副本），所以"跑一次"的结果是确定的，
 *   不会因为遍历顺序不同而不同。
 */
function despeckleOpaque(
  data                   ,
  width        ,
  height        ,
  minNeighbors        ,
)                    {
  const src = new Uint8ClampedArray(data); // 判定只看向量化的输入快照 ⇒ 顺序无关
  const out = new Uint8ClampedArray(data);
  for (let y = 0; y < height; y++) {
    for (let x = 0; x < width; x++) {
      const i = y * width + x;
      if (src[i * 4 + 3] !== 0xff) continue;
      let cnt = 0;
      for (let dy = -1; dy <= 1; dy++) {
        const yy = y + dy;
        if (yy < 0 || yy >= height) continue;
        for (let dx = -1; dx <= 1; dx++) {
          const xx = x + dx;
          if (xx < 0 || xx >= width) continue;
          if (src[(yy * width + xx) * 4 + 3] === 0xff) cnt += 1;
        }
      }
      if (cnt < minNeighbors) {
        const o = i * 4;
        out[o] = 0;
        out[o + 1] = 0;
        out[o + 2] = 0;
        out[o + 3] = 0;
      }
    }
  }
  return out;
}

// --------------------------------------------------------------------------
// ③ 取景 + 缩放
// --------------------------------------------------------------------------

/**
 * `'auto'` 缩放核的判据（★ SPEC.md §五 ③ "色数少/尺寸小（像素风）→ 最近邻"）。
 *
 * 三条规则，**顺序即优先级**（第一条命中就不再往下看）：
 *
 * ```
 * 1) 尺寸相同（scale == 1）        → 'nearest'（逐像素直接复制，不做任何采样）
 * 2) 正在缩小（scale < 1）         → 'smooth'
 *                                    ★ 例外：**整数倍缩小**（scale 的倒数是整数，
 *                                      例如 0.5 = 1/2、1/3、1/4）时用 'nearest'
 * 3) 放大或等比（scale >= 1）      → 色数 ≤ 256 ? 'nearest' : 'smooth'
 * ```
 *
 * ★★ **判据必须落在"实际缩放倍率"上，而不是"源尺寸 vs 目标尺寸"上。**
 *   这是本函数最要紧的一点，也是第一版写错、后来被测试逼着改掉的地方。
 *   两者在等比取景下的分歧点长这样（都实测过）：
 *
 *   | 源 → 128×128     | contain 倍率           | 第一版（比"尺寸是否整除"） | 现在（比实际倍率） |
 *   |---|---|---|---|
 *   | 128×256          | min(1, 0.5) = **0.5**  | nearest（凑巧对）  | nearest ✓ |
 *   | 100×256          | min(1.28, 0.5) = **0.5** | **smooth ✗**    | nearest ✓ |
 *   | 256×260          | min(0.5, 0.49) = 0.49  | smooth            | smooth ✓ |
 *
 *   原理：`contain` / `cover` 是**等比**取景，倍率由**限制边**决定，两轴**共用**
 *   同一个 scale；被缩的只有限制边那一轴，另一轴可能就是 1:1（**根本不采样**，
 *   谈不上"丢行丢列"）。所以正确的是"按两轴各自的 scale 判"：
 *   · 100×256 → 128×128：横向是 **1.28× 放大**（不丢列）、纵向是 2× 整数倍缩小
 *     ⇒ 两轴都保真 ⇒ `nearest`（第一版因为 100 % 128 ≠ 0 误判成 smooth）；
 *   · 300×300 → 128×128：两轴都是 0.4267 倍 ⇒ 非整数倍 ⇒ `smooth`；
 *   · `stretch` 是两轴独立倍率，直接分别代入。
 *
 *   所以唯一真值来源是 `fitToTarget` 算出来的 `scaleX` / `scaleY`：
 *   `fitToTarget`（`kernel` 为 `'auto'` 时）与 `prepareEmblem` 都直接调它，
 *   不存在"另一个只看源/目标尺寸的便利版"（那个 `chooseKernel()` 0.20 已删 —— 没有生产调用点，
 *   且它只适用于等比取景，容易被误用去模拟 `cover` / `stretch`）。
 *
 * 为什么是这个顺序（每一条都是踩出来的）：
 *
 * ① **尺寸相同必须走"复制"而不是"重采样"。**
 *    128×128 的图再"缩放到 128×128"在数学上是恒等映射，但走采样器就要经过
 *    浮点反算 + 取整，一旦边界上有 1e-15 的误差就会丢一列/丢一行（本文件的
 *    `nearestFit` 注释里记着这个坑）。这条规则把它变成"不可能出错"，
 *    也是判据 (b)（无损）的第一层保障。
 *
 * ② **缩小时默认平滑，只有"整数倍"才允许最近邻。**
 *    · 非整数倍缩放（300→128、502→128）用最近邻 = **不均匀抽样**：某些源行/列
 *      被整条跳过、另一些被取两次 ⇒ 像素画的线条粗细一段一段地变、边缘齿忽粗忽细。
 *      实测：300→128 的最近邻会**整行漏掉 172/300 个源行**（测试里有这条断言）。
 *    · 整数倍（256→128 = 1/2、384→128 = 1/3）用最近邻**能完美保真**：被抽到的
 *      源像素等距出现、网格对齐 ⇒ 像素画一点不糊、也不丢结构。
 *    · 判定用"倒数是不是整数"（`1/scale` 与它的四舍五入值在 1e-9 内相等），
 *      这样对浮点算出来的 scale 稳健（`1/0.5` 精确是 2，`1/(128/300)` 是 2.34…）。
 *
 * ③ **放大或等比时才看色数**（原来的判据，保留）：
 *    · 放大时最近邻**不会**抽样抖动（每个源像素被完整放大成方块），像素风图
 *      放大就该用最近邻保住硬边；
 *    · 照片 / 渐变图色数必然 > 256，放大也要平滑；
 *    · 阈值取 **256** 而不是 255：与"能不能塞进调色板"同量级，同时把
 *      "灰度渐变 200 色"这种像素风图正确归到 nearest；
 *    · 口径与 `distinctOpaqueColors()` 一致（只数 `alpha === 0xFF`）。
 *
 * ★ 与"手动开关"的关系：本函数**只在** `kernel: 'auto'`（默认值）时被调用。
 *   调用方显式传 `'nearest'` / `'smooth'` 时永远不会走到这里 —— 手动指定的
 *   优先级**永远高于** `'auto'`（SPEC.md §五 ③）。
 *
 * ★ 已知边界（记录在案，不是 bug）：
 *   · 一张 1024×1024 的 40 色像素画缩到 128×128 是 **1/8 整数倍** ⇒ 走 `'nearest'`，
 *     完美保真（这正是规则 ② 想要的效果）；
 *   · 但 1000×1000 的同一张图（1/7.8125，**非**整数倍）会走 `'smooth'` ⇒ 硬边被糊
 *     一点。想保硬的用户手动切 `'nearest'` 即可（代价是接受抽样丢点）——
 *     这正是手动开关存在的意义。
 */
       function selectScaleKernel(
  scaleX        ,
  scaleY        ,
  colorCount        ,
  colorLimit = 256,
)              {
  // ★ 0.45：`colorLimit` 就是"不透明色数 ≤ 它 ⇒ 最近邻"这条判据的**唯一**真值（SPEC.md §五 ③）。
  //   它曾经还能从 `FitOptions.autoNearestColorLimit` 传进来，但**没有任何调用方传过**
  //   （UI 的 `toPrepareOptions()` 里根本没有这个字段）⇒ 那个选项已删，改这条判据只改这里的默认值。
  const same = Math.abs(scaleX - 1) < 1e-9 && Math.abs(scaleY - 1) < 1e-9;
  if (same) return 'nearest'; // ① 尺寸相同 ⇒ 复制
  const shrinking = scaleX < 1 - 1e-9 || scaleY < 1 - 1e-9;
  if (shrinking) {
    // ② 缩小：两轴都必须"倒数恰好是整数"才准用最近邻
    const integerX = isIntegerReciprocal(scaleX);
    const integerY = isIntegerReciprocal(scaleY);
    return integerX && integerY ? 'nearest' : 'smooth';
  }
  // ③ 放大或等比 ⇒ 看色数
  return colorCount <= colorLimit ? 'nearest' : 'smooth';
}

/** `1 / scale` 是否（在 1e-9 内）是正整数。scale ≥ 1（放大/等比）时返回 true。 */
function isIntegerReciprocal(scale        )          {
  if (!(scale > 0)) return false;
  if (scale >= 1 - 1e-9) return true; // 不缩小 ⇒ 这一轴"保真"
  const inv = 1 / scale;
  const r = Math.round(inv);
  return r >= 1 && Math.abs(inv - r) < 1e-9;
}

/*
 * ★ 0.20 删除：`chooseKernel(rgba, targetW, targetH, colorLimit)` ——
 *   "只给源尺寸 + 目标尺寸、按 `contain` 倍率判核"的便利版。
 *   删它的理由：**生产路径一个调用点都没有**（`fitToTarget` 直接调 `selectScaleKernel`），
 *   而它只适用于**等比**取景 —— 拿它去模拟 `cover`（倍率是 `max`）或 `stretch`
 *   （两轴独立）都会判错核，留着就是等人踩。测试里对它的引用已改调
 *   `selectScaleKernel(min(w/源宽, h/源高), 同一值, 色数)`（等价式，见 `image.test.ts`）。
 *   （它曾经是"只看源/目标尺寸是否整除"的错误版本：`100×256 → 128×128` 会被误判成
 *     `smooth`，正确结果是 `nearest` —— 因为横向其实是 1.28× 放大。）
 */

/**
 * 目标像素的**支撑区**（footprint）覆盖了源图的哪几个像素。
 *
 * 支撑区 = `[c - half, c + half]`（源像素单位，`c` = 目标像素中心映回源坐标）；
 * 与它有**正面积**交集的源像素 = `floor(c - half) … ceil(c + half) - 1`。
 *
 * ⚠ 下限必须是 `floor(a)`，**不能**是 `ceil(a)`：`ceil` 会把"被**部分**覆盖的那个像素"
 *   整块丢掉，而放大时（支撑区 ≤ 1 个源像素）那个像素就是唯一的一个 ⇒ 支撑区算成空
 *   ⇒ 整片走"补背景"。上界用 `ceil(b) - 1` 是为了排掉零面积擦边（`b` 正好落在整数上）。
 *
 * 返回 `s1 < s0` 表示支撑区**完全**落在源图之外（`contain` 的补背景区 / 手动拖出界）。
 */
function supportRange(c        , half        , n        )                             {
  const s0 = Math.max(0, Math.floor(c - half));
  const s1 = Math.min(n - 1, Math.ceil(c + half) - 1);
  return { s0, s1 };
}

/**
 * 面积平均（box / area-average）缩放 —— 本实现的 `'smooth'` 核。
 *
 * 为什么选它，而不是 Catmull-Rom / bicubic 这类"锐"的重采样核：
 *   ① **下采样不会混叠**：每个目标像素对源图的**支撑区**（footprint）内所有像素
 *      按覆盖面积加权平均，这正是"面积平均"的定义 ⇒ 没有摩尔纹/齿纹。
 *      bicubic 在缩小 >2× 时若不做预滤波反而会振铃、产生源图里没有的颜色；
 *   ② **不产生越界色**：权重非负、和为 1 ⇒ 输出色永远落在支撑区颜色的凸包内，
 *      不会出现 bicubic 的过冲（负 lobe）导致的新颜色 —— 减色前的色数不会虚增；
 *   ③ **放大时可退化**：放大时支撑区 ≤ 1 个源像素，结果就是最近邻/双线性的
 *      特例（覆盖面积权重），边缘不会被"无中生有"地锐化；
 *   ④ 实现简短、纯整数权重可复算 ⇒ 确定性好写。
 * ⚠ 代价：放大时**不如** bicubic 锐（会略微平一点）。徽章的目标尺寸是 128×128，
 *   实际场景绝大多数是"下采样"（照片/大图），所以这个代价换 ①② 是划算的。
 *
 * 数学：`scale = 目标长 / 源长`（fitToTarget 已经保证 > 0）。
 *   目标像素中心 `tx+0.5` 反算回源坐标 `sx = (tx + 0.5 - offsetX) / scale`，
 *   该像素的支撑区 = `sx ± 0.5/scale`（半宽 = 半个源像素在目标域的宽度）。
 *   权重 = 源像素与支撑区的重叠长度。
 */
function smoothFit(
  src                   ,
  srcW        ,
  srcH        ,
  dstW        ,
  dstH        ,
  scale        ,
  offsetX        ,
  offsetY        ,
  bg      ,
)                                                        {
  const out = new Uint8ClampedArray(dstW * dstH * 4);
  const inv = 1 / scale; // 支撑区**宽度**（源像素单位）；半宽 = 0.5 * inv
  const halfW = 0.5 * inv;

  // X 方向权重表：所有行共用（源图是行优先的，这样能少算一半）
  const xStart = new Int32Array(dstW);
  const xEnd = new Int32Array(dstW);
  const xWeights                 = new Array(dstW);
  for (let tx = 0; tx < dstW; tx++) {
    const center = (tx + 0.5 - offsetX) * inv;
    const { s0, s1 } = supportRange(center, halfW, srcW);
    const w = new Float64Array(Math.max(0, s1 - s0 + 1));
    for (let s = s0; s <= s1; s++) {
      let ww = Math.min(center + halfW, s + 1) - Math.max(center - halfW, s);
      if (!(ww > 0)) ww = 0;
      w[s - s0] = ww;
    }
    xStart[tx] = s0;
    xEnd[tx] = s1;
    xWeights[tx] = w;
  }

  for (let ty = 0; ty < dstH; ty++) {
    const centerY = (ty + 0.5 - offsetY) * inv;
    const { s0, s1 } = supportRange(centerY, halfW, srcH);
    if (s1 < s0) {
      // 目标像素完全落在源图外 ⇒ 整行背景
      for (let tx = 0; tx < dstW; tx++) {
        const o = (ty * dstW + tx) * 4;
        out[o] = bg.r;
        out[o + 1] = bg.g;
        out[o + 2] = bg.b;
        out[o + 3] = bg.a;
      }
      continue;
    }
    for (let tx = 0; tx < dstW; tx++) {
      const o = (ty * dstW + tx) * 4;
      const xa = xStart[tx];
      const xb = xEnd[tx];
      if (xb < xa) {
        out[o] = bg.r;
        out[o + 1] = bg.g;
        out[o + 2] = bg.b;
        out[o + 3] = bg.a;
        continue;
      }
      const xw = xWeights[tx];
      let r = 0;
      let g = 0;
      let b = 0;
      let a = 0;
      let wsum = 0;
      for (let sy = s0; sy <= s1; sy++) {
        const wy = Math.min(centerY + halfW, sy + 1) - Math.max(centerY - halfW, sy);
        if (!(wy > 0)) continue;
        const row = sy * srcW;
        for (let sx = xa; sx <= xb; sx++) {
          const wx = xw[sx - xa];
          if (!(wx > 0)) continue;
          const w = wx * wy;
          const so = (row + sx) * 4;
          r += src[so] * w;
          g += src[so + 1] * w;
          b += src[so + 2] * w;
          a += src[so + 3] * w;
          wsum += w;
        }
      }
      if (wsum > 0) {
        out[o] = clamp8(r / wsum);
        out[o + 1] = clamp8(g / wsum);
        out[o + 2] = clamp8(b / wsum);
        out[o + 3] = clamp8(a / wsum);
      } else {
        // 理论到不了这里（支撑区至少覆盖 1 个源像素）；兜底补背景而不是留黑
        out[o] = bg.r;
        out[o + 1] = bg.g;
        out[o + 2] = bg.b;
        out[o + 3] = bg.a;
      }
    }
  }
  let bgCount = 0;
  for (let i = 0; i < dstW * dstH; i++) if (sameRgba(out, i, bg)) bgCount += 1;
  return { data: out, backgroundPixels: bgCount };
}

/**
 * 最近邻 + 背景填充：直接按变换逐目标像素取样（越界补背景）。
 * 像素风图专用 —— 它保证输出里出现的颜色**全部来自源图**（不发明中间色）。
 *
 * ★ 取样规则是"目标像素中心落在源图哪个像素的方块内"，写出来就是
 *   `s = round(源坐标中心 - 0.5)`（四舍五入），**不是** `floor(源坐标中心)`。
 *   为什么强调：两者在数学上等价，但浮点误差会咬人 ——
 *   3×3 放大到 128×128 时，源像素 0 的中心的浮点结果可能算成
 *   `0.49999999999999645`，`floor` 会把它变成 **-1**（越界 ⇒ 内容最左一列
 *   凭空少一像素），四舍五入则稳稳落在 0。夹具里就有 3×3 / 1×1 这两种
 *   "刚好卡在边界"的图，这条是它们逼出来的。
 *
 * ⚠ "两者数学等价"有个**前提**，别当成恒等式：等价只在"源坐标中心不是恰好
 *   `k + 0.5`"时成立。中心恰好是半整数时（4×4 → 8×8 就会遇到），`floor(中心)` 与
 *   `round(中心 - 0.5)` 取到**不同**的源像素（前者向下取整、后者按"半值向上"）。
 *   本模块统一取**后者**（`mapTargetToSource` 的自述、`nearestFit`、`nearestStretch`
 *   三处必须是同一条公式；`nearestStretch` 的注释里记着这次统一）。
 */
function nearestFit(
  src                   ,
  srcW        ,
  srcH        ,
  dstW        ,
  dstH        ,
  scale        ,
  offsetX        ,
  offsetY        ,
  bg      ,
)                                                        {
  const out = new Uint8ClampedArray(dstW * dstH * 4);
  const inv = 1 / scale;
  let bgCount = 0;
  for (let ty = 0; ty < dstH; ty++) {
    const cy = (ty + 0.5 - offsetY) * inv;
    const sy = Math.round(cy - 0.5);
    for (let tx = 0; tx < dstW; tx++) {
      const o = (ty * dstW + tx) * 4;
      if (sy < 0 || sy >= srcH) {
        out[o] = bg.r; out[o + 1] = bg.g; out[o + 2] = bg.b; out[o + 3] = bg.a;
        bgCount += 1;
        continue;
      }
      const cx = (tx + 0.5 - offsetX) * inv;
      const sx = Math.round(cx - 0.5);
      if (sx < 0 || sx >= srcW) {
        out[o] = bg.r; out[o + 1] = bg.g; out[o + 2] = bg.b; out[o + 3] = bg.a;
        bgCount += 1;
        continue;
      }
      const so = (sy * srcW + sx) * 4;
      out[o] = src[so];
      out[o + 1] = src[so + 1];
      out[o + 2] = src[so + 2];
      out[o + 3] = src[so + 3];
      if (sameRgba(out, ty * dstW + tx, bg)) bgCount += 1;
    }
  }
  return { data: out, backgroundPixels: bgCount };
}

/**
 * 取景 + 缩放：把任意尺寸的 RGBA 图放到目标尺寸的画布上。
 *
 * | 模式 | 缩放 | 位置 | 越界 |
 * |---|---|---|---|
 * | `contain` | 等比缩到**放得下**（`scale = min`） | 居中 | 四周补背景 |
 * | `cover` | 等比缩到**铺满**（`scale = max`） | 居中 | 裁掉，无背景 |
 * | `stretch` | 非等比拉满（x/y 各自缩放） | 铺满 | 无 |
 * | `manual` | 调用方给 `scale` | 调用方给 `offsetX/offsetY` | 补背景 |
 *
 * ★ 与上游 GUI 的关键差异（03-图片处理管线.md §二 ② "上游这里有个坑"）：
 *   上游 `if (宽>128 || 高>128) Rescale(128,128)` —— **只缩大图**，小图直接越界读。
 *   本实现**一律** 缩放/取景到目标尺寸，`contain` 下小图会被**放大**（补满可用区域）。
 *
 * ★ `contain` 的"补背景"是**逐像素等于背景色**的（不是"alpha=0"就算）：
 *   固定输出 4 个通道，测试才能断言"四角 == 背景"。
 *
 * 返回新缓冲。`transform` 给出源→目标的仿射变换，测试的"块平均色对比"
 * （判据 e）靠它把输出块映射回源图对应区域。
 */
       function fitToTarget(src           , opts             = {})            {
  assertImage(src);
  const dstW = opts.targetWidth ?? TARGET_SIZE;
  const dstH = opts.targetHeight ?? dstW;
  if (!Number.isInteger(dstW) || !Number.isInteger(dstH) || dstW <= 0 || dstH <= 0) {
    throw new Error(`fitToTarget: 目标尺寸非法（${dstW}×${dstH}）`);
  }
  const mode          = opts.mode ?? 'contain';
  const bg       = opts.background ?? { r: 0, g: 0, b: 0, a: 0 };

  const sw = src.width;
  const sh = src.height;
  let scaleX        ;
  let scaleY        ;
  let offsetX = 0;
  let offsetY = 0;

  switch (mode) {
    case 'contain': {
      const s = Math.min(dstW / sw, dstH / sh);
      scaleX = s;
      scaleY = s;
      offsetX = (dstW - sw * s) / 2;
      offsetY = (dstH - sh * s) / 2;
      break;
    }
    case 'cover': {
      const s = Math.max(dstW / sw, dstH / sh);
      scaleX = s;
      scaleY = s;
      offsetX = (dstW - sw * s) / 2;
      offsetY = (dstH - sh * s) / 2;
      break;
    }
    case 'stretch': {
      scaleX = dstW / sw;
      scaleY = dstH / sh;
      break;
    }
    case 'manual': {
      const s = opts.scale ?? 1;
      if (!(s > 0)) throw new Error(`fitToTarget: manual 的 scale 必须 > 0（收到 ${s}）`);
      scaleX = s;
      scaleY = s;
      offsetX = opts.offsetX ?? 0;
      offsetY = opts.offsetY ?? 0;
      break;
    }
    default:
      throw new Error(`fitToTarget: 未知取景模式 '${String(mode)}'`);
  }

  // ⚠ stretch 是唯一允许 x/y 不同比例的模式。nearest 与 smooth 都按单一 scale 取样，
  //   所以这里用几何平均给它们一个"共同倍率"，而精确的像素映射走下面的
  //   perAxisScale 分支 —— 否则 stretch 会被算歪。
  const uniform = mode === 'stretch' ? Math.sqrt(scaleX * scaleY) : scaleX;

  // ★ `'auto'` 的判据必须用**算出来的真实倍率**（scaleX / scaleY），不能用"源尺寸
  //   是否被目标整除"—— 两者在等比取景下会给出不同答案（理由见 selectScaleKernel）。
  //   手动的 'nearest' / 'smooth' 在这里直接胜出，优先级永远高于 'auto'。
  const kernelChoice = opts.kernel ?? 'auto';
  const kernel              = kernelChoice === 'auto'
    ? selectScaleKernel(scaleX, scaleY, distinctOpaqueColors(src))
    : kernelChoice;

  let data                   ;
  let backgroundPixels        ;
  // ★★ 0.19（D20）：短路条件必须**真的是恒等映射**。原来只判 `sw === dstW && sh === dstH`，
  //   注释声称"尺寸相同 ⇒ scale = 1、没有越界，所以各种取景模式在这里都等价" ——
  //   对 `manual` 是**错的**（scale/offset 由调用方给）：128×128 的源图配 scale=4/offset=-192
  //   会原样返回输入、`backgroundPixels = 0`，而返回的 `transform` 却写着 scale:4
  //   ⇒ 像素与 `mapTargetToSource()` 的自述互相矛盾（拖了白框却什么都没发生）。
  //   现在只有"两轴倍率都是 1 且没有偏移"才走复制（`contain`/`cover`/`stretch` 在尺寸相同时
  //   天然满足；`manual` 必须自己满足）。
  const identity =
    sw === dstW && sh === dstH &&
    Math.abs(scaleX - 1) < 1e-9 && Math.abs(scaleY - 1) < 1e-9 &&
    Math.abs(offsetX) < 1e-9 && Math.abs(offsetY) < 1e-9;
  if (identity) {
    data = new Uint8ClampedArray(src.data);
    backgroundPixels = countBgPixels(data, dstW, dstH, bg);
  } else if (mode === 'stretch' && kernel === 'smooth') {
    data = smoothStretch(src.data, sw, sh, dstW, dstH, bg);
    // ★ `'stretch'` **整支都不补背景**（源图铺满目标，没有越界像素）⇒ 这里的值只是
    //   "输出里有多少像素与背景色逐通道相同"，与"补了几个背景"无关（口径见
    //   `FitResult.backgroundPixels` / `countBgPixels`）。0.19 的 D23 把这条口径统一到了
    //   所有分支上（原先这里写死 0，反而与另两条分支不一致）。
    backgroundPixels = countBgPixels(data, dstW, dstH, bg);
  } else if (mode === 'stretch') {
    data = nearestStretch(src.data, sw, sh, dstW, dstH);
    // ★ 同上：`nearestStretch` 也不补背景（函数注释里明确写了），这里的计数只是"像背景色的输出像素数"。
    backgroundPixels = countBgPixels(data, dstW, dstH, bg);
  } else if (kernel === 'smooth') {
    const r = smoothFit(src.data, sw, sh, dstW, dstH, uniform, offsetX, offsetY, bg);
    data = r.data;
    backgroundPixels = r.backgroundPixels;
  } else {
    const r = nearestFit(src.data, sw, sh, dstW, dstH, uniform, offsetX, offsetY, bg);
    data = r.data;
    backgroundPixels = r.backgroundPixels;
  }

  return {
    data,
    width: dstW,
    height: dstH,
    kernel,
    mode,
    transform: { scale: uniform, offsetX, offsetY },
    backgroundPixels,
  };
}

/** 非等比面积平均（stretch 专用）：x/y 各自独立算支撑区。 */
function smoothStretch(
  src                   ,
  srcW        ,
  srcH        ,
  dstW        ,
  dstH        ,
  bg      ,
)                    {
  const out = new Uint8ClampedArray(dstW * dstH * 4);
  const sxScale = dstW / srcW;
  const syScale = dstH / srcH;
  const halfX = 0.5 / sxScale;
  const halfY = 0.5 / syScale;
  for (let ty = 0; ty < dstH; ty++) {
    const cy = (ty + 0.5) / syScale;
    const { s0: ys0, s1: ys1 } = supportRange(cy, halfY, srcH);
    for (let tx = 0; tx < dstW; tx++) {
      const o = (ty * dstW + tx) * 4;
      const cx = (tx + 0.5) / sxScale;
      const { s0: xs0, s1: xs1 } = supportRange(cx, halfX, srcW);
      if (ys1 < ys0 || xs1 < xs0) {
        out[o] = bg.r; out[o + 1] = bg.g; out[o + 2] = bg.b; out[o + 3] = bg.a;
        continue;
      }
      // ★ X 方向权重与 `sy` 无关（`wy` 也一样与 `sx` 无关）⇒ 两者都提到内层之外预计算。
      //   数值上与原写法**逐位相同**（同样的两个 min/max、同样的相减顺序、同样的跳过判据）。
      const nwx = xs1 - xs0 + 1;
      const wx = new Float64Array(nwx);
      for (let k = 0; k < nwx; k++) {
        const sx = xs0 + k;
        const v = Math.min(cx + halfX, sx + 1) - Math.max(cx - halfX, sx);
        wx[k] = v > 0 ? v : 0; // 非正权重 ⇒ 0（与原来的 `continue` 等价：0 权重不贡献）
      }
      let r = 0; let g = 0; let b = 0; let a = 0; let wsum = 0;
      for (let sy = ys0; sy <= ys1; sy++) {
        const wyv = Math.min(cy + halfY, sy + 1) - Math.max(cy - halfY, sy);
        if (!(wyv > 0)) continue;
        for (let k = 0; k < nwx; k++) {
          const w = wx[k] * wyv;
          if (!(w > 0)) continue;
          const so = (sy * srcW + xs0 + k) * 4;
          r += src[so] * w; g += src[so + 1] * w; b += src[so + 2] * w; a += src[so + 3] * w;
          wsum += w;
        }
      }
      if (wsum > 0) {
        out[o] = clamp8(r / wsum); out[o + 1] = clamp8(g / wsum);
        out[o + 2] = clamp8(b / wsum); out[o + 3] = clamp8(a / wsum);
      } else {
        out[o] = bg.r; out[o + 1] = bg.g; out[o + 2] = bg.b; out[o + 3] = bg.a;
      }
    }
  }
  return out;
}

/**
 * 非等比最近邻（stretch 专用）：**源图铺满目标、不补背景**（因此也不需要 `bg` 参数）。
 *
 * ★ 取样式与 `nearestFit` / `mapTargetToSource` **必须是同一条**：
 *     源坐标中心 = (t + 0.5) * s / d，取 `round(中心 - 0.5)` 再夹到 `[0, s - 1]`。
 *   为什么不能写 `min(s-1, floor((t+0.5)*s/d))`（0.20 之前的写法）：两者在"中心恰好落在
 *   源像素边界上"时会取到**不同**的源像素（4×4 → 8×8：`floor` 给 0,0,1,1,2,2,3,3，
 *   而 `mapTargetToSource` 自述的 `round` 给 0,0,0,1,1,2,2,3）⇒ 同一张图走 `stretch`
 *   与走 `fitToTarget`+`mapTargetToSource` 反查会得到互相矛盾的像素。
 *   上游 Python（`prepare_image.py` / `make_image_fixtures.py`）**没有** stretch 这条
 *   路径（Pillow 只在 `宽>128||高>128` 时 `Resize(128,128)` 等比），所以没有"以 Python
 *   为准"的对拍可依 —— 那就以本模块**自己的**最近邻口径（`mapTargetToSource` 的注释）
 *   为准，测试里另有一份**独立写的**参考实现对拍（`image.test.ts` 的 stretch 用例）。
 */
function nearestStretch(
  src                   ,
  srcW        ,
  srcH        ,
  dstW        ,
  dstH        ,
)                    {
  const out = new Uint8ClampedArray(dstW * dstH * 4);
  // 每个目标像素中心的源坐标（行/列各算一次，别在双层循环里重复算）
  const sxOf = new Int32Array(dstW);
  for (let tx = 0; tx < dstW; tx++) {
    sxOf[tx] = clampIndex(Math.round(((tx + 0.5) * srcW) / dstW - 0.5), srcW);
  }
  const syOf = new Int32Array(dstH);
  for (let ty = 0; ty < dstH; ty++) {
    syOf[ty] = clampIndex(Math.round(((ty + 0.5) * srcH) / dstH - 0.5), srcH);
  }
  for (let ty = 0; ty < dstH; ty++) {
    const sy = syOf[ty];
    for (let tx = 0; tx < dstW; tx++) {
      const sx = sxOf[tx];
      const so = (sy * srcW + sx) * 4;
      const o = (ty * dstW + tx) * 4;
      out[o] = src[so]; out[o + 1] = src[so + 1];
      out[o + 2] = src[so + 2]; out[o + 3] = src[so + 3];
    }
  }
  return out;
}

/** 最近邻取样的下标夹取：`[0, n - 1]`（浮点误差可能让中心落到 -0.0 或 n 上）。 */
function clampIndex(i        , n        )         {
  if (i < 0) return 0;
  if (i > n - 1) return n - 1;
  return i;
}

/**
 * 输出像素 → 源图坐标的映射（判据 e 用它把"输出块"映射回"源图区域"）。
 *
 * `fitToTarget` 返回的 `transform` 是"源 → 目标"；本函数求逆：
 *     源坐标 = (目标坐标 + 0.5 - offset) / scale - 0.5
 * 减 0.5 是因为我们返回的是**像素中心**（整数表示像素中心），不是像素边界。
 * 对 `nearest` 而言 `Math.round(结果)` 就是被采样的源像素下标
 * （与 `nearestFit` 里的 `Math.round(cx - 0.5)` 完全一致 —— 别写成 `floor`，
 *   浮点误差会在 3×3 放大这种"刚好卡边界"的情况下多丢一列，理由见 nearestFit）。
 */
       function mapTargetToSource(
  transform                                                     ,
  tx        ,
  ty        ,
)                             {
  const inv = 1 / transform.scale;
  return {
    sx: (tx + 0.5 - transform.offsetX) * inv - 0.5,
    sy: (ty + 0.5 - transform.offsetY) * inv - 0.5,
  };
}

// --------------------------------------------------------------------------
// ⑤ 减色（中位切分 / median cut）
// --------------------------------------------------------------------------

                                                           

/**
 * 只对**不透明像素**做中位切分减色（median cut）。
 *
 * 这是文档 §六 表格里那条判据性规则的实现：
 *   > 中位切分，**只对不透明像素**，透明像素不占槽位
 *   （`prepare_image.py` 为了实现这一点，先把透明像素的 RGB 换成"第一个不透明像素的颜色"
 *     再量化 —— 那是 Pillow 的 API 限制导致的绕路；本实现直接只拿不透明像素建桶，
 *     不需要那个 hack，结果等价且更直白。）
 *
 * 算法（经典 median cut，与 Pillow 的 MEDIANCUT 同族，但**不追求逐像素一致**）：
 *   1. 统计每种不透明 RGB 的出现次数；
 *   2. 放进一个桶，重复直到桶数 == maxColors：
 *      a. 选**颜色数最多**的桶切（不是"像素最多"）—— 目标是把颜色空间切细，
 *         而不是把大色块切细；
 *      b. 沿该桶**范围最大**的通道（R/G/B）排序，在**中位**处切成两半
 *         （按颜色种类数的中位，不是像素数的中位）；
 *      c. 两边都非空才切；若所有桶都切不动（颜色数 ≤ maxColors）就提前结束；
 *   3. 每个桶的代表色 = 桶内各颜色**按像素数加权平均**（round）。
 *
 * ★ 无损保证（判据 b）：若源图不透明色数 ≤ maxColors，第 2 步一个桶都不切
 *   ⇒ 每个桶只有一种颜色 ⇒ 加权平均 == 那个颜色本身 ⇒ 输出逐像素等于输入，
 *   `exact = true`。这是**算法结构**保证的，不靠"事后检查"。
 *
 * ★ 索引 0 约定：`palette[0..3] = 00 00 00 00`，实色从索引 1 开始（`palette` 里
 *   用掉几格 = `buckets.length`，这个数不单独返回 —— 需要它的人看 `report.colorsAfter`）。
 *   实色的 alpha 写 `0x80`（游戏惯例，见 PALETTE_ALPHA_OPAQUE）；反正提取时
 *   "索引 ≠ 0 即不透明"（03-图片处理管线.md §四 ①）。
 *
 * 确定性：桶内排序键是整数（R<<16|G<<8|B），`Array.prototype.sort` 对整数比较
 * 的结果确定；桶的选择规则用"第一个最大者"，不依赖 Map/Set 的迭代顺序
 * （总桶数 ≤ 255，遍历开销可忽略）。
 */
       function quantizeOpaque(rgba           , maxColors = MAX_OPAQUE_COLORS)                 {
  assertImage(rgba);
  if (!Number.isInteger(maxColors) || maxColors < 1 || maxColors > 255) {
    throw new Error(`quantizeOpaque: maxColors 必须在 1..255（收到 ${maxColors}）—— 索引 0 固定留给透明`);
  }
  const { width, height } = rgba;
  const d = rgba.data;
  const n = width * height;

  // ① 统计不透明颜色
  const countMap = new Map                ();
  for (let i = 0; i < n; i++) {
    const o = i * 4;
    if (d[o + 3] !== 0xff) continue;
    const key = (d[o] << 16) | (d[o + 1] << 8) | d[o + 2];
    countMap.set(key, (countMap.get(key) ?? 0) + 1);
  }
  const sourceColors = countMap.size;

  const palette = new Uint8Array(256 * 4);
  const indices = new Uint8Array(n);
  // palette[0] 恒为 00 00 00 00 ⇒ 索引 0 = 透明/背景（游戏口径）

  if (sourceColors === 0) {
    // 全透明图：这是"合法但没意义"的输入（prepare_image.py 会直接 SystemExit）。
    // 本实现不抛异常，交给 checkCompliance() 报"没有不透明像素"，
    // 因为 UI 需要能显示"当前是空白画布"而不是崩掉。
    return { palette, indices, exact: true, sourceColors: 0 };
  }

  const keys = new Uint32Array(sourceColors);
  const counts = new Uint32Array(sourceColors);
  {
    let k = 0;
    for (const [key, cnt] of countMap) {
      keys[k] = key;
      counts[k] = cnt;
      k += 1;
    }
  }

  // ② 建桶（每桶是一段"颜色 + 权重"）
  const buckets           = [{ colors: keys, counts }];
  const target = Math.min(maxColors, sourceColors);
  while (buckets.length < target) {
    // a. 选颜色数最多的桶
    let bi = -1;
    let best = 1; // 只有 1 种颜色的桶切不动
    for (let i = 0; i < buckets.length; i++) {
      if (buckets[i].colors.length > best) {
        best = buckets[i].colors.length;
        bi = i;
      }
    }
    if (bi < 0) break; // 所有桶都只有 1 色 ⇒ 已经无损，提前停

    const b = buckets[bi];
    // b. 找范围最大的通道
    let rmin = 255; let rmax = 0; let gmin = 255; let gmax = 0; let bmin = 255; let bmax = 0;
    for (let i = 0; i < b.colors.length; i++) {
      const c = b.colors[i];
      const r = (c >>> 16) & 0xff;
      const g = (c >>> 8) & 0xff;
      const bl = c & 0xff;
      if (r < rmin) rmin = r;
      if (r > rmax) rmax = r;
      if (g < gmin) gmin = g;
      if (g > gmax) gmax = g;
      if (bl < bmin) bmin = bl;
      if (bl > bmax) bmax = bl;
    }
    const rr = rmax - rmin;
    const gr = gmax - gmin;
    const br = bmax - bmin;
    // 排序键：主键 = 通道值；次键 = 打包值（保证同通道值的颜色顺序确定）
    const shift = rr >= gr && rr >= br ? 16 : gr >= br ? 8 : 0;
    const order = new Uint32Array(b.colors.length);
    for (let i = 0; i < order.length; i++) order[i] = i;
    const sorted = Array.from(order).sort((x, y) => {
      const cx = (b.colors[x] >>> shift) & 0xff;
      const cy = (b.colors[y] >>> shift) & 0xff;
      if (cx !== cy) return cx - cy;
      return b.colors[x] - b.colors[y];
    });

    const cut = sorted.length >> 1;
    if (cut <= 0 || cut >= sorted.length) break; // 理论到不了（长度 ≥ 2）
    const mk = (part          )         => {
      const ck = new Uint32Array(part.length);
      const cc = new Uint32Array(part.length);
      for (let i = 0; i < part.length; i++) {
        ck[i] = b.colors[part[i]];
        cc[i] = b.counts[part[i]];
      }
      return { colors: ck, counts: cc };
    };
    const left = mk(sorted.slice(0, cut));
    const right = mk(sorted.slice(cut));
    buckets[bi] = left;
    buckets.push(right);
  }

  // ③ 桶代表色 + 颜色 → 槽位
  const slotOf = new Map                ();
  for (let i = 0; i < buckets.length; i++) {
    const bk = buckets[i];
    let sr = 0; let sg = 0; let sb = 0; let wsum = 0;
    for (let j = 0; j < bk.colors.length; j++) {
      const c = bk.colors[j];
      const w = bk.counts[j];
      sr += ((c >>> 16) & 0xff) * w;
      sg += ((c >>> 8) & 0xff) * w;
      sb += (c & 0xff) * w;
      wsum += w;
      slotOf.set(c, i + 1); // 索引 0 留给透明
    }
    const slot = i + 1;
    const off = slot * 4;
    palette[off] = wsum > 0 ? clamp8(sr / wsum) : 0;
    palette[off + 1] = wsum > 0 ? clamp8(sg / wsum) : 0;
    palette[off + 2] = wsum > 0 ? clamp8(sb / wsum) : 0;
    palette[off + 3] = PALETTE_ALPHA_OPAQUE;
  }

  // ④ 写索引
  for (let i = 0; i < n; i++) {
    const o = i * 4;
    if (d[o + 3] !== 0xff) continue; // 透明（含半透明）一律索引 0
    const key = (d[o] << 16) | (d[o + 1] << 8) | d[o + 2];
    indices[i] = slotOf.get(key)          ;
  }

  return {
    palette,
    indices,
    exact: buckets.length === sourceColors,
    sourceColors,
  };
}

// --------------------------------------------------------------------------
// ⑦ 合规检查
// --------------------------------------------------------------------------

/**
 * 合规检查（SPEC.md §五 ⑦ / 文档 §九 第 6 步）：
 *   · 尺寸必须是 `targetWidth × targetHeight`（默认 128×128）；
 *   · 不透明色数 ≤ 255；
 *   · 半透明像素 == 0；
 *   · ★ 附加一条本工具的**索引口径**断言（传了 `indices` 才查）：
 *     索引 0 只能出现在透明像素上，实色像素不许拿到索引 0
 *     —— 后者会在游戏里变成"透明洞"（03-图片处理管线.md §八 症状表）。
 *
 * 返回 `issues[]` 而不是抛异常：UI 要把这些原因**显示给人看**并拒绝写入
 * （SPEC.md §八 3 "不合规就拒绝写入"）。
 */
       function checkCompliance(
  rgba           ,
  opts                                                                                            = {},
)                   {
  assertImage(rgba);
  const tw = opts.targetWidth ?? TARGET_SIZE;
  const th = opts.targetHeight ?? tw;
  const maxColors = opts.maxColors ?? MAX_OPAQUE_COLORS;
  const issues           = [];

  const st = imageStats(rgba);
  if (rgba.width !== tw || rgba.height !== th) {
    issues.push(`尺寸 ${rgba.width}×${rgba.height} ≠ ${tw}×${th}`);
  }
  if (st.opaqueColors > maxColors) {
    issues.push(`不透明色数 ${st.opaqueColors} > ${maxColors}（第 ${maxColors + 1} 项起会把索引截断成 0 ⇒ 游戏里出现透明洞）`);
  }
  if (st.semiTransparent > 0) {
    issues.push(`半透明像素 ${st.semiTransparent} 个（存档里 alpha 只有 0x00/0x80 两种值，半透明会被整体当成透明）`);
  }
  if (st.opaquePixels === 0) {
    issues.push('没有任何不透明像素（全透明徽章能写但没意义）');
  }

  const indices = opts.indices;
  if (indices) {
    if (indices.length !== st.pixels) {
      issues.push(`indices 长度 ${indices.length} ≠ 像素数 ${st.pixels}`);
    } else {
      let idx0OnOpaque = 0;
      let opaqueNonZero = 0;
      for (let i = 0; i < st.pixels; i++) {
        const isOpaque = rgba.data[i * 4 + 3] === 0xff;
        if (indices[i] === 0) {
          if (isOpaque) idx0OnOpaque += 1;
        } else if (isOpaque) {
          opaqueNonZero += 1;
        }
      }
      if (idx0OnOpaque > 0) {
        issues.push(`索引 0 出现在 ${idx0OnOpaque} 个不透明像素上（索引 0 = 背景/透明，实色必须是 1..255）`);
      }
      if (opaqueNonZero !== st.opaquePixels) {
        issues.push(`有 ${st.opaquePixels - opaqueNonZero} 个不透明像素的索引是 0`);
      }
    }
  }

  return {
    ok: issues.length === 0,
    issues,
    width: rgba.width,
    height: rgba.height,
    opaqueColors: st.opaqueColors,
    semiTransparent: st.semiTransparent,
    opaquePixels: st.opaquePixels,
    transparentPixels: st.transparentPixels,
  };
}

// --------------------------------------------------------------------------
// 一站式入口
// --------------------------------------------------------------------------

/**
 * ★ 一站式入口：任意 RGBA 图 → 游戏能用的徽章图（+ 调色板 + 索引 + 报告）。
 *
 * 流程严格照文档 §九 的推荐顺序，并在每一步留下**可复算的数字**（report）：
 *
 *     ① binarizeAlpha（阈值 128）           → report.binarizeChanged / semiTransparentBefore
 *     ② fitToTarget（contain/cover/stretch/manual + auto 核）
 *     ③ binarizeAlpha 再来一次             → report.reBinarizeChanged
 *        （★ 缩放会插值出新的半透明像素；`prepare_image.py` 第 ② 步之后也重做了一遍）
 *     ④ quantizeOpaque（只碰不透明像素）    → palette / indices / report.colorsBefore/After
 *     ⑤ checkCompliance                     → report.compliance
 *
 * ★ 返回的 `rgba` 是**游戏口径**：透明像素 `(0,0,0,0)`，其余 `alpha = 255`。
 *   这正好是 `emblem.ts::encodeEmblem(rgba, { isLr, headerTail })` 的入参
 *   （`injectImage` 只把 `alpha === 0xFF` 当实色 ⇒ 两边口径天然对齐）。
 *
 * ★ 无损性（判据 b）：源图若"已是目标尺寸 + 不透明色数 ≤ maxColors + 无半透明像素"，
 *   则 ①②③ 都是恒等变换、④ 走 `exact` 路径 ⇒ 输出与输入逐像素等价。
 *   任何会破坏它的选项（`despeckle` / `kernel` 强制 smooth / 缩放）都会在 report 里
 *   留下痕迹（`lossless` / `despeckleRemoved` / `backgroundPixels`）。
 */
       function prepareEmblem(
  src           ,
  options                 = {},
)                {
  assertImage(src);
  const { width, height } = src;
  const threshold = options.alphaThreshold ?? DEFAULT_ALPHA_THRESHOLD;
  const maxColors = options.maxColors ?? MAX_OPAQUE_COLORS;
  const srcStats = imageStats(src);

  // ① 先二值化：与上游/参考实现一致（"若有 alpha → ConvertAlphaToMask"），
  //    这样送到缩放的是硬边图，最近邻路径也不会把半透明原样抄过去。
  // ★ 0.19（D21）：拆成"二值化"与"去杂边"两步，好让 `despeckleRemoved` 数**真的是去杂边删掉的**。
  //   原先它是 `(非全透明像素数) - (去杂后不透明像素数)`，把"被阈值判成透明"的半透明像素
  //   也算进了去杂边的账上（实测：整幅 alpha=100、开去杂边 ⇒ 报删了 16384 个，而这张图
  //   一个不透明像素都没有，去杂边什么都没删）。
  const binarizedOnly = binarizeAlpha(src, threshold);
  const binarized = options.despeckle === true
    ? despeckleOpaque(binarizedOnly, width, height, options.despeckleMinNeighbors ?? 3)
    : binarizedOnly;
  let binarizeChanged = 0;
  {
    const d = src.data;
    for (let i = 0; i < width * height; i++) {
      if (d[i * 4 + 3] !== binarized[i * 4 + 3]) binarizeChanged += 1;
    }
  }
  // 去杂边删掉了多少 = "二值化后是不透明、去杂边之后变成全透明"的那些像素（逐像素比）。
  let despeckleRemoved = 0;
  if (options.despeckle === true) {
    for (let i = 0; i < width * height; i++) {
      if (binarizedOnly[i * 4 + 3] === 0xff && binarized[i * 4 + 3] === 0) despeckleRemoved += 1;
    }
  }

  // ②③ 取景 + 缩放。
  //   ★ `'auto'` 时**先探一次**取景（只为拿到"实际倍率"与 `'auto'` 选出的核），然后直接复用
  //     探针的结果。为什么值得多跑一次：`'auto'` 的判据必须落在**实际缩放倍率**上
  //     （见 `selectScaleKernel` 的说明），而倍率只有 `fitToTarget` 知道（`contain` 的倍率由
  //     限制边决定，不是"源/目标"）。探针返回的 `transform.scale` 就是权威值
  //     ⇒ 判核与取景**不可能不一致**。代价 = 多一遍采样（128×128 的输出，微秒级）。
  //   ★ 0.20 简化：**显式给了 `kernel`** 时不再跑那个"探针" —— 探针存在的唯一理由就是问
  //     `'auto'` 会选哪个核，而 `fitToTarget` 本来就会原样返回调用方给的 `kernel`
  //     ⇒ 原先那两遍采样（第一遍的结果被丢掉）是纯粹的浪费，输出逐字节不变。
  // ⚠ auto 核的色数口径：用**二值化之后**的图算，因为"不透明色数"的定义依赖
  //   alpha === 0xFF，半透明像素不算数。
  const fitKernelChoice = options.kernel ?? 'auto';
  const fit = fitToTarget({ data: binarized, width, height }, options); // kernel 默认 'auto'
  const kernel              = fitKernelChoice === 'auto' ? fit.kernel : fitKernelChoice;

  // ④ 缩放后**再**二值化一次。
  //   这一步是必需的：缩放会混出新的半透明像素，而"索引 0 = 透明"要求 alpha 只有 0 / 0xFF。
  //   ★ 0.45：它曾经能用 `PrepareOptions.reBinarizeAfterFit` 关掉，但**没有任何调用方**传过它
  //   （UI 不产这个字段，测试也不传）⇒ 那个开关已删，这里恒做一次。
  const preFinal                    = binarizeAlpha({ data: fit.data, width: fit.width, height: fit.height }, threshold);
  let reBinarizeChanged = 0;
  for (let i = 0; i < fit.width * fit.height; i++) {
    if (fit.data[i * 4 + 3] !== preFinal[i * 4 + 3]) reBinarizeChanged += 1;
  }

  // ⑤ 减色
  const q = quantizeOpaque({ data: preFinal, width: fit.width, height: fit.height }, maxColors);

  // ⑥ 从 palette + indices 反推出**最终 RGBA**（游戏口径）。
  //    为什么要反推而不是直接用 preFinal：
  //      · preFinal 的颜色是量化的输入，量化后颜色可能被替换（有损时）；
  //      · 反推保证 `rgba` 与 `indices`/`palette` **永远自洽**
  //        （判据 f 要拿 rgba 去 encodeEmblem 再读回来逐像素比）。
  const n = fit.width * fit.height;
  const rgba = new Uint8ClampedArray(n * 4);
  const seenColors = new Set        ();
  for (let i = 0; i < n; i++) {
    const slot = q.indices[i];
    const o = i * 4;
    if (slot === 0) continue; // 透明：留 0
    const p = slot * 4;
    const r = q.palette[p];
    const g = q.palette[p + 1];
    const b = q.palette[p + 2];
    rgba[o] = r; rgba[o + 1] = g; rgba[o + 2] = b; rgba[o + 3] = 0xff;
    seenColors.add((r << 16) | (g << 8) | b);
  }

  const compliance = checkCompliance(
    { data: rgba, width: fit.width, height: fit.height },
    { targetWidth: options.targetWidth ?? TARGET_SIZE, targetHeight: options.targetHeight ?? (options.targetWidth ?? TARGET_SIZE), maxColors, indices: q.indices },
  );

      // ★ 0.42：写权限**还没问过** —— 由点击〔写入选中槽〕/〔删除槽〕的那一刻去问
      //   （理由见 `logic/writePermission.ts` 文件头：过了手势再问必抛 SecurityError）
      writePerm: null,
    };
    resetThumbs();
    toast(
      'ok',
      handle
        ? t('已打开记忆卡（保存时可直接覆盖原文件）', 'Memory card opened (saving can overwrite the original file)', 'メモリーカードを開きました（保存時は元のファイルにそのまま上書きできます）', '메모리 카드를 열었습니다(저장 시 원본 파일에 그대로 덮어쓸 수 있습니다)')
        : t('已打开记忆卡（只读：保存时只能下载）', 'Memory card opened (read-only: saving offers download only)', 'メモリーカードを開きました（読み取り専用：保存はダウンロードのみ）', '메모리 카드를 열었습니다(읽기 전용: 저장은 다운로드만 가능)'),
      t(
        `${name} · ${humanBytes(bytes.length)} · ${card.npages} 页 · 簇 ${card.clusters}`,
        `${name} · ${humanBytes(bytes.length)} · ${card.npages} pages · ${card.clusters} clusters`, `${name} · ${humanBytes(bytes.length)} · ${card.npages} ページ · クラスタ ${card.clusters}`, `${name} · ${humanBytes(bytes.length)} · ${card.npages} 페이지 · 클러스터 ${card.clusters}`,
      ),
    );
    return { ok: true };
  } catch (e) {
    state.card = null;
    const msg = e instanceof Error ? e.message : String(e);
    toast('error', t('这个文件不是 PS2 记忆卡', 'This file is not a PS2 memory card', 'このファイルは PS2 のメモリーカードではありません', '이 파일은 PS2 메모리 카드가 아닙니다'), msg);
    return { ok: false, error: msg };
  }
}

/**
 * 卡上**所有**徽章目录名（`E##` / `EMB`，**不过滤作品**）。
 *
 * 唯一调用者 `planWriteTarget()` 拿它区分"卡上真没有这个目录"与"有、但不属于当前作品"。
 * ★ 0.27（用户删了顶栏那段整卡目录清单）：原先叫 `scanCard()`，还返回 count / chain /
 *   isLrArchive / rootNames；删掉显示之后只剩名字有人用 ⇒ 收成 `string[]`（顺带去掉
 *   "对每个目录跟一遍 FAT 链"的开销）。
 *   ⚠ 别把那句被删的 UI 文案写进注释：注释会进产物，分节 (o) 拿"产物里不该有它"当判据。
 */
       function cardEmblemDirNames()           {
  const lc = state.card;
  if (!lc) return [];
  const out           = [];
  for (const e of lc.card.listRoot()) {
    if (e.isDot || !e.isDir || !e.isEmblemDir) continue;
    out.push(e.name);
  }
  return out;
}

/**
 * 重建槽位模型：把卡上**属于当前作品**的徽章目录解析出来，再交给 `buildGameSlotModel()`。
 *
 * ★★ 2026-10-04 用户实测修正：**8 个槽 = 当前所选作品的 8 个槽**。
 *   第一版把卡上**所有**徽章目录（LR 的 `*EMB` + 每个 `E##`）混成同一个网格，
 *   理由是"槽位布局是整张卡的属性"。结论是**错的**：切作品时槽内容一模一样，
 *   用户看到的现象就是"我换左上的作品，下面的 8 个槽不会跟着变"。
 *   ⇒ 现在按**盘序列号**过滤（`logic/slots.ts::filterDirsForGame`，区域前缀不参与比较）。
 *   被过滤掉的目录会记在 `model.excludedDirNames` 里，界面**必须**显示出来。
 *
 * `ctx` 为 null（作品还没解析出来 / 用户手填的序列号非法）时**不过滤**，
 * 保守地把整卡目录都算作"本作品" —— 宁可多显示，也不要因为一个输入框还没填完
 * 就让整张卡看起来是空的。
 */
       function reloadModel(ctx                     = null)                   {
  const lc = state.card;
  if (!lc) {
    state.model = null;
    return null;
  }
  const card = lc.card;
  const dirEntries                = [];
  for (const e of card.listRoot()) {
    if (e.isDot || !e.isDir || !e.isEmblemDir) continue;
    const entries = card.listDir(e.name).map((d) => ({
      name: d.name,
      length: d.length,
      cluster: d.cluster,
      isDir: d.isDir,
    }));
    dirEntries.push({ name: e.name, entries });
  }
  const model = buildGameSlotModel(dirEntries, { serial: ctx ? ctx.serial : null });
  state.model = model;
  return model;
}

/**
 * 卡上**同作品**的真实徽章块（去掉容器头之后的裸块）。
 *
 * 用途：非 LR 的 9 字节「作品常量」必须从同作品的真实存档里读（`emblem.ts` 的
 * `headerTailFromSave` 语义），**不许猜**。
 */
       function sameGameBlocks(ctx             )                                                          {
  const lc = state.card;
  if (!lc || !state.model) return [];
  const card = lc.card;
  const wantSerial = ctx.serial.toUpperCase();
  const out                                                          = [];
  for (const dirName of state.model.dirNames) {
    const serial = serialFromDirName(dirName);
    if (!serial || serial.toUpperCase() !== wantSerial) continue;
    const isEmb = dirName.toUpperCase().endsWith('EMB');
    if (isEmb !== (ctx.entry.form === 'lr-archive')) continue;
    for (const e of card.listDir(dirName)) {
      if (e.isDot || e.isDir) continue;
      if (e.length !== SAVE_SIZE && e.length !== LR_SAVE_SIZE) continue;
      try {
        const bytes = new Uint8Array(card.readFile(e.cluster, e.length));
        const kind = saveKind(bytes);
        if (kind !== 'emblem-raw' && kind !== 'emblem-lr') continue;
        out.push({ dir: dirName, file: e.name, block: bytes });
      } catch {
        /* 读不出来的跳过（不猜） */
      }
    }
  }
  return out;
}

// --------------------------------------------------------------------------
// 读取徽章块
// --------------------------------------------------------------------------

                             
              
                       
                 
                 
 

/**
 * 判一块字节是不是**游戏口径**的徽章块。
 * ★ 顺序不能换：`saveKind` → `findOffset` → `verifyChecksums`（PORT-NOTES.md §二 6）。
 */
function checkBlock(bytes            )             {
  const kind = saveKind(bytes);
  const isLr = kind === 'emblem-lr';
  if (kind !== 'emblem-raw' && kind !== 'emblem-lr') {
    return {
      ok: false,
      checksumsOk: false,
      detail: t(`saveKind=${kind}（不是徽章块）`, `saveKind=${kind} (not an emblem block)`, `saveKind=${kind}（エンブレムのブロックではありません）`, `saveKind=${kind}(엠블럼 블록이 아닙니다)`),
      offset: -1,
    };
  }
  let offset = 0;
  try {
    offset = findOffset(bytes);
  } catch (e) {
    return {
      ok: false,
      checksumsOk: false,
      detail: e instanceof Error ? e.message : String(e),
      offset: -1,
    };
  }
  const block = bytes.subarray(offset, offset + (isLr ? LR_SAVE_SIZE : SAVE_SIZE));
  const v = verifyChecksums(block);
  const detail = v.ok
    ? '18/18'
    : v.badSegments
        .slice(0, 3)
        .map((s) => `${s.name}@${hex(s.offset, 4)}`)
        .join(' ')
        .concat(v.badSegments.length > 3 ? t(` …共 ${v.badSegments.length} 段`, ` …${v.badSegments.length} segments in total`, ` …全 ${v.badSegments.length} セグメント`, ` …총 ${v.badSegments.length}개 세그먼트`) : '');
  return { ok: v.ok, checksumsOk: v.ok, detail, offset };
}

/** 一个槽的缩略图（游戏口径 index0）。 */
function buildThumb(cluster        , length        )                   {
  const lc = state.card;
  if (!lc) return null;
  let raw            ;
  try {
    raw = new Uint8Array(lc.card.readFile(cluster, length));
  } catch {
    return null;
  }
  const chk = checkBlock(raw);
  let rgba            ;
  try {
    // ★ 'index0' = 游戏里看到的样子（SPEC.md §五 ★ 实机口径）
    rgba = extractImage(chk.offset > 0 ? raw.subarray(chk.offset) : raw, 'index0');
  } catch (e) {
    return {
      data: new Uint8ClampedArray(128 * 128 * 4),
      width: 128,
      height: 128,
      checksumsOk18: false,
      checksumDetail: t(
        `提取失败：${e instanceof Error ? e.message : String(e)}`,
        `extract failed: ${e instanceof Error ? e.message : String(e)}`, `抽出に失敗しました：${e instanceof Error ? e.message : String(e)}`, `추출 실패: ${e instanceof Error ? e.message : String(e)}`,
      ),
    };
  }
  return {
    data: new Uint8ClampedArray(rgba),
    width: 128,
    height: 128,
    checksumsOk18: chk.ok,
    checksumDetail: chk.detail,
  };
}

/** 重读全部槽的缩略图。 */
       function reloadThumbs()       {
  resetThumbs();
  const model = state.model;
  if (!model) return;
  for (const s of model.slots) {
    if (!s.occupied) continue;
    try {
      state.thumbs[s.index] = buildThumb(s.cluster, s.length);
    } catch {
      state.thumbs[s.index] = null;
    }
  }
}

// --------------------------------------------------------------------------
// 删除槽里已有的徽章
// --------------------------------------------------------------------------

                               
              
                  
 

/**
 * 把一个文件 dirent 变成"空槽"，并释放它的簇链。
 *
 * 依据（`card.ts` 的注释与真卡实测）：
 *   · 空槽 = **整页 `0xFF`**，且备用区是**算好的 ECC**（`writePageRaw` 会一并重算）；
 *   · 释放簇 = 把每个簇的 FAT 项写回 `0x7FFFFFFF`（= `FAT_FREE` 的值）；
 *   · 若删掉的是**目录里序号最大的项**，把目录项数改成"剩下的最大项号 + 1"
 *     （项数记在**根目录里那个 dirent** 的 length 上）。
 *
 * ⚠ 这是**没有 Python 参考实现**的一段（和"目录满时新建槽"一样），所以既有测试覆盖不到它；
 *   写完仍会走 `verifyWrite()` 的 ECC 自检 —— 而它按定义是"没有坏页"，所以**不能**当作正确性证明。
 *   这一点在回报的"需要人工复核"里明说了。
 */
       function deleteSlotFile(dirName        , fileName        )               {
  const lc = state.card;
  if (!lc) return { ok: false, message: t('还没有打开记忆卡', 'No memory card loaded yet', 'まだメモリーカードを開いていません', '아직 메모리 카드를 열지 않았습니다') };
  const card = lc.card;
  const dirEnt = card.findInRoot(dirName);
  if (!dirEnt) return { ok: false, message: t(`卡上没有目录 ${dirName}`, `The card has no folder ${dirName}`, `カードにフォルダ ${dirName} がありません`, `카드에 폴더 ${dirName}이(가) 없습니다`) };
  const dirCount = dirEnt.length > 0 ? dirEnt.length : card.dirCount(dirEnt.cluster);
  const entries = card.dirents(dirEnt.cluster, Math.max(dirCount, 1));
  const target = entries.find((e) => !e.isDot && e.name === fileName);
  if (!target) return { ok: false, message: t(`${dirName} 里没有 ${fileName}`, `No ${fileName} in ${dirName}`, `${fileName} が ${dirName} にありません`, `${fileName}이(가) ${dirName}에 없습니다`) };

  const chain = target.cluster > 0 ? card.chain(target.cluster, 4096) : [];

  // ★ 0.19（D9）：**先做越界检查、再动 FAT**。原先顺序反了：一旦槽号越界就 `return {ok:false}`，
  //   可 FAT 已经被释放过了 ⇒ 调用方看到"失败"，内存里的卡却已经被改了一半。
  const dirChain = card.chain(dirEnt.cluster, 4096);
  const ci = Math.floor(target.index / card.ppc);
  const k = target.index % card.ppc;
  if (ci >= dirChain.length) {
    return { ok: false, message: t(`槽 ${target.index} 超出目录链`, `Slot ${target.index} is outside the folder chain`, `スロット ${target.index} がフォルダチェーンの範囲外です`, `슬롯 ${target.index}이(가) 폴더 체인 범위를 벗어났습니다`) };
  }

  for (const cl of chain) card.writeFat(cl, FAT_FREE >>> 0);

  // 把 dirent 清成空槽（整页 FF + 正确 ECC）
  const page = card.dataPage(dirChain[ci], k);
  card.writePageRaw(page, card.emptyDirent());

  let countNote = '';
  const maxOther = entries.reduce((a, e) => (e.index !== target.index && e.index > a ? e.index : a), 0);
  if (target.index + 1 === dirCount && dirCount > maxOther + 1) {
    const newCount = maxOther + 1;
    card.setDirentLength(card.rootdir, dirEnt.index, newCount);
    countNote = t(`，项数 ${dirCount} → ${newCount}`, `, entry count ${dirCount} -> ${newCount}`, `、項目数 ${dirCount} → ${newCount}`, `, 항목 수 ${dirCount} → ${newCount}`);
  }
  return {
    ok: true,
    message: t(
      `已删除 ${dirName}\\${fileName}：释放簇 ${chain.length ? chain.join(',') : '（无）'}${countNote}`,
      `Deleted ${dirName}\\${fileName}: released clusters ${chain.length ? chain.join(',') : '(none)'}${countNote}`, `${dirName}\\${fileName} を削除しました：解放したクラスタ ${chain.length ? chain.join(',') : '（なし）'}${countNote}`, `${dirName}\\${fileName}을(를) 삭제했습니다: 해제한 클러스터 ${chain.length ? chain.join(',') : '(없음)'}${countNote}`,
    ),
  };
}

// 写入
// --------------------------------------------------------------------------

                            

/** ★ 0.25：读一次句柄所指文件的当前状态（读不到就返回 null —— **不因为读不到就拦写入**）。 */
async function readStamp(handle                      )                                                  {
  try {
    const f = await handle.getFile();
    return { mtime: f.lastModified, size: f.size };
  } catch {
    return null;
  }
}

/**
 * ★ 0.25：**动手前**先查一次"这张卡在磁盘上是不是被别的进程改过了"（写入与删除共用）。
 *
 * ⚠ 位置很重要：它必须在**任何内存副本的修改之前**调用 —— 不然一旦拒绝，内存副本已经被改过，
 *   模型却还是旧的 ⇒ 再点一次就会撞 `card.ts::createFileInDir()` 的"已经有 dataN，拒绝覆盖"
 *   （用户实测到的第二条错就是这么来的）。放在最前面 ⇒ 拒绝 = **什么都没发生**，重试照样是"新建"。
 *
 * 返回 null = 可以继续；返回字符串 = 拒绝理由（已经是给人看的完整说明）。
 */
async function preflightStale(lc                                )                         {
  if (!lc.handle || !lc.lastSeen) return null; // 只读打开（没句柄）⇒ 只会下载，没什么可拦的
  const now = await readStamp(lc.handle);
  if (!now || !stampChanged(lc.lastSeen, now)) return null;
  const text = staleFileRefusal({ fileName: lc.fileName, seen: lc.lastSeen, now });
  toast('error', t('这张卡在磁盘上又被改过了 ⇒ 拒绝操作', 'The card on disk was changed again - operation refused', 'このカードはディスク上で再び変更されています ⇒ 操作を拒否', '이 카드는 디스크에서 다시 변경되었습니다 ⇒ 작업 거부'), text, 30_000);
  return text;
}

/** 目录里那个"与目录同名"的文件（非 LR 的徽章本体）。 */
function emblemFileInDir(dirName        )                {
  const lc = state.card;
  if (!lc) return null;
  const want = dirName.toUpperCase();
  for (const e of lc.card.listDir(dirName)) {
    if (e.isDot || e.isDir) continue;
    if (e.name.toUpperCase() === want) return e.name;
  }
  return null;
}

/**
 * 算出"这一槽该写到哪里"（**界面层入口**：把卡上的真实信息喂给纯逻辑规划器）。
 *
 * 规划本身在 `logic/planWrite.ts::planWriteTargetIn()`（零 I/O、可测）；
 * 这里只负责补两样"只有真卡才知道"的东西：
 *   · 卡上**全部**徽章目录名（用来区分"卡上真没有"与"卡上有、但不属于本作品"）；
 *   · 非 LR 已有文件的**首簇/长度**（写覆盖要用，纯逻辑层不看字节）。
 *
 * ★ 0.19：删掉了 `opts` 注入点（`model` / `cardDirNames`）—— 3 个调用点一个都不传、
 *   也没有任何测试调这个函数，注释却写着"只为测试留"。
 * ★ 0.21：`slotIndices: number[]` → `slotIndex: number`（〔批量写 8 槽〕已删）。
 */
       function planWriteTarget(ctx             , slotIndex        )            {
  const cardDirNames = cardEmblemDirNames();
  const plan = planWriteTargetIn({
    model: state.model,
    cardDirNames,
    ctx,
    slotIndex,
    emblemFileInDir,
  });
  // 非 LR 的"已有文件"要补回真实簇/长度（模型里只有"占用的槽"，用户填的作品可能不同）
  const tgt = plan.target;
  if (tgt && !tgt.isNew && tgt.cluster === 0) {
    const e = state.card?.card.listDir(tgt.dirName).find((d) => d.name === tgt.fileName);
    if (e) {
      tgt.cluster = e.cluster;
      tgt.length = e.length;
    }
  }
  return plan;
}

function writeBlockToTarget(
  target             ,
  block            ,
)                                         {
  const lc = state.card;
  if (!lc) throw new Error(t('还没有打开记忆卡', 'No memory card loaded yet', 'まだメモリーカードを開いていません', '아직 메모리 카드를 열지 않았습니다'));
  const card = lc.card;
  if (!target.isNew && target.cluster > 0) {
    const chain = card.chain(target.cluster, 4096);
    const pageBytes = card.ppc * 512;
    const need = Math.ceil(block.length / pageBytes);
    if (chain.length < need) {
      throw new Error(
        t(
          `目标文件 ${target.fileName} 的簇链只有 ${chain.length} 簇，装不下 ${block.length} 字节（需要 ${need} 簇）。` +
            '本版本不做"原地扩链"：请先删掉这个槽（删除槽按钮）再重新写。',
          `The cluster chain of ${target.fileName} has only ${chain.length} clusters and cannot hold ${block.length} bytes (${need} clusters needed). ` +
            'This version does not extend a chain in place: delete this slot first (Delete slot), then write again.', `対象ファイル ${target.fileName} のクラスタチェーンは ${chain.length} クラスタしかなく、${block.length} バイト（${need} クラスタ必要）を収められません。このバージョンは「その場でチェーンを延長」しません。先にこのスロットを削除（削除スロット）してから、もう一度書き込んでください。`, `대상 파일 ${target.fileName}의 클러스터 체인은 ${chain.length}개뿐이라 ${block.length}바이트(${need}개 필요)를 담을 수 없습니다. 이 버전은 "제자리 체인 확장"을 하지 않습니다. 먼저 이 슬롯을 삭제(슬롯 삭제)한 뒤 다시 쓰세요.`,
        ),
      );
    }
    // 只写前 need 簇；多余的簇留在链上（保守：宁可有空闲簇，也不要写坏链）
    const touched = card.writeFileIntoClusters(chain.slice(0, need), block);
    card.writeFatChain(chain.slice(0, need));
    // ★ 0.19（D16）：覆盖已有文件时**顺带把 dirent 的 length 对齐**。原先从不更新它 ——
    //   新块比旧文件短时，目录里记的长度会偏大（当前两种布局都是定长 ⇒ 正常路径撞不上，
    //   但它是个"看起来能跑"的隐患）。只有长度确实不同才写，免得平白多改一页。
    if (target.length !== block.length) {
      const de = card.findInRoot(target.dirName);
      if (de) {
        const ent = card.dirents(de.cluster, Math.max(de.length, 1)).find((e) => e.name === target.fileName);
        if (ent) card.setDirentLength(de.cluster, ent.index, block.length);
      }
    }
    return { touched, cluster: chain[0] };
  }
  const r = card.createFileInDir(target.dirName, target.fileName, block);
  return { touched: r.touchedPages, cluster: r.firstCluster };
}

/**
 * 给定**页号**列表，返回其中 ECC 不自洽的页。
 *
 * ★ 0.19（D4）：入参从"簇列表"改成"**页列表**"。原先调用方只传了目标文件的**首簇**
 *   ⇒ 一个 17,440 字节的块要占 18 簇 / 36 页，自检实际只验了 2 页。现在直接把
 *   `createFileInDir`/`writeFileIntoClusters` 报出来的**全部改动页**丢进来。
 */
function badEccPages(pages                   )           {
  const lc = state.card;
  if (!lc) return [];
  const bad           = [];
  for (const p of pages) {
    if (!lc.card.eccOk(p)) bad.push(p);
  }
  return bad;
}

                               
              
                  
                           
     
                                    
                                                 
                                                          
                                                                    
     
                      
     
                                                           
    
                                     
                                                   
                                                                  
                                   
                                                   
                              
    
                                                        
                                    
     
                                   
 

/**
 * ★ 0.43：预检拒绝的一句话标签；★ 0.47 起是**四语**（`refusedNote(zh, en, ja, ko, hintLine?)`）。
 *
 * `hintLine = true` 时才加"见上方提示行"的指针 —— 只有当**正文真的在提示行上**时才配得上
 * 这个指针（`plan.error` / 作品常量 / 还没开卡这几条，`updateWriteHints()` 都会在主位讲），
 * 否则会让人去找一句不存在的话。
 */
function refusedNote(zh        , en        , ja        , ko        , hintLine = true)                         {
  return {
    note: () =>
      hintLine
        ? t(
            `${zh}（见上方提示行）`,
            `${en} (see the hint line above)`,
            `${ja}（上のヒント行を参照）`,
            `${ko} (위 힌트 줄을 참고하세요)`,
          )
        : t(zh, en, ja, ko),
  };
}

/**
 * ★ 0.43：同上，但标签本身要**重算**（`plan.errorShort` 是当前语言的一句话标签，
 * 而 `planWriteTarget()` 是纯函数 ⇒ 重跑一遍就得到新语言的那句）。
 */
function refusedRedo(fn                     , hintLine = true)                         {
  return {
    note: () => {
      const s = fn() ?? t('这一槽写不了', 'this slot cannot be written', 'このスロットには書き込めません', '이 슬롯에는 쓸 수 없습니다');
      return hintLine ? t(`${s}（见上方提示行）`, `${s} (see the hint line above)`, `${s}（上のヒント行を参照）`, `${s}(위의 힌트 줄을 참조)`) : s;
    },
  };
}

/**
 * ★ 写入主流程（**一个槽**）。
 *
 * 顺序（SPEC.md §八，一条都不许换）：
 *   ① 合规复核（调用方给的 `finalCheck`）→ 不合规立刻拒绝；
 *   ② 算新块 `encodeEmblem(rgba, { isLr, headerTail })`（非 LR 的 9 字节从真实存档取，**不猜**）；
 *   ③ 在**同一份内存副本**上写入；
 *   ④ 回读：逐字节 + 18/18 + ECC → `verifyWrite()` 决策，**任一不过拒绝落盘**；
 *   ⑤ 弹确认框（含"请先完全退出 PCSX2"）→ 有句柄就覆盖、否则下载。
 *
 * ★ 0.21：`writeSlots(ctx, slotIndices[], …)` → `writeSlot(ctx, slotIndex, …)` ——〔批量写 8 槽〕
 *   按用户要求删除（"这个没什么实际作用"），于是"逐槽循环"整段消失（本来也只编码一次块）。
 */
       async function writeSlot(
  ctx             ,
  slotIndex        ,
  opts                                                                        ,
)                        {
  const lc = state.card;
  const prepared = state.prepared;
  const lines           = [];
  const fail = (msg        )               => {
    toast('error', t('拒绝写入', 'Write refused', '書き込みを拒否', '쓰기 거부'), msg);
    lines.push('❌ ' + msg);
    return { ok: false, lines, persisted: null };
  };
  /**
   * ★ 0.43：**预检拒绝**（见 `WriteOutcome.refused`）—— 只弹一句标签、不写日志。
   *   `plan.error` 那条路尤其重要：同一件事原来会出现在日志 / toast / 状态行 / 提示行四处
   *   ⇒ 用户原话"这部分提示过于重复了"。现在正文只在提示行讲一遍。
   */
  const reject = (note                        )               => {
    toast('error', t('写入被拒绝', 'Write refused', '書き込みが拒否されました', '쓰기가 거부되었습니다'), note.note());
    return { ok: false, lines, persisted: null, refused: note };
  };

  if (!lc) return reject(refusedNote('还没有打开记忆卡', 'No memory card loaded yet', 'メモリーカードがまだ読み込まれていません', '메모리 카드가 아직 열려 있지 않습니다'));
  if (!state.model) {
    return reject(refusedNote('记忆卡模型还没建起来', 'The memory card model has not been built yet', 'メモリーカードのモデルがまだ構築されていません', '메모리 카드 모델이 아직 만들어지지 않았습니다'));
  }
  if (!prepared) {
    return reject(
      state.prepareError
        ? refusedNote(
            `图像还不合规：${state.prepareError}`,
            `The image is not compliant yet: ${state.prepareError}`, `画像がまだ要件を満たしていません：${state.prepareError}`, `이미지가 아직 규격에 맞지 않습니다: ${state.prepareError}`,
            false,
          )
        : refusedNote('还没有可写入的图像', 'No image ready to write', '書き込める画像がありません', '쓸 수 있는 이미지가 없습니다', false),
    );
  }

  // ①′ ★ 0.25：**动手前**先查"磁盘上的卡是不是被改过了" —— 必须在任何内存改动之前，
  //   这样"拒绝"就等于"什么都没发生"（重试时规划仍然是干净的"新建"，不会撞"已经有 dataN"）。
  const stale = await preflightStale(lc);
  if (stale) return { ok: false, lines: ['❌ ' + stale], persisted: null };

  // ① 合规复核（**再查一次**，不只信之前的 report）
  const rc = opts.finalCheck();
  if (!rc.ok) {
    return fail(
      t(
        `图像不合规，拒绝写入：\n· ${rc.issues.join('\n· ')}`,
        `Image not compliant, write refused:\n- ${rc.issues.join('\n- ')}`, `画像が不適合のため、書き込みを拒否：\n・ ${rc.issues.join('\n・ ')}`, `이미지가 부적합하여 쓰기 거부:\n- ${rc.issues.join('\n- ')}`,
      ),
    );
  }

  // ② 非 LR 的 9 字节作品常量
  //   ★ 0.43：这行是**日志**里"用了哪个常量、从哪来"的证据 ⇒ 先记在变量里，
  //   等**预检全过**了才真写进 `lines`（预检被拒 = 没发生任何事，日志必须保持空的，
  //   否则日志框会在"什么都没做"的时候自己弹出来）。
  let headerTail                    = null;
  let headerTailLine                = null;
  if (!opts.isLr) {
    const same = sameGameBlocks(ctx);
    const res = resolveHeaderTail(ctx.serial, same.map((s) => s.block), KNOWN_HEADER_TAIL);
    // ★ 0.43：预检拒绝（不写日志）—— 那 9 字节的完整理由在提示行上已经有一行常驻警告
    //   （"卡上没有同作品的真实存档…都没有时会拒绝写入"），这里只留"怎么办"。
    if ('error' in res) {
      return reject(
        refusedNote(
          '作品常量没有依据 —— 先在游戏里为这个作品存一个徽章，再回来写',
          'no basis for the game constant - save one emblem in that game first, then come back', '作品定数の根拠がありません —— 先にそのタイトルでエンブレムを1つ保存してから、戻って書き込んでください', '작품 상수의 근거가 없습니다 — 먼저 그 타이틀에서 엠블럼을 하나 저장한 뒤 다시 쓰세요',
          false,
        ),
      );
    }
    headerTail = res.tail;
    headerTailLine = t(
      `作品常量（9 字节）= ${Array.from(headerTail)
        .map((b) => b.toString(16).padStart(2, '0'))
        .join('')}　来源：${res.source === 'card' ? '卡上同作品的真实存档' : '核心层登记表 KNOWN_HEADER_TAIL'}`,
      `game constant (9 bytes) = ${Array.from(headerTail)
        .map((b) => b.toString(16).padStart(2, '0'))
        .join('')}  source: ${
        res.source === 'card' ? 'a real save of the same game on the card' : 'core-layer table KNOWN_HEADER_TAIL'
      }`, `タイトル定数（9 バイト）= ${Array.from(headerTail)
        .map((b) => b.toString(16).padStart(2, '0'))
        .join('')}　出典：${res.source === 'card' ? 'カード上の同タイトルの実セーブデータ' : 'コア層の登録テーブル KNOWN_HEADER_TAIL'}`, `타이틀 상수(9바이트) = ${Array.from(headerTail)
        .map((b) => b.toString(16).padStart(2, '0'))
        .join('')}　출처: ${res.source === 'card' ? '카드에 있는 같은 타이틀의 실제 세이브 데이터' : '코어 계층 등록 테이블 KNOWN_HEADER_TAIL'}`,
    );
  }

  // ③ 计划（★ 0.21：只有一个目标）
  const plan = planWriteTarget(ctx, slotIndex);
  const target = plan.target;
  // ★ 防呆：目标必须落在**当前作品**的目录里。
  //   模型是按作品过滤的，所以这条恒成立；不成立说明"模型与 ctx 不同步"
  //   （例如切了作品却没重建模型）—— 那就**拒绝写盘**，绝不能写到别的作品上。
  const model = state.model;
  if (
    target &&
    model &&
    !model.dirNames.some((d) => d.toUpperCase() === target.dirName.toUpperCase())
  ) {
    return reject(
      refusedNote(
        `内部自检不过：目标目录 ${target.dirName} 不属于当前作品（${ctx.serial}）—— 请重新选一次作品或重新打开卡`,
        `internal check failed: target folder ${target.dirName} does not belong to the current game (${ctx.serial}) - pick the game again or reopen the card`, `内部チェックに失敗：対象フォルダ ${target.dirName} は現在のタイトル（${ctx.serial}）のものではありません —— タイトルを選び直すか、カードを開き直してください`, `내부 점검 실패: 대상 폴더 ${target.dirName} 이(가) 현재 타이틀(${ctx.serial})의 것이 아닙니다 — 타이틀을 다시 선택하거나 카드를 다시 여세요`,
        false,
      ),
    );
  }
  if (plan.error) {
    // ★ 0.43：正文（`plan.error`）由提示行 `#write-hint` 讲**一遍**（它就在写入按钮上方）；
    //   这里只把同一句话的**标签**（`errorShort`）交给状态行 / toast，日志一行都不记。
    //   `refusedRedo` 让标签跟着语言走（重跑一次纯函数即可）。
    return reject(refusedRedo(() => planWriteTarget(ctx, slotIndex).errorShort ?? null));
  }
  if (!target) {
    return reject(refusedNote('没有可写的目标槽', 'there is no target slot to write to', '書き込み先のスロットがありません', '쓸 대상 슬롯이 없습니다', false));
  }

  // ★ 0.43：**预检全过**了 —— 到这里才承认"这次真的要写"，日志从这一行开始有内容。
  if (headerTailLine) lines.push(headerTailLine);
  if (plan.warning) lines.push('⚠ ' + plan.warning);

  // ④ 写进内存副本 + 立刻回读自检
  let block            ;
  try {
    block = encodeEmblem(prepared.rgba, { isLr: opts.isLr, headerTail });
  } catch (e) {
    return fail(
      t(
        `生成徽章块失败：${e instanceof Error ? e.message : String(e)}`,
        `Failed to build the emblem block: ${e instanceof Error ? e.message : String(e)}`, `エンブレムのブロック生成に失敗しました：${e instanceof Error ? e.message : String(e)}`, `엠블럼 블록 생성 실패: ${e instanceof Error ? e.message : String(e)}`,
      ),
    );
  }
  const expectLen = opts.isLr ? LR_SAVE_SIZE : SAVE_SIZE;
  if (block.length !== expectLen) {
    return fail(
      t(
        `生成出来的块长度 ${block.length} ≠ 期望 ${expectLen}（内部错误，拒绝写入）`,
        `The generated block is ${block.length} bytes, expected ${expectLen} (internal error, write refused)`, `生成されたブロックの長さ ${block.length} ≠ 期待値 ${expectLen}（内部エラー、書き込みを拒否）`, `생성된 블록 길이 ${block.length} ≠ 기대값 ${expectLen}(내부 오류, 쓰기 거부)`,
      ),
    );
  }

  let written                                        ;
  try {
    written = writeBlockToTarget(target, block);
  } catch (e) {
    return fail(
      t(
        `写内存副本失败（${target.dirName}\\${target.fileName}）：${e instanceof Error ? e.message : String(e)}`,
        `Failed to write the in-memory copy (${target.dirName}\\${target.fileName}): ${e instanceof Error ? e.message : String(e)}`, `メモリ内コピーへの書き込みに失敗しました（${target.dirName}\\${target.fileName}）：${e instanceof Error ? e.message : String(e)}`, `메모리 내 사본 쓰기 실패(${target.dirName}\\${target.fileName}): ${e instanceof Error ? e.message : String(e)}`,
      ),
    );
  }

  // ---- 回读自检 ----
  const back = lc.card.listDir(target.dirName).find((e) => !e.isDot && e.name === target.fileName);
  if (!back) {
    return fail(
      t(
        `回读失败：${target.dirName} 里找不到刚写的 ${target.fileName}`,
        `Read back failed: the ${target.fileName} just written is not in ${target.dirName}`, `読み戻しに失敗しました：今書き込んだ ${target.fileName} が ${target.dirName} に見つかりません`, `다시 읽기 실패: 방금 쓴 ${target.fileName}을(를) ${target.dirName}에서 찾을 수 없습니다`,
      ),
    );
  }
  const readback = new Uint8Array(lc.card.readFile(back.cluster, back.length));
  const chkBlock = readback.subarray(0, Math.min(readback.length, expectLen));
  const decision = verifyWrite({
    readback,
    expected: block,
    checksums: verifyChecksums(chkBlock),
    // ★ 0.19（D4）：验**全部改动页**（原先只验首簇 ⇒ 18 簇的块只查了 2 页）。
    badEccPages: badEccPages(written.touched),
    compliance: prepared.report.compliance,
  });
  const head = t(
    `${target.dirName}\\${target.fileName}（槽 ${target.slotIndex + 1}${target.isNew ? '，新建' : '，覆盖'}）`,
    `${target.dirName}\\${target.fileName} (slot ${target.slotIndex + 1}${target.isNew ? ', new' : ', overwrite'})`, `${target.dirName}\\${target.fileName}（スロット ${target.slotIndex + 1}${target.isNew ? '、新規' : '、上書き'}）`, `${target.dirName}\\${target.fileName}(슬롯 ${target.slotIndex + 1}${target.isNew ? ', 신규' : ', 덮어쓰기'})`,
  );
  if (!decision.proceed) {
    lines.push(`❌ ${head}`);
    for (const r of decision.reasons) lines.push('   · ' + r);
    lines.push(t('★ 已拒绝落盘：改动只在内存里，磁盘上的文件一个字节都没动。', '★ Not written to disk: the change exists only in memory; the file on disk is untouched.', '★ ディスクへの書き込みを拒否しました：変更はメモリ内だけにあり、ディスク上のファイルは 1 バイトも変わっていません。', '★ 디스크 쓰기를 거부했습니다: 변경은 메모리 안에만 있고, 디스크의 파일은 1바이트도 바뀌지 않았습니다.'));
    const out               = { ok: false, lines, persisted: null };
    toast('error', t('自检不过 ⇒ 拒绝写盘', 'Self-check failed - write refused', '自己チェックに不合格 ⇒ ディスクへの書き込みを拒否', '자체 검사 불합격 ⇒ 디스크 쓰기 거부'), `${head}\n${decision.reasons.join('\n')}`);
    return out;
  }
  lines.push(
    t(`✅ ${head}：${humanBytes(block.length)} · ${decision.passed.join(' · ')}`, `✅ ${head}: ${humanBytes(block.length)} · ${decision.passed.join(' · ')}`, `✅ ${head}：${humanBytes(block.length)} · ${decision.passed.join(' · ')}`, `✅ ${head}: ${humanBytes(block.length)} · ${decision.passed.join(' · ')}`),
  );

  // ⑤⑥ 落盘（★ 0.25：抽成 `persistCardChange()` —— 删除槽也要走同一条路）
  // ⚠ 这两个前缀是**标记**（不是给人读的句子）：中文与英文两种语言下都照旧用同一对符号
  const changeLines = lines.filter((l) => l.startsWith('✅') || l.startsWith('⚠'));
  const saved = await persistCardChange({ lc, changes: changeLines });
  lines.push(...saved.lines);
  // ★ 0.41：`cancelled` **必须原样透传** —— 这里原来是 `{ ok, lines, persisted }`，把"用户在确认框里
  //   按了取消"这个事实丢掉了 ⇒ 界面只能报"被拒绝（见右侧日志）"，而其实什么都没失败。
  //   （无头 E2E 抓到的：日志里明明写着"（用户在确认框里按了取消 ⇒ 未落盘）"，状态行却说"被拒绝"。）
  return { ok: saved.ok, cancelled: saved.cancelled, lines, persisted: saved.persisted };
}

/**
 * ★ 0.25 新增：**落盘**（写入与删除共用）。
 *
 * 顺序（SPEC.md §八）：
 *   ① ★ **写前查"这张卡在磁盘上是不是被别人改过了"** —— 变了就**拒绝**，并把
 *      "哪个文件、什么时候变的、接下来三步"一次说清（`logic/staleness.ts::staleFileRefusal()`）。
 *      来由：用户实测写槽 3 时 `createWritable()` 抛 `InvalidStateError`（PCSX2 一直开着、
 *      在工具读过卡之后又写过一次文件）；原来一路写到这一步才炸，用户拿到的只有一句英文错，
 *      而且"重试"必然再失败（句柄还是过期的）。
 *   ② 确认框（含"请先完全退出 PCSX2"）；
 *   ③ 有句柄就覆盖（拿不到写权限则降级成下载），没句柄就下载；
 *   ④ 覆盖后**回读文件**逐字节比对；成功时把文件新的状态记回 `lc.lastSeen`。
 *
 * `changes` 是给确认框看的改动摘要（一行一条）。
 */
async function persistCardChange(opts   
                                     
                             
                                                 
                             
 )                                                                      {
  const { lc, changes } = opts;
  const lines           = [];
  const overwrite = !!lc.handle;

  // ① 写前拦截：磁盘上的卡在我们读过之后被改过 ⇒ 拒绝（Chrome 也会拒，但那句英文没法照做）
  if (lc.handle && lc.lastSeen) {
    const now = await readStamp(lc.handle);
    if (now && stampChanged(lc.lastSeen, now)) {
      const text = staleFileRefusal({ fileName: lc.fileName, seen: lc.lastSeen, now });
      toast('error', t('这张卡在磁盘上又被改过了 ⇒ 拒绝写入', 'The card on disk was changed again - write refused', 'このカードはディスク上で再び変更されています ⇒ 書き込みを拒否', '이 카드는 디스크에서 다시 변경되었습니다 ⇒ 쓰기 거부'), text, 30_000);
      lines.push('❌ ' + text);
      return { ok: false, persisted: null, lines };
    }
  }

  // ② 确认框
  if (!opts.confirmedAlready) {
    const go = window.confirm(confirmWriteMessage({ fileName: lc.fileName, overwrite, changes }));
    if (!go) {
      toast('warn', t('已取消落盘', 'Writing to disk cancelled', 'ディスクへの書き込みを中止しました', '디스크 쓰기를 취소했습니다'), t('内存里的改动没有保存；磁盘上的文件没动。', 'The in-memory change was not saved; the file on disk is untouched.', 'メモリ内の変更は保存されておらず、ディスク上のファイルも変わっていません。', '메모리 내 변경은 저장되지 않았고, 디스크의 파일도 바뀌지 않았습니다.'));
      return {
        ok: false,
        cancelled: true,
        persisted: null,

/**
 * ★ 0.25 新增（用户要求）：**删完立刻写回记忆卡**。
 *
 * 在这之前删除只改内存副本，然后提示"用〔导出整卡〕或〔写入选中槽〕时才会落盘" ——
 * 用户的操作直觉是"删了就是删了"，所以现在一次做完：
 *
 *   ① 先问一次 —— 确认框里直接写明"**会立刻写回卡文件**"（外加那句 PCSX2 硬提示）；
 *   ② 在内存副本上删（`deleteSlotFile()`）；
 *   ③ 走**同一条** `persistCardChange()`：写前查句柄有没有过期 → 覆盖 → 回读文件逐字节比对。
 *      没有写句柄（只读打开）时，③ 会降级成"下载一份改好的卡"。

 * ⚠ 落盘失败时**内存里已经是删掉的状态** —— 返回值的 `deleted` 与 `ok` 分开报，
 *   调用方必须如实告诉用户"内存里删了，但磁盘上没动"（别让人以为卡上已经删了）。
 *
 * ★ 0.28：返回值多了 `cancelled` —— 用户在确认框里按取消时是 `true`。
 *   以前调用方靠"日志文本里有没有『取消』"来判断，那是**用界面文案驱动控制流**，
 *   英文界面下必然失效（`main.ts` 已改用它）。
 */
       async function deleteSlotAndSave(
  dirName        ,
  fileName        ,
)                                                                                                            {
  const lc = state.card;
  if (!lc) {
    return {
      ok: false,
      deleted: false,
      cancelled: false,
      persisted: null,
      lines: ['❌ ' + t('还没有打开记忆卡', 'No memory card loaded yet', 'まだメモリーカードを開いていません', '아직 메모리 카드를 열지 않았습니다')],
    };
  }

  // ★ 0.25：**删之前**先查一次（同一个理由：拒绝 = 什么都没发生，别把内存副本改脏）
  const stale = await preflightStale(lc);
  if (stale) return { ok: false, deleted: false, cancelled: false, persisted: null, lines: ['❌ ' + stale] };

  const go = window.confirm(
    confirmWriteMessage({
      fileName: lc.fileName,
      overwrite: !!lc.handle,
      changes: [
        t(`🗑 删除 ${dirName}\\${fileName}（它占的簇会被释放）`, `🗑 Delete ${dirName}\\${fileName} (the clusters it occupies will be released)`, `🗑 ${dirName}\\${fileName} を削除（このファイルが占めているクラスタは解放されます）`, `🗑 ${dirName}\\${fileName} 삭제(이 파일이 차지한 클러스터는 해제됩니다)`),
        t('★ 删除后会立刻写回卡文件（不再只是内存里的改动）。', '★ The card file is written back immediately after the delete (it is no longer just an in-memory change).', '★ 削除後はただちにカードファイルへ書き戻します（もうメモリ内だけの変更ではありません）。', '★ 삭제 후에는 즉시 카드 파일에 다시 씁니다(더 이상 메모리 안의 변경만이 아닙니다).'),
      ],
    }),
  );
  if (!go) {
    toast('warn', t('已取消删除', 'Delete cancelled', '削除を中止しました', '삭제를 취소했습니다'), t('磁盘与内存都没动。', 'Nothing on disk or in memory was changed.', 'ディスクもメモリも変更していません。', '디스크와 메모리 모두 변경되지 않았습니다.'));
    return {
      ok: false,
      deleted: false,
      // ★ 0.28：**结构化**地告诉调用方"用户按了取消"。
      //   以前调用方是拿日志文本 `lines.some((l) => l.includes('取消'))` 去猜的 ——
      //   那是"用界面文案驱动控制流"，双语化之后必然出错（英文界面里那行不含"取消"）。
      cancelled: true,
      persisted: null,
      lines: [t('（用户在确认框里按了取消 ⇒ 什么都没做）', '(the user cancelled in the confirmation box - nothing was done)', '（ユーザーが確認ダイアログでキャンセルしました ⇒ 何も行っていません）', '(사용자가 확인 대화상자에서 취소했습니다 ⇒ 아무것도 하지 않았습니다)')],
    };
  }

  const r = deleteSlotFile(dirName, fileName);
  if (!r.ok) return { ok: false, deleted: false, cancelled: false, persisted: null, lines: ['❌ ' + r.message] };

  const lines = ['✅ ' + r.message];
  // 已经问过了（上面那个确认框把"会写回卡"一起问了）⇒ 这里不再弹第二次
  const saved = await persistCardChange({ lc, changes: [r.message], confirmedAlready: true });
  lines.push(...saved.lines);
  return { ok: saved.ok, deleted: true, cancelled: false, persisted: saved.persisted, lines };
}


/** Blob → URL → 一个隐藏的 `<a download>`（SPEC.md §三 降级流程）—— 导出整卡与导出 PNG 共用。 */
function downloadBlob(blob      , fileName        )       {
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = fileName;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 30_000);
}

/** 下载一份卡（降级路径：拿不到"保存"对话框时用）。 */
       function downloadCard(bytes            , fileName        )       {
  downloadBlob(new Blob([bytes], { type: 'application/octet-stream' }), fileName);
}

/** 导出 PNG。 */
       async function exportPng(bytes                   , w        , h        , name        )                {
  const cv = document.createElement('canvas');
  cv.width = w;
  cv.height = h;
  const ctx = cv.getContext('2d')                            ;
  ctx.putImageData(new ImageData(bytes, w, h), 0, 0);
  const blob              = await new Promise((res) => cv.toBlob((b) => res(b), 'image/png'));
  if (!blob) throw new Error(t('canvas.toBlob() 返回 null（内存不足？）', 'canvas.toBlob() returned null (out of memory?)', 'canvas.toBlob() が null を返しました（メモリ不足？）', 'canvas.toBlob()가 null을 반환했습니다(메모리 부족?)'));
  downloadBlob(blob, name);
}
